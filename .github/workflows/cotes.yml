name: Cotes
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cotes.yml']
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: TCGdex en masse
        run: |
          curl -sS https://api.tcgdex.net/v2/fr/cards -o fr.json; python3 -c "import json; d=json.load(open('fr.json')); print('cartes fr', len(d), d[:2])"
          curl -sS https://api.tcgdex.net/v2/en/cards -o en.json; python3 -c "import json; d=json.load(open('en.json')); print('cartes en', len(d))"
          curl -sS -X POST https://api.tcgdex.net/v2/graphql -H 'content-type: application/json' \
            -d '{"query":"{ cards(pagination:{page:1,itemsPerPage:3}) { id name pricing { cardmarket { avg7 avg30 trend } } } }"}' | head -c 1200; echo
          curl -sS -X POST https://api.tcgdex.net/v2/graphql -H 'content-type: application/json' \
            -d '{"query":"{ set(id:\"me02\") { name cards { id } } }"}' | head -c 300; echo
          curl -sS https://api.tcgdex.net/v2/fr/sets/me02 | head -c 600; echo
          time (for i in $(seq 1 20); do curl -s -o /dev/null https://api.tcgdex.net/v2/fr/cards/me02-$(printf %03d $i); done)
