name: Cotes
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cotes.yml']
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Archives tcgcsv disponibles
        run: |
          curl -sS https://tcgcsv.com/last-updated.txt; echo
          for d in 2026-09-10 2026-09-15 2026-09-16 2026-09-17 2026-09-18 2026-09-25 2026-10-01 2026-10-02 2026-10-03; do
            echo "$d $(curl -s -o /dev/null -w '%{http_code} %{size_download}' -r 0-0 https://tcgcsv.com/archive/tcgplayer/prices-$d.ppmd.7z)"
          done
          curl -sSI https://tcgcsv.com/archive/tcgplayer/prices-2026-10-02.ppmd.7z | head -12
          which 7z 7za || true
      - name: TCGdex (Cardmarket)
        run: curl -sS https://api.tcgdex.net/v2/fr/cards/me02-130 | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('name'), json.dumps(d.get('pricing'))[:800])"
