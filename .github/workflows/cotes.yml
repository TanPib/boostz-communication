# Relevé des cotes Cardmarket de toutes les cartes Pokémon, le 1er et le 16 de
# chaque mois, et top des plus fortes évolutions depuis le relevé précédent ;
# relevé des prix TCGplayer des scellés des 8 jeux (outils/scelles.py).
# Sert la série « Les 10 cotes qui bougent » (voir TYPES.md). Lancement manuel
# possible : Actions > Cotes > Run workflow.
name: Cotes
on:
  schedule:
    # 05:17 UTC : Cardmarket a publié les chiffres de la veille, et une minute
    # hors de l'heure pile évite la file d'attente de GitHub.
    - cron: '17 5 1,16 * *'
  workflow_dispatch:
    inputs:
      etape:
        description: 'releve (relevé des cartes et des scellés, puis classement), top (classement seul) ou scelles (relevé des scellés seul)'
        default: releve
permissions:
  contents: write
concurrency: cotes
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'schedule' || inputs.etape == 'releve'
        run: python3 outils/cotes.py releve
      - if: github.event_name == 'schedule' || inputs.etape != 'scelles'
        run: python3 outils/cotes.py top
      # Sealed products for « Le radar des scellés »: a failure here must not
      # lose the card record above, which is committed either way.
      - if: github.event_name == 'schedule' || inputs.etape != 'top'
        continue-on-error: true
        run: python3 outils/scelles.py releve
      - name: Enregistrer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add donnees/cotes
          if [ -d donnees/scelles ]; then git add donnees/scelles; fi
          git diff --cached --quiet || git commit -q -m "Relevé des cotes du $(date -u +%d/%m/%Y)"
          git pull -q --rebase && git push -q
