# Saves the body of a web page or an API answer (card lists, rarities), which
# the cloud container cannot reach, into donnees/pages/<nom>. Several at once
# with lot, one "nom | url" per line. Run by hand: Actions > Page > Run workflow.
name: Page
on:
  workflow_dispatch:
    inputs:
      lot:
        description: One "nom | url" per line (nom with its extension, e.g. op09.html)
        required: true
permissions:
  contents: write
jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          LOT: ${{ inputs.lot }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          os.makedirs('donnees/pages', exist_ok=True)
          ok = 0
          for line in os.environ['LOT'].replace(';;', '\n').splitlines():
              parts = [x.strip() for x in line.split('|')]
              if len(parts) < 2 or not parts[0]:
                  continue
              nom, url = parts[0], parts[1]
              try:
                  assert re.fullmatch(r'[a-z0-9.-]+', nom), 'nom: lowercase letters, digits, dots and dashes'
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36', 'Accept': 'application/json, text/html;q=0.9, */*;q=0.8', 'Accept-Language': 'fr,en;q=0.8'})
                  data = urllib.request.urlopen(req, timeout=60).read()
                  open(f'donnees/pages/{nom}', 'wb').write(data)
                  print(nom, len(data), 'bytes'); ok += 1
              except Exception as e:
                  print('FAILED', nom, type(e).__name__, e)
          raise SystemExit(0 if ok else 1)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add donnees/pages
          git diff --cached --quiet || git commit -q -m "Save pages for a post"
          for i in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done; exit 1
