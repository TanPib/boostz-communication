<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>BoostZ storyboard Z</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Storyboard of the « Z » film (asked on 07/11/2026): a dark nebula, a spark
// that beats like a heart, faster and faster, becomes the Z of BoostZ, breaks
// reality, then slips into the real world (a collector scanning, a convention,
// a shop and its QR code, friends trading) and ends in a young woman's phone,
// which she throws up in joy; the camera locks on the phone, the app scrolls,
// and the end card says « BoostZ, ton compagnon TCG, le 14 janvier ».
// Sketches only, to agree the shots before any generation (Higgsfield).
// Render: node rendu.mjs storyboard-z.html images
document.head.insertAdjacentHTML('beforeend', `<style>
  .p { width: 1800px; height: 960px; background: #F4F1FA; }
  .pan { position: absolute; width: 300px; }
  .fr { width: 300px; height: 533px; border-radius: 18px; overflow: hidden; position: relative; background: #0B0812; box-shadow: 0 8px 24px rgba(27,19,48,.25); }
  .cap { font-family: 'DM Sans'; font-weight: 700; color: #1B1330; font-size: 15px; line-height: 1.35; margin-top: 12px; }
  .num { font-family: Outfit; font-weight: 800; color: #7C3AED; font-size: 22px; }
  .tc { font-family: 'DM Sans'; font-weight: 700; color: #8A8399; font-size: 13px; letter-spacing: .08em; }
  .note { font-family: 'DM Sans'; font-weight: 500; color: #625B78; font-size: 13.5px; line-height: 1.35; margin-top: 4px; }
</style>`);
const V = '#7C3AED', GR = ['#FF4FA0', '#8B3DFF', '#3AA9FF'];
let n = 0; const uid = () => 'sb' + n++;
// Drawing helpers, in a 300 x 533 frame.
const svg = (inner, bg = '#0B0812') => { const g = uid(); return `<svg width="300" height="533" viewBox="0 0 300 533"><defs>
  <radialGradient id="${g}n1" cx=".3" cy=".3" r=".6"><stop offset="0" stop-color="#5B21B6" stop-opacity=".8"/><stop offset="1" stop-color="#0B0812" stop-opacity="0"/></radialGradient>
  <radialGradient id="${g}n2" cx=".75" cy=".7" r=".55"><stop offset="0" stop-color="#1E3A8A" stop-opacity=".7"/><stop offset="1" stop-color="#0B0812" stop-opacity="0"/></radialGradient>
  <radialGradient id="${g}n3" cx=".6" cy=".2" r=".4"><stop offset="0" stop-color="#BE185D" stop-opacity=".45"/><stop offset="1" stop-color="#0B0812" stop-opacity="0"/></radialGradient>
  <radialGradient id="${g}sp"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#E9D5FF"/><stop offset="1" stop-color="#8B3DFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="${g}z" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${GR[0]}"/><stop offset=".55" stop-color="${GR[1]}"/><stop offset="1" stop-color="${GR[2]}"/></linearGradient>
  </defs><rect width="300" height="533" fill="${bg}"/>${inner.replace(/#G/g, g)}</svg>`; };
const nebula = `<rect width="300" height="533" fill="url(##Gn1)"/><rect width="300" height="533" fill="url(##Gn2)"/><rect width="300" height="533" fill="url(##Gn3)"/>${Array.from({ length: 60 }, (_, i) => `<circle cx="${(i * 97) % 300}" cy="${(i * 53 + i * i) % 533}" r="${i % 7 ? .8 : 1.6}" fill="#fff" opacity="${.3 + (i % 5) * .12}"/>`).join('')}`;
const spark = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r * 3}" fill="url(##Gsp)"/><path d="M${x} ${y - r * 1.6} Q${x + r * .2} ${y - r * .2} ${x + r * 1.6} ${y} Q${x + r * .2} ${y + r * .2} ${x} ${y + r * 1.6} Q${x - r * .2} ${y + r * .2} ${x - r * 1.6} ${y} Q${x - r * .2} ${y - r * .2} ${x} ${y - r * 1.6}Z" fill="#fff"/>`;
const Z = (x, y, s, op = 1) => `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}">${[[GR[2], -16, .25], [GR[1], -10, .4], [GR[0], -5, .6]].map(([c, d, o]) => `<path d="M-30 -36 H30 V-24 L-12 24 H30 V36 H-30 V24 L12 -24 H-30 Z" transform="translate(${d} 0) skewX(-8)" fill="${c}" opacity="${o}"/>`).join('')}<path d="M-30 -36 H30 V-24 L-12 24 H30 V36 H-30 V24 L12 -24 H-30 Z" transform="skewX(-8)" fill="url(##Gz)"/></g>`;
const trail = (d, w = 6) => `<path d="${d}" fill="none" stroke="url(##Gz)" stroke-width="${w}" stroke-linecap="round" opacity=".9"/><path d="${d}" fill="none" stroke="#fff" stroke-width="${w * .3}" stroke-linecap="round" opacity=".8"/>`;
// Simple figures: head, body, arms (sketch style, flat).
const person = (x, y, s, o = {}) => { const c = o.c || '#3B3254', skin = o.skin || '#C9A48A';
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-34 120 Q-36 40 0 36 Q36 40 34 120 Z" fill="${c}"/><circle cx="0" cy="12" r="22" fill="${skin}"/>${o.hair ? `<path d="M-23 8 Q-20 -18 0 -14 Q22 -18 24 10 Q26 40 18 52 L14 20 Q0 6 -14 20 L-18 52 Q-28 36 -23 8Z" fill="${o.hair}"/>` : `<path d="M-22 4 Q-18 -14 2 -12 Q22 -12 22 6 Q10 -2 -22 4Z" fill="#2A2236"/>`}${o.smile ? `<path d="M-9 20 Q0 30 9 20" stroke="#5A3A2A" stroke-width="3" fill="none" stroke-linecap="round"/>` : ''}${o.arms || ''}</g>`; };
const phone = (x, y, w, r = 0, screen = '#1B1330', glow = false) => `<g transform="translate(${x} ${y}) rotate(${r})">${glow ? `<circle cx="0" cy="0" r="${w * 1.2}" fill="url(##Gsp)" opacity=".7"/>` : ''}<rect x="${-w / 2}" y="${-w}" width="${w}" height="${w * 2}" rx="${w * .16}" fill="#0B0812" stroke="#fff" stroke-width="2"/><rect x="${-w / 2 + 3}" y="${-w + 3}" width="${w - 6}" height="${w * 2 - 6}" rx="${w * .13}" fill="${screen}"/></g>`;
const cardR = (x, y, w, r = 0, c = '#6D28D9') => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="${-w / 2}" y="${-w * .7}" width="${w}" height="${w * 1.4}" rx="${w * .08}" fill="${c}" stroke="#fff" stroke-width="2"/><rect x="${-w * .38}" y="${-w * .58}" width="${w * .76}" height="${w * .6}" rx="3" fill="rgba(255,255,255,.25)"/></g>`;
const room = (wall, floor) => `<rect width="300" height="533" fill="${wall}"/><rect y="360" width="300" height="173" fill="${floor}"/>`;

const PANELS = [
  ['1', '0:00 – 0:02', 'La nébuleuse.', 'Galaxie nébuleuse sombre, violets et bleus profonds, lent travelling avant. Silence, grondement sourd.', svg(nebula)],
  ['2', '0:02 – 0:04', 'Une étincelle s’allume.', 'Au centre, une minuscule étincelle s’allume et clignote : un, deux… comme un battement de cœur. Son : « boum-boum ».', svg(nebula + spark(150, 266, 7))],
  ['3', '0:04 – 0:06', 'Le battement s’accélère.', 'Les battements se rapprochent, l’étincelle grossit, chaque pulsation envoie une onde de lumière dans la nébuleuse.', svg(nebula + [60, 100, 140].map((r, i) => `<circle cx="150" cy="266" r="${r}" fill="none" stroke="#C4B5FD" stroke-width="${3 - i}" opacity="${.6 - i * .15}"/>`).join('') + spark(150, 266, 16))],
  ['4', '0:06 – 0:07', 'C’est le Z.', 'Dernier battement : l’étincelle se révèle, c’est le Z de BoostZ, avec ses trois Z fantômes. Flash.', svg(nebula + `<circle cx="150" cy="266" r="150" fill="url(##Gsp)" opacity=".6"/>` + Z(150, 266, 1.6))],
  ['5', '0:07 – 0:08', 'Le Z fait exploser la réalité.', 'Le Z traverse l’espace qui se brise comme du verre ; par les éclats, on voit déjà le monde réel. Flash blanc, coupe.', svg(nebula + Array.from({ length: 14 }, (_, i) => { const a = i * Math.PI / 7, r1 = 40, r2 = 260; return `<path d="M${150 + r1 * Math.cos(a)} ${266 + r1 * Math.sin(a)} L${150 + r2 * Math.cos(a + .08)} ${266 + r2 * Math.sin(a + .08)} L${150 + r2 * Math.cos(a - .12)} ${266 + r2 * Math.sin(a - .12)}Z" fill="${i % 3 ? '#E9E4F5' : '#B9A98F'}" opacity=".5"/>`; }).join('') + Z(150, 266, 1.3))],
  ['6', '0:08 – 0:11', 'Chez un collectionneur.', 'Bureau, classeur ouvert, lampe chaude. Il scanne une carte avec son téléphone ; la traînée du Z entre dans l’écran ; il sourit jusqu’aux oreilles.', svg(room('#3A2E26', '#5A4636') + `<rect x="20" y="330" width="260" height="20" rx="4" fill="#7A5C44"/>` + person(150, 200, 1.2, { c: '#2F4A6E', smile: true }) + cardR(110, 318, 44, -8) + phone(185, 300, 30, 10, '#2A1458', true) + trail('M300 120 Q240 160 200 280', 5))],
  ['7', '0:11 – 0:14', 'Dans une convention.', 'Grande salle, rangées de tables de tournoi, joueurs concentrés, bannières. Le Z file au-dessus des tables, les joueurs lèvent la tête.', svg(room('#20253A', '#2F3550') + [[60, 300], [150, 300], [240, 300]].map(([x, y]) => `<rect x="${x - 40}" y="${y + 40}" width="80" height="12" rx="3" fill="#8A93B0"/>` + person(x, y - 20, .55, { c: ['#7A2E3A', '#2E5A3A', '#4A3A7A'][x % 3] })).join('') + `<rect x="30" y="40" width="70" height="110" rx="4" fill="${V}" opacity=".7"/><rect x="200" y="40" width="70" height="110" rx="4" fill="#3AA9FF" opacity=".5"/>` + trail('M0 220 Q150 120 300 200', 6) + Z(230, 180, .45))],
  ['8', '0:14 – 0:17', 'Dans une boutique.', 'Boutique de jeux, étagères de displays. Sur le comptoir, le présentoir QR BoostZ ; une cliente le scanne, le Z rebondit du QR dans son téléphone.', svg(room('#2E2440', '#463A52') + [80, 150, 220].map((y) => `<rect x="10" y="${y}" width="280" height="8" fill="#6B5A80"/>` + [30, 80, 130, 180, 230].map((x) => `<rect x="${x}" y="${y - 36}" width="36" height="36" rx="3" fill="${['#F2706C', '#F5C93B', '#35C6BC', '#B189E8', '#58A6DD'][(x + y) % 5]}" opacity=".8"/>`).join('')).join('') + `<rect x="20" y="330" width="260" height="30" fill="#7A6890"/><rect x="60" y="270" width="54" height="66" rx="6" fill="#fff"/><rect x="69" y="279" width="36" height="36" fill="#1B1330"/><text x="87" y="330" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="9" fill="${V}">boostZ</text>` + person(205, 230, .9, { c: '#C2416C', hair: '#3A2418', skin: '#E0B89A' }) + phone(160, 280, 22, -20, '#2A1458', true) + trail('M88 300 Q120 250 158 275', 4))],
  ['9', '0:17 – 0:20', 'Un échange entre potes.', 'Terrasse de café ou banc, deux amis s’échangent des cartes ; le Z passe d’une main à l’autre, comme une étincelle de complicité.', svg(room('#3D5A6E', '#6E7F6A') + person(85, 220, 1, { c: '#4A6A3A', smile: true }) + person(215, 220, 1, { c: '#8A4A2A', smile: true, hair: '#1E1E1E' }) + cardR(125, 300, 36, -12) + cardR(175, 300, 36, 12, '#2563EB') + trail('M110 290 Q150 240 190 290', 4) + Z(150, 255, .35))],
  ['10', '0:20 – 0:22', 'Le Z plonge dans son téléphone.', 'Dans la rue, une jeune femme regarde son téléphone ; le Z y plonge en traînée de lumière ; l’écran s’illumine, elle éclate de joie.', svg(room('#5A4A6E', '#3A3448') + person(150, 210, 1.3, { c: '#6D28D9', hair: '#5A3018', skin: '#E8C2A4', smile: true }) + phone(175, 290, 34, -10, '#C4B5FD', true) + trail('M0 80 Q120 120 172 285', 6))],
  ['11', '0:22 – 0:23,5', 'Elle jette son téléphone en l’air.', 'Ralenti : elle lance le téléphone vers le ciel, bras levés, cheveux en mouvement. Le téléphone tournoie, lumineux.', svg(room('#5A4A6E', '#3A3448') + person(150, 320, 1.1, { c: '#6D28D9', hair: '#5A3018', skin: '#E8C2A4', smile: true, arms: `<path d="M-30 60 L-60 -40 M30 60 L60 -40" stroke="#6D28D9" stroke-width="14" stroke-linecap="round"/>` }) + `<path d="M150 260 Q160 160 200 110" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 7" opacity=".6"/>` + phone(205, 95, 30, 35, '#C4B5FD', true))],
  ['12', '0:23,5 – 0:27', 'L’image se fige sur le téléphone.', 'La caméra suit le téléphone en l’air jusqu’à remplir l’écran ; dedans, l’appli BoostZ défile vite : collection, cote, scellés, échanges. Vraies captures incrustées.', svg(`<rect width="300" height="533" fill="#2A2238"/>` + phone(150, 266, 118, 4, '#1B1330') + `<rect x="98" y="160" width="104" height="40" rx="8" fill="#3B1D7A"/><text x="150" y="187" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="20" fill="#fff">150 €</text>` + [0, 1, 2, 3].map((i) => `<rect x="98" y="${215 + i * 42}" width="104" height="32" rx="6" fill="#2A2140"/>`).join('') + `<text x="150" y="400" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="11" fill="#C4B5FD">CAPTURE RÉELLE DE L’APPLI</text>`)],
  ['13', '0:27 – 0:30', 'La fin.', 'Le téléphone s’efface, la nébuleuse revient ; le logo boostZ, puis « Ton compagnon TCG », « le 14 janvier ». Musique qui retombe, un dernier battement.', svg(nebula + `<circle cx="150" cy="230" r="120" fill="url(##Gsp)" opacity=".35"/><text x="150" y="250" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="56" fill="#fff">boost<tspan fill="url(##Gz)">Z</tspan></text><text x="150" y="300" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="18" fill="#C4B5FD">Ton compagnon TCG</text><text x="150" y="340" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="26" fill="#fff">le 14 janvier</text>`)]
];
const sheet = (list, title) => `<div class="abs" style="left:60px;top:40px;font-family:Outfit;font-weight:800;font-size:34px;color:#1B1330">${title}</div>
  <div class="abs" style="left:60px;top:88px;font-family:'DM Sans';font-weight:600;font-size:16px;color:#625B78">Storyboard, 9:16, environ 30 secondes. Croquis de travail : aucune génération avant validation.</div>
  ${list.map(([num, tc, t, note, fr], i) => `<div class="pan" style="left:${60 + (i % 5) * 340}px;top:${140}px"><div class="fr">${fr}</div><div class="cap"><span class="num">${num}</span> <span class="tc">${tc}</span><br>${t}</div><div class="note">${note}</div></div>`).join('')}`;
carousel([['planche-1', sheet(PANELS.slice(0, 5), 'Le Z · 1/3 · L’éveil')], ['planche-2', sheet(PANELS.slice(5, 10), 'Le Z · 2/3 · Le monde réel')], ['planche-3', sheet(PANELS.slice(10), 'Le Z · 3/3 · La révélation')]]);
</script></body></html>
