<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz cotes qui bougent</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
<!-- window.TOP: one top-AAAA-MM-JJ.json written by outils/cotes.py, wrapped as
     `window.TOP = {...};` (a page opened from file:// cannot fetch a JSON file). -->
<script src="cotes-donnees.js"></script>
</head><body><script>
// "Les 10 cotes qui bougent": a cover, the countdown from 10th to 1st, a recap
// to save. Sticker style (stickers.js) since edition 1 (16/10/2026). A Pokémon
// edition, so the filled blocks take Pokémon's colour; up and down keep theirs.
// The page's publication date for closing(): set window.PUB before rendering.
window.PUB = window.PUB || '2026-10-20';
const UP = '#5FD3A3', DOWN = '#F0899A', GAME = 'pokemon', GC = GAMES[GAME][1];
const T = window.TOP;
const euro = (v) => v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' €';
const pct = (v) => (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', ',') + ' %';
const day = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);
// The two prices being compared, named for what they are in each mode.
const SPAN = T.debut ? { a: `le ${day(T.debut)}`, b: `le ${day(T.fin)}` } : { a: 'moyenne 30 jours', b: 'moyenne 7 jours' };
// The 1st-16th rhythm gives 13 to 16 days: say the real count, not a round 15.
const DAYS = T.debut ? Math.round((new Date(T.fin) - new Date(T.debut)) / 864e5) : 0;
const PERIOD = T.debut ? `du ${day(T.debut)} au ${day(T.fin)}` : `au ${day(T.fin)}`;
const SRC = T.debut
  ? `Cardmarket via TCGdex, prix de vente moyen sur 30 jours, relevés Boostz du ${day(T.debut)} et du ${day(T.fin)}/${T.fin.slice(0, 4)}. Cartes à plus de ${T.seuil_eur} € dont les quatre indicateurs Cardmarket vont dans le même sens, sans vente isolée.`
  : `Cardmarket via TCGdex au ${day(T.fin)}/${T.fin.slice(0, 4)} : prix de vente moyen des 7 derniers jours comparé à celui des 30 derniers jours. Cartes à plus de ${T.seuil_eur} €.`;
const img = (c) => `../donnees/cotes/pokemon/images/${c.id}.png`;
const fit = (s, big, small, max) => s.length > max ? small : big;
const RANKED = T.mouvements;
const SLIDES = [];

// 1 - Cover: the three biggest moves stuck on, the title, the period.
SLIDES.push(['01-couverture', `${ghosts([[80, 1110, 80, -6], [930, 1080, 80, 8]])}${track(0, 1180, .5)}${head('LES COTES QUI BOUGENT', GAME, 'Cotes Cardmarket')}
  <div class="abs h" style="left:0;top:170px;width:1080px;text-align:center;font-size:92px">Les 10 cotes<br><span class="acc">qui ont le plus bougé</span></div>
  <div class="abs mut" style="left:0;top:395px;width:1080px;text-align:center;font-weight:600;font-size:36px">${T.debut ? `en ${DAYS} jours, ` + PERIOD : 'cette semaine, ' + PERIOD}</div>
  ${card(img(RANKED[2]), 150, 520, 290, -10)}${card(img(RANKED[1]), 640, 520, 290, 10)}${card(img(RANKED[0]), 380, 480, 320, 0, 3)}
  ${st(690, 450, 300, 110, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:56px;color:${DARK}">${pct(RANKED[0].evolution)}</div>`, { fill: RANKED[0].evolution > 0 ? UP : DOWN, r: 7, z: 4 })}
  <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div>
  <div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`]);

// 2 to 11 - The countdown, 10th to 1st: the card, then the two prices and the move.
RANKED.map((c, i) => [c, i + 1]).reverse().forEach(([c, rank], k) => {
  const col = c.evolution > 0 ? UP : DOWN;
  const delta = c.apres - c.avant;
  // A two-point slope: the honest chart for two records, nothing invented in between.
  const y0 = c.evolution > 0 ? 150 : 40, y1 = c.evolution > 0 ? 40 : 150;
  SLIDES.push([`${String(12 - rank).padStart(2, '0')}-rang-${rank}`, `${track(k + 1, 820, .35)}${head('LES 10 COTES QUI BOUGENT', GAME, 'Cotes Cardmarket')}
    ${card(img(c), 70, 190, 420, -3)}
    ${disc(560, 200, 190, GC, `<div class="h" style="font-size:118px;color:${DARK};line-height:1">${rank}</div>`, 6)}
    <div class="abs" style="left:560px;top:430px;width:450px">
      <div class="h" style="font-size:${fit(c.nom, 60, 46, 16)}px">${c.nom}</div>
      <div class="mut" style="font-weight:600;font-size:28px;margin-top:12px;line-height:1.3">${c.set}<br>n° ${c.numero}${c.rarete ? ' · ' + c.rarete : ''}</div>
    </div>
    ${st(70, 880, 940, 300, `<div style="padding:34px 46px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div><div class="lab mut" style="font-size:22px;letter-spacing:3px">${SPAN.a.toUpperCase()}</div><div class="h" style="font-size:54px;margin-top:6px">${euro(c.avant)}</div></div>
        <svg width="230" height="190" viewBox="0 0 250 190" style="margin-top:-8px"><line x1="20" y1="${y0}" x2="230" y2="${y1}" stroke="${col}" stroke-width="9" stroke-linecap="round"/><circle cx="20" cy="${y0}" r="14" fill="#1D1730" stroke="${INK}" stroke-width="6"/><circle cx="230" cy="${y1}" r="16" fill="${col}" stroke="${INK}" stroke-width="6"/></svg>
        <div style="text-align:right"><div class="lab mut" style="font-size:22px;letter-spacing:3px">${SPAN.b.toUpperCase()}</div><div class="h" style="font-size:54px;margin-top:6px;color:${col}">${euro(c.apres)}</div></div>
      </div>
      <div style="display:flex;align-items:baseline;gap:24px;margin-top:-6px"><span class="h" style="font-size:84px;color:${col}">${c.evolution > 0 ? '▲' : '▼'} ${pct(c.evolution)}</span><span class="ui mut" style="font-size:32px">${delta > 0 ? '+' : '−'}${euro(Math.abs(delta))}</span></div>
    </div>`, { r: -1, z: 3 })}
    <div class="src">${SRC}</div>`]);
});

// 12 - The whole list on one slide (the one people save), then Boostz.
SLIDES.push(['12-recap', `${head('LE RÉCAP', GAME, 'Cotes Cardmarket')}
  <div class="abs h" style="left:70px;top:150px;font-size:64px">Les 10 cotes qui bougent</div>
  <div class="abs mut" style="left:70px;top:232px;font-weight:600;font-size:30px">Pokémon · Cardmarket · ${PERIOD}</div>
  ${st(70, 300, 940, 700, `<div style="padding:18px 34px">${RANKED.map((c, i) => `<div style="display:flex;align-items:center;gap:22px;height:66px;${i < 9 ? 'border-bottom:2px solid rgba(255,255,255,.08)' : ''}">
    <span class="h" style="width:56px;font-size:40px;color:${GC}">${i + 1}</span>
    <span class="ui" style="flex:1;font-size:29px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.nom} <span class="mut" style="font-weight:600;font-size:23px">· ${c.set}</span></span>
    <span class="h" style="font-size:36px;color:${c.evolution > 0 ? UP : DOWN}">${c.evolution > 0 ? '▲' : '▼'} ${pct(c.evolution)}</span></div>`).join('')}</div>`, { z: 3 })}
  ${closing(1040, 64)}
  <div class="src" style="bottom:20px;font-size:17px">${SRC}</div>`]);

carousel(SLIDES);
</script></body></html>
