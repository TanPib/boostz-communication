<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz types de collectionneurs</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
window.PUB = '2027-02-22';
// "Les types de collectionneurs" (asked on 08/10/2026: animated, with little
// characters "inspiré du style Animal Crossing"): each type is one of our own
// characters acting out its habit. No licensed character, no realistic face.
// Humour, so no figures and no source line. Episode 1: four types.
// Characters in a soft, cosy village-game look: a big round head, a small
// body, shiny dot eyes, pastel colours, thin outlines a shade darker than the
// fill, a soft shadow on the ground. Every id is prefixed so a character can
// be drawn twice.
const SKIN = '#FCE3CC', SKIN_D = '#E3B08F', WHITE = '#FFFFFF', EYE = '#3A2A2E';
const C1 = '#B9A6F2', C2 = '#F59A8C', C3 = '#7FB8EE', C4 = '#8FD9A8';
const shade = { [C1]: '#8C76D6', [C2]: '#D9705F', [C3]: '#4F8FCF', [C4]: '#5DB07C' };
const sin = Math.sin, PI = Math.PI;
const $ = (id) => document.getElementById(id);
const lerp = (a, b, u) => a + (b - a) * clamp(u);
const line = (c) => `stroke="${c}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
const ground = `<ellipse cx="200" cy="548" rx="120" ry="20" fill="rgba(0,0,0,.28)"/>`;
const legs = (pants) => `<path d="M172 430 V512 M228 430 V512" stroke="${pants}" stroke-width="34" stroke-linecap="round"/>
  <ellipse cx="166" cy="526" rx="30" ry="18" fill="#6B4B3E" ${line('#4A322A')}/><ellipse cx="234" cy="526" rx="30" ry="18" fill="#6B4B3E" ${line('#4A322A')}/>`;
const torso = (c) => `<path d="M138 300 Q200 286 262 300 Q284 380 270 440 Q200 452 130 440 Q116 380 138 300 Z" fill="${c}" ${line(shade[c])}/>
  <path d="M176 296 L200 322 L224 296" fill="${WHITE}" ${line(shade[c])}/>`;
const face = (p, hair, extra = '') => `<g id="${p}head">
  <ellipse cx="200" cy="190" rx="128" ry="116" fill="${SKIN}" ${line(SKIN_D)}/>
  <ellipse cx="72" cy="200" rx="16" ry="22" fill="${SKIN}" ${line(SKIN_D)}/><ellipse cx="328" cy="200" rx="16" ry="22" fill="${SKIN}" ${line(SKIN_D)}/>
  ${hair}
  <g id="${p}eyes"><ellipse cx="156" cy="206" rx="14" ry="18" fill="${EYE}"/><ellipse cx="244" cy="206" rx="14" ry="18" fill="${EYE}"/>
    <circle cx="151" cy="199" r="5" fill="${WHITE}"/><circle cx="239" cy="199" r="5" fill="${WHITE}"/></g>
  <ellipse cx="128" cy="240" rx="20" ry="11" fill="#F7A1A8" opacity=".7"/><ellipse cx="272" cy="240" rx="20" ry="11" fill="#F7A1A8" opacity=".7"/>
  <path id="${p}mouth" d="M188 246 Q200 258 212 246" fill="none" stroke="${EYE}" stroke-width="5" stroke-linecap="round"/>${extra}</g>`;
const arm = (p, side, c) => `<line id="${p}armo${side}" stroke="${shade[c]}" stroke-width="40" stroke-linecap="round"/><line id="${p}armi${side}" stroke="${c}" stroke-width="30" stroke-linecap="round"/>
  <circle id="${p}hand${side}" r="19" fill="${SKIN}" ${line(SKIN_D)}/>`;
const setArm = (p, side, sx, sy, hx, hy) => { for (const k of ['armo', 'armi']) { const l = $(p + k + side); l.setAttribute('x1', sx); l.setAttribute('y1', sy); l.setAttribute('x2', hx); l.setAttribute('y2', hy); }
  $(p + 'hand' + side).setAttribute('cx', hx); $(p + 'hand' + side).setAttribute('cy', hy); };
const HAIR = {
  brown: `<path d="M74 196 Q62 66 200 60 Q338 66 326 196 Q312 132 262 120 Q250 150 210 138 Q186 156 150 132 Q100 136 74 196 Z" fill="#8A5A3C" ${line('#6A4229')}/>`,
  cap: `<path d="M76 188 Q70 112 110 92 L290 92 Q330 112 324 188 Q300 150 200 146 Q100 150 76 188 Z" fill="#F2B04E" ${line('#C98A2E')}/>
    <path d="M86 136 Q96 50 200 48 Q304 50 314 136 Q200 118 86 136 Z" fill="${C2}" ${line(shade[C2])}/><path d="M298 128 Q336 120 360 136 Q340 150 304 146 Z" fill="${C2}" ${line(shade[C2])}/><circle cx="200" cy="52" r="10" fill="${WHITE}" ${line(shade[C2])}/>`,
  spiky: `<path d="M74 196 Q66 120 96 96 L92 54 L130 80 L150 36 L178 72 L206 30 L226 72 L258 40 L270 84 L306 62 L304 100 Q334 130 326 196 Q300 140 200 134 Q100 140 74 196 Z" fill="#E08A3C" ${line('#B4672A')}/>`,
  bob: `<path d="M70 230 Q52 70 200 62 Q348 70 330 230 Q320 250 304 246 Q312 160 280 130 Q200 160 120 130 Q88 160 96 246 Q80 250 70 230 Z" fill="#3C3346" ${line('#28212F')}/>`,
};

// 1 · The mint maniac: round glasses, a card in one hand, a magnifier in the other.
const mint = (p) => `${ground}<g id="${p}all">${legs('#5B5F8A')}${torso(C1)}
  <g transform="rotate(-6 150 390)"><rect x="98" y="326" width="96" height="134" rx="10" fill="${WHITE}" ${line('#C9C2DA')}/><rect x="108" y="338" width="76" height="60" rx="6" fill="#9A86E8"/><path d="M110 414 H182 M110 432 H162" stroke="#BDB4D6" stroke-width="6" stroke-linecap="round"/></g>
  ${arm(p, 'L', C1)}${arm(p, 'R', C1)}
  <g id="${p}loupe"><line x1="0" y1="0" x2="34" y2="36" stroke="#6B4B3E" stroke-width="14" stroke-linecap="round"/><circle cx="-14" cy="-14" r="36" fill="rgba(220,240,255,.45)" stroke="#9AA3B5" stroke-width="7"/></g>
  ${face(p, HAIR.brown, `<g fill="none" stroke="#6A4229" stroke-width="5"><circle cx="156" cy="206" r="30"/><circle cx="244" cy="206" r="30"/><path d="M186 204 H214"/></g>`)}
  <path id="${p}sweat" d="M318 112 Q332 136 318 148 Q304 136 318 112 Z" fill="#9FD3F5" ${line('#5FA7DA')} opacity="0"/></g>`;
const mintAt = (p, lt) => {
  const sweep = sin(lt * 2.4) * 46, hx = 236 + sweep, hy = 410 + sin(lt * 4.8) * 6;
  setArm(p, 'L', 152, 330, 122, 412); setArm(p, 'R', 248, 330, hx + 26, hy + 30);
  $(p + 'loupe').setAttribute('transform', `translate(${hx - 62} ${hy - 30})`);
  $(p + 'eyes').setAttribute('transform', `translate(${sweep * .12 - 4} 4)`);
  const shock = clamp((lt - 2.4) / .2) * (lt < 4.3 ? 1 : 0);
  $(p + 'sweat').setAttribute('opacity', shock);
  $(p + 'sweat').setAttribute('transform', `translate(0 ${shock ? (lt * 30) % 30 : 0})`);
  $(p + 'mouth').setAttribute('d', shock ? 'M190 256 Q200 244 210 256' : 'M188 246 Q200 258 212 246');
  $(p + 'all').setAttribute('transform', shock ? `rotate(${sin(lt * 40) * 2.5} 200 540)` : '');
};

// 2 · The one who opens everything in the shop's car park: a backwards cap, a booster, a burst of cards.
const FLY = [[-170, 330, -40], [-80, 420, 25], [20, 460, -15], [110, 410, 35], [190, 320, -30]];
const ouvreur = (p) => `${ground}<g id="${p}all">${legs('#4E6A8C')}${torso(C2)}
  <g id="${p}pack"><path d="M150 330 H250 V468 H150 Z" fill="#FFD66B" ${line('#D9A93A')}/><circle cx="200" cy="400" r="24" fill="none" stroke="#C98A2E" stroke-width="7"/><path d="M176 400 H224" stroke="#C98A2E" stroke-width="7"/></g>
  <path id="${p}top" d="M150 330 L250 330 L250 306 L150 306 Z" fill="#F7C04A" ${line('#C98A2E')}/>
  ${arm(p, 'L', C2)}${arm(p, 'R', C2)}
  ${face(p, HAIR.cap)}
  ${FLY.map((_, i) => `<rect id="${p}fly${i}" x="-34" y="-48" width="68" height="96" rx="8" fill="${['#B9A6F2', '#FFD66B', '#7ED8CF', WHITE, '#C9A8F0'][i]}" ${line('#8C76D6')} opacity="0"/>`).join('')}</g>`;
const ouvreurAt = (p, lt) => {
  const rip = clamp((lt - 1.3) / .25), u = clamp((lt - 1.4) / 1.6);
  const jump = lt > 1.3 && lt < 3.2 ? Math.abs(sin((lt - 1.3) * PI * 1.6)) * 60 : 0;
  $(p + 'all').setAttribute('transform', `translate(0 ${-jump})`);
  $(p + 'top').setAttribute('transform', `translate(${rip * 160 + u * 120} ${-rip * 140 + u * 260}) rotate(${rip * 70 + u * 200} 200 318)`);
  FLY.forEach(([vx, vy, r], i) => { const e = $(p + 'fly' + i); const k = clamp((lt - 1.45 - i * .04) / 1.7);
    e.setAttribute('opacity', k > 0 && k < 1 ? 1 : 0);
    e.setAttribute('transform', `translate(${200 + vx * k * 2.4} ${300 - vy * k * 2.2 + 900 * k * k}) rotate(${r * k * 6})`); });
  const up = clamp((lt - 1.4) / .3) * (lt < 3.6 ? 1 : 1 - clamp((lt - 3.6) / .4));
  setArm(p, 'L', 152, 330, lerp(156, 70, up), lerp(410, 250, up)); setArm(p, 'R', 248, 330, lerp(244, 330, up), lerp(410, 250, up));
  $(p + 'pack').setAttribute('transform', `translate(0 ${up * 24})`);
  $(p + 'mouth').setAttribute('d', up > .5 ? 'M184 242 Q200 272 216 242 Z' : 'M188 246 Q200 258 212 246');
  $(p + 'mouth').setAttribute('fill', up > .5 ? EYE : 'none');
};

// 3 · The sealed keeper: hugs a padlocked display box and turns away from any hand that comes near.
const gardien = (p) => `${ground}<g id="${p}all">${legs('#5C4E6E')}${torso(C3)}
  ${face(p, HAIR.bob)}
  <g><rect x="100" y="330" width="200" height="150" rx="16" fill="#A68BE6" ${line('#7A5FC4')}/><path d="M100 368 H300" stroke="#7A5FC4" stroke-width="5"/><rect x="172" y="398" width="56" height="46" rx="9" fill="#FFD66B" ${line('#C98A2E')}/><path d="M184 398 V386 A16 16 0 0 1 216 386 V398" fill="none" stroke="#C98A2E" stroke-width="7"/></g>
  ${arm(p, 'L', C3)}${arm(p, 'R', C3)}
  ${[0, 1, 2].map((i) => `<path id="${p}heart${i}" d="M0 8 C-14 -8 -30 6 0 28 C30 6 14 -8 0 8 Z" fill="#F7A1A8" ${line('#E07A86')} opacity="0"/>`).join('')}</g>
  <g id="${p}hand"><line x1="580" y1="380" x2="410" y2="396" stroke="#D9705F" stroke-width="40" stroke-linecap="round"/><line x1="580" y1="380" x2="410" y2="396" stroke="${C2}" stroke-width="30" stroke-linecap="round"/><circle cx="404" cy="396" r="19" fill="${SKIN}" ${line(SKIN_D)}/></g>`;
const gardienAt = (p, lt) => {
  const reach = clamp((lt - 1.2) / .6) * (1 - clamp((lt - 2.8) / .5));
  const away = clamp((lt - 1.5) / .3) * (1 - clamp((lt - 3.1) / .4));
  $(p + 'hand').setAttribute('transform', `translate(${240 - reach * 140} 0)`);
  $(p + 'hand').setAttribute('opacity', reach > 0 ? 1 : 0);
  $(p + 'all').setAttribute('transform', `translate(${-away * 50} 0) rotate(${-away * 7} 200 540)`);
  setArm(p, 'L', 152, 330, 112, 430); setArm(p, 'R', 248, 330, 288, 430);
  $(p + 'eyes').setAttribute('transform', away > .3 ? 'translate(-12 104) scale(1 .5)' : '');
  [0, 1, 2].forEach((i) => { const k = ((lt * .6 + i / 3) % 1), e = $(p + 'heart' + i);
    e.setAttribute('opacity', lt > .6 ? sin(PI * k) : 0); e.setAttribute('transform', `translate(${318 + i * 26 + sin(lt * 3 + i) * 12} ${440 - k * 150}) scale(${.8 + k * .4})`); });
};

// 4 · The chase hunter: opens booster after booster for one card, the empty
// packs pile up beside him, and he gets sadder each time.
const PILE = [[318, 506, -12], [372, 512, 10], [344, 470, 4], [300, 452, -20], [396, 466, 16], [360, 428, -6], [326, 404, 12]];
const chasseur = (p) => `${ground}<g id="${p}all">${legs('#4E5D6E')}${torso(C4)}
  ${PILE.map((_, i) => `<g id="${p}b${i}" opacity="0"><rect x="-30" y="-42" width="60" height="84" rx="6" fill="${['#FFD66B', '#B9A6F2', '#F59A8C', '#7ED8CF', '#FFD66B', '#C9A8F0', '#F59A8C'][i]}" ${line('#8C76D6')}/><path d="M-30 -30 L-18 -42 L-6 -32 L6 -42 L18 -32 L30 -42" fill="none" ${line('#8C76D6')}/></g>`).join('')}
  <g id="${p}pack"><path d="M156 336 H244 V456 H156 Z" fill="#FFD66B" ${line('#D9A93A')}/><circle cx="200" cy="396" r="20" fill="none" stroke="#C98A2E" stroke-width="6"/><path d="M180 396 H220" stroke="#C98A2E" stroke-width="6"/></g>
  ${arm(p, 'L', C4)}${arm(p, 'R', C4)}
  ${face(p, HAIR.spiky)}
  <path id="${p}tear" d="M140 230 Q148 248 140 256 Q132 248 140 230 Z" fill="#9FD3F5" ${line('#5FA7DA')} opacity="0"/></g>`;
const chasseurAt = (p, lt) => {
  // A pack every 0.42 s: ripped, checked, thrown on the pile.
  const n = PILE.filter((_, i) => lt > .5 + i * .42).length;
  PILE.forEach(([x, y, r], i) => { const e = $(p + 'b' + i), k = clamp((lt - .5 - i * .42) / .3);
    e.setAttribute('opacity', k > 0 ? 1 : 0);
    e.setAttribute('transform', `translate(${lerp(200, x, k)} ${lerp(380, y, k) - sin(PI * k) * 90}) rotate(${r * k})`); });
  const flick = (lt - .5) % .42 / .42;
  setArm(p, 'L', 152, 330, 156, 410); setArm(p, 'R', 248, 330, lt > .5 && lt < 3.4 ? lerp(244, 290, sin(PI * flick)) : 244, 410 - (lt > .5 && lt < 3.4 ? sin(PI * flick) * 40 : 0));
  const sad = clamp(n / PILE.length);
  $(p + 'mouth').setAttribute('d', `M188 ${250 + 4 * sad} Q200 ${258 - 18 * sad} 212 ${250 + 4 * sad}`);
  $(p + 'head').setAttribute('transform', `rotate(${-6 * sad} 200 300)`);
  $(p + 'tear').setAttribute('opacity', lt > 3.4 ? 1 : 0);
  $(p + 'tear').setAttribute('transform', `translate(0 ${lt > 3.4 ? ((lt - 3.4) * 60) % 40 : 0})`);
};

const TYPES = [[mint, mintAt, C1, 'Le Mint-maniaque', 'Met sa carte sous pochette avant même de l’avoir regardée.', 'Un coin blanc ?!'],
  [ouvreur, ouvreurAt, C2, 'L’ouvreur pressé', 'Ouvre ses boosters dans le parking du magasin.', 'P'],
  [gardien, gardienAt, C3, 'Le gardien du scellé', 'Deux displays : un à ouvrir, un à garder… et il n’en ouvre aucun.', 'Pas touche !'],
  [chasseur, chasseurAt, C4, 'Le chasseur de chase', '30 boosters pour une seule carte… et toujours pas.', 'Encore un !']];
const I0 = 2.6, SD = 4.6, E0 = I0 + TYPES.length * SD;
const fig = (p, x, y, s, inner, attrs = '') => `<svg class="abs" ${attrs} width="${400 * s}" height="${600 * s}" viewBox="0 0 400 600" style="left:${x}px;top:${y}px;overflow:visible;z-index:3">${inner}</svg>`;
const scene = ([f, , c, name, line, pop], k) => {
  const s = I0 + k * SD, o = s + SD - .15;
  const popper = pop === 'P'
    ? `<div class="abs" style="left:800px;top:520px;z-index:2" ${A(s + .3, o, 6)}><div style="width:150px;height:150px;border-radius:24px;background:${BLUE};border:7px solid ${INK};box-shadow:10px 10px 0 ${SHADOW};display:flex;align-items:center;justify-content:center"><span class="h" style="font-size:110px;color:${WHITE}">P</span></div><div style="width:18px;height:220px;margin:0 auto;background:${INK};border-radius:9px"></div></div>`
    : st([610, 0, 640, 680][k], [560, 0, 640, 880][k], 380, 110, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:52px;color:${DARK}">${pop}</div>`, { fill: [SUN, SUN, PINK, C4][k], r: 6, z: 6, attrs: A(s + [2.45, 0, 1.6, 1.4][k], s + [4.3, 0, 3.4, 4.4][k], 6) });
  return `<div class="abs lab" style="left:0;top:150px;width:1080px;text-align:center;font-size:28px;color:${c}" ${A(s, o, 0, 'fade')}>TYPE ${k + 1}/4</div>
  <div class="abs h" style="left:0;top:210px;width:1080px;text-align:center;font-size:${name.length > 18 ? 96 : 108}px" ${A(s + .05, o, 0, 'rise')}>${name}</div>
  <div class="abs" style="left:0;top:0;width:1080px;height:1920px" ${A(s + .15, o, 0, 'fade')}>${fig('s' + k, 240, 520, 1.5, f('s' + k))}</div>
  ${popper}
  ${st(90, 1450, 900, 210, `<div class="ui" style="display:flex;align-items:center;justify-content:center;text-align:center;height:100%;padding:0 50px;font-size:42px;line-height:1.25;color:${DARK}">${line}</div>`, { fill: c, r: -1.5, z: 6, attrs: A(s + .5, o, -1.5) })}`;
};
reel(`${ghosts([[60, 420, 80, -8], [950, 380, 70, 7], [70, 1760, 70, 8], [930, 1760, 80, -6]])}
  <div class="abs lab" style="left:0;top:200px;width:1080px;text-align:center;font-size:30px;color:${VSOFT}" ${A(0, I0 - .1, 0, 'fade')}>LES TYPES DE COLLECTIONNEURS</div>
  <div class="abs h" style="left:0;top:270px;width:1080px;text-align:center;font-size:150px" ${A(0, I0 - .1, 0, 'rise')}>Tu es<br><span style="color:${SUN}">lequel ?</span></div>
  ${TYPES.map(([f], i) => `<div class="abs" style="left:0;top:0;width:1080px;height:1920px" ${A(.3 + i * .2, I0 - .1, 0, 'rise')}>${fig('i' + i, 40 + i * 250, 900, .65, f('i' + i))}</div>`).join('')}
  ${TYPES.map(scene).join('')}
  <div class="abs h" style="left:0;top:230px;width:1080px;text-align:center;font-size:104px" ${A(E0, null, 0, 'rise')}>Et toi,<br><span style="color:${SUN}">tu es lequel ?</span></div>
  <div class="abs ui" style="left:0;top:500px;width:1080px;text-align:center;font-size:44px;color:${VSOFT}" ${A(E0 + .4, null, 0, 'rise')}>Tague celui qui se reconnaît 👇</div>
  ${TYPES.map(([f], i) => `<div class="abs" style="left:0;top:0;width:1080px;height:1920px" ${A(E0 + .2 + i * .15, null, 0)}>${fig('e' + i, 50 + i * 245, 660, .6, f('e' + i))}</div>`).join('')}
  <div ${A(E0 + .9, null, 0, 'fade')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${closing(1200)}</div>
`, E0 + 4.5);
const base = window.render;
window.render = (t) => {
  base(t);
  TYPES.forEach(([, at], k) => {
    at('s' + k, clamp((t - I0 - k * SD) / SD) * SD);
    // Intro and end: the three idle, with a little bounce.
    const idle = [.3, 1, .9, 3.3][k]; at('i' + k, idle); at('e' + k, idle);
    $('i' + k + 'all').setAttribute('transform', `translate(0 ${-Math.abs(sin(t * 3 + k)) * 20})`);
    $('e' + k + 'all').setAttribute('transform', `translate(0 ${-Math.abs(sin(t * 3 + k)) * 20})`);
  });
};
window.render(0);
</script></body></html>
