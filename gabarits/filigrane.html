<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz filigrane</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
<style>body, .reel { background: transparent !important; }</style>
</head><body><script>
// A Boostz watermark laid over a reused video, where another platform's watermark
// was (the PokePotes TikTok download, its mark masked underneath): the app icon,
// the wordmark and the account's handle, laid out like TikTok's own mark.
// The hash gives the place and the handle, as each network has its own account:
//   node rendu.mjs "filigrane.html#gauche-boostz.app" plans 0   (transparent PNG, 1080 x 1920)
// Places: gauche and droite, the two TikTok uses.
const [place, handle] = (location.hash.slice(1) || 'gauche-boostz.app').split(/-(.*)/);
const [wx, wy] = { gauche: [12, 868], droite: [856, 1450] }[place];
const shade = 'text-shadow:0 2px 6px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)';
reel(`<div class="abs" style="left:${wx}px;top:${wy}px;width:212px;display:flex;flex-direction:column;align-items:center;gap:6px">
  <div style="width:92px;height:92px;border-radius:24px;border:4px solid ${INK};background:url(assets/icone-app.png) center/125% no-repeat;box-shadow:5px 5px 0 ${SHADOW}"></div>
  <div style="filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))">${wordmark(42)}</div>
  <div class="ui" style="font-size:24px;color:#fff;margin-top:-6px;${shade}">@${handle}</div></div>`, 1);
</script></body></html>
