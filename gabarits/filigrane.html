<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz filigrane</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
<style>body, .reel { background: transparent !important; }</style>
</head><body><script>
// A Boostz watermark laid over a reused video, where another platform's watermark
// was (the PokePotes TikTok download): app icon, wordmark and handle on a small
// translucent card. #gauche and #droite are the two places TikTok uses.
// Render: node rendu.mjs filigrane.html#gauche plans 0 (transparent PNG, 1080 x 1920).
const [x, y] = { gauche: [12, 864], droite: [856, 1442] }[location.hash.slice(1) || 'gauche'];
reel(`<div class="abs" style="left:${x}px;top:${y}px;width:212px;height:190px;border-radius:30px;background:rgba(19,16,32,.78);border:3px solid rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
  <div style="width:70px;height:70px;border-radius:18px;border:3px solid ${INK};background:url(assets/icone-app.png) center/125% no-repeat;box-shadow:4px 4px 0 ${SHADOW}"></div>
  <div style="transform:scale(.95)">${wordmark(40)}</div>
  <div class="ui" style="font-size:22px;color:${VSOFT};margin-top:-4px">@boostz.app</div></div>`, 1);
</script></body></html>
