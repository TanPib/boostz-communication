<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz FB12</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Sortie d'extension: Dragon Ball Super Card Game Fusion World FB12 "Reach the
// God", out in English on 18/12/2026 (Japan 12/12). Searched on 06/10/2026:
// dbs-cardgame.com (product page), db-fusionworld.com, tcgwaifu.com (123 card
// types, 5 Leaders, 3 SCR each with a SUPER alt-art version, 12-card packs,
// 4.99 $ pack MSRP). Fusion World is sold in English in Europe.
const G = 'dragonball', SUB = 'Fusion World · FB12';
carousel([
  ['1-couverture', `${ghosts([[940, 1090, 70, 8]])}${track(0, 1150, .5)}${head('SORTIE D’EXTENSION', G, SUB)}
    ${card('assets/sortie-fb12-reach-the-god.webp', 90, 190, 900, -2, 3, { h: 506 })}
    <div class="abs h" style="left:0;top:770px;width:1080px;text-align:center;font-size:100px">Reach the God<br><span style="color:${GAMES[G][1]}">sort aujourd’hui.</span></div>
    <div class="abs mut" style="left:0;top:1010px;width:1080px;text-align:center;font-weight:600;font-size:36px">Vendredi 18 décembre, en anglais.</div>
    <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div>
    <div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`],
  ['2-dedans', `${track(1, 1200, .25)}${head('CE QU’IL Y A DEDANS', G, SUB)}
    <div class="abs h" style="left:70px;top:170px;font-size:100px">123 cartes,<br><span style="color:${GAMES[G][1]}">5 Leaders.</span></div>
    ${[['5', 'Leaders : Beerus, Whis, Goku, Vegeta et Golden Freezer'], ['3', 'Secret Rares, chacune aussi en version SUPER alt-art'], ['12', 'cartes par booster']].map(([n, k], i) =>
      st(70, 430 + i * 200, 940, 170, `<div style="display:flex;align-items:center;gap:36px;height:100%;padding:0 44px"><div class="h" style="font-size:90px;color:${[SUN, GAMES[G][1], DONE][i]};width:110px">${n}</div><div class="ui" style="font-size:34px;line-height:1.2">${k}</div></div>`, { r: [-1, 1, -1][i], z: 3 })).join('')}
    <div class="abs mut" style="left:70px;right:70px;top:1050px;font-weight:600;font-size:32px;text-align:center">Le thème : les personnages de Dragon Ball Super,<br>jusqu’aux dieux de la destruction.</div>
    ${src('Sources : dbs-cardgame.com, db-fusionworld.com, tcgwaifu.com, relevé le 06/10/2026.')}`],
  ['3-prix', `${track(2, 820, .35)}${head('LE PRIX', G, SUB)}
    <div class="abs h" style="left:70px;top:170px;font-size:100px">Combien<br><span style="color:${GAMES[G][1]}">le booster ?</span></div>
    ${st(70, 450, 940, 320, `<div style="padding:40px 50px;color:${DARK}"><div class="lab" style="font-size:24px">PRIX CONSEILLÉ DU BOOSTER · ÉTATS-UNIS</div><div class="h" style="font-size:130px;margin-top:14px">${usd(4.99)}</div></div>`, { fill: GAMES[G][1], r: -1.5, z: 3 })}
    ${st(70, 870, 940, 210, `<div style="display:flex;align-items:center;height:100%;padding:0 50px"><div class="ui" style="font-size:38px;line-height:1.3">La boîte de 24 boosters : pas de prix conseillé annoncé.</div></div>`, { r: 1, z: 3 })}
    ${src('Prix conseillé : listes officielles relayées par tcgwaifu.com, relevé le 06/10/2026.')}`],
  ['4-suis-leur-cote', `${ghosts([[100, 520, 80, -6], [900, 540, 90, 8], [110, 1120, 70, 4], [920, 1100, 80, -6]])}${track(3, 1200, .6)}${head('SUR BOOSTZ', G, SUB)}
    <div class="abs h" style="left:0;top:200px;width:1080px;text-align:center;font-size:96px">Suis leur cote<br><span style="color:${GAMES[G][1]}">dès le premier jour.</span></div>
    ${back('dragonball', 330, 470, 180, -8, 2)}${back('dragonball', 560, 470, 180, 7, 2)}
    ${closing(800)}`],

</script></body></html>
