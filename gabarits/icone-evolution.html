<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>BoostZ icone evolution</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Profile picture, thirteenth round (31/10/2026). The study of the current
// picture against the wordmark finalists (mesure-icones.html) found that the
// current symbol (the app icon: a violet disc, a fan of three cards, the Z on
// the front card) is the one that is recognised and remembered at small sizes,
// and that it doubles as the app icon. The user asked what could improve it,
// « une vingtaine de maquettes ». So: the same symbol, evolved, never replaced
// (size, the Z in the brand gradient, the ground's light, the fan's colours,
// depth, the wordmark's ghost Zs, one sparkle). Drawn in the 1024 space of
// assets/icone-app.png. Render: node rendu.mjs icone-evolution.html images
document.head.insertAdjacentHTML('beforeend', '<style>.p { width: 1080px; height: 1080px; }</style>');
const V = '#7C3AED';
const S = []; const add = (id, html) => S.push([id, html]);
let n = 0; const uid = () => 'v' + n++;

// The Z of the app icon, centred on (0, 0), for a card w x h. t: stroke weight.
const zPath = (w, h, t) => { const a = .27 * w, b = .25 * h, T = t * w, x0 = -a, x1 = a, y0 = -b, y1 = b, d = T * 1.25;
  return `M${x0} ${y0} H${x1} V${y0 + T} L${x0 + d} ${y1 - T} H${x1} V${y1} H${x0} V${y1 - T} L${x1 - d} ${y0 + T} H${x0} Z`; };
// One card: centre, rotation, size, fill; extra drawn inside in card space.
const cardG = (cx, cy, rot, w, h, fill, o = {}) => `<g transform="translate(${cx} ${cy}) rotate(${rot})" ${o.filter ? `filter="url(#${o.filter})"` : ''}>
  <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${w * .19}" fill="${fill}" ${o.op != null ? `opacity="${o.op}"` : ''} ${o.stroke ? `stroke="${o.stroke}" stroke-width="${o.sw}"` : ''}/>${o.inner || ''}</g>`;

const icon = (o = {}) => {
  const defs = []; const k = o.k || 1;
  const grad = (stops, x1 = 0, y1 = 0, x2 = 1, y2 = 1) => { const id = uid(); defs.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(([of, c, a = 1]) => `<stop offset="${of}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</linearGradient>`); return `url(#${id})`; };
  const radial = (stops, cx = .5, cy = .4, r = .75) => { const id = uid(); defs.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops.map(([of, c]) => `<stop offset="${of}" stop-color="${c}"/>`).join('')}</radialGradient>`); return `url(#${id})`; };
  const shadow = (dx, dy, sd, c, a) => { const id = uid(); defs.push(`<filter id="${id}" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="${dx}" dy="${dy}" stdDeviation="${sd}" flood-color="${c}" flood-opacity="${a}"/></filter>`); return id; };
  const BRAND = [[0, '#FF4FA0'], [.55, '#8B3DFF'], [1, '#3AA9FF']];
  // Ground
  const bg = { flat: V, bright: '#8B5CF6', glow: radial([[0, '#A47BFF'], [.6, '#7C3AED'], [1, '#5B21B6']]), glow2: radial([[0, '#9F6DFF'], [1, '#6D28D9']], .5, .3, .9), brand: grad(BRAND), night: radial([[0, '#3B1D7A'], [.6, '#1B1330'], [1, '#0B0812']], .5, .45, .7), deep: radial([[0, '#8B5CF6'], [1, '#4C1D95']], .5, .35, .8) }[o.bg || 'flat'];
  // Fan fills (back, middle)
  const fills = { white: ['#fff', '#fff'], pinkblue: ['#FF7EB9', '#6FC3FF'], brand: [grad([[0, '#FF4FA0'], [1, '#B57BFF']]), grad([[0, '#8B3DFF'], [1, '#3AA9FF']])], lav: ['#C4B5FD', '#E9E2FF'] }[o.fan || 'white'];
  const ops = o.fan && o.fan !== 'white' ? [o.backOp ?? .9, o.midOp ?? .95] : [.25, .65];
  const zFill = o.z === 'grad' ? grad(BRAND) : o.z === 'night' ? '#1B1330' : (o.z || V);
  const front = o.front || '#fff';
  const fw = 275, fh = 400, t = o.thick ? .135 : .095;
  const ghosts = o.ghosts ? [['#3AA9FF', -.2, .35], ['#8B3DFF', -.13, .5], ['#FF4FA0', -.065, .7]].map(([c, dx, a]) => `<path d="${zPath(fw, fh, t)}" transform="translate(${dx * fw} 0)" fill="${c}" opacity="${a}"/>`).join('') : '';
  const sheen = o.sheen ? `<rect x="${-fw / 2}" y="${-fh / 2}" width="${fw}" height="${fh}" rx="${fw * .19}" fill="${grad([[0, '#fff', 0], [.42, '#fff', 0], [.5, '#C4E7FF', .55], [.58, '#FFD1EA', .4], [.66, '#fff', 0], [1, '#fff', 0]], 0, 0, 1, 1)}"/>` : '';
  const fFilter = o.soft ? shadow(0, 18, 22, '#2E1065', .45) : o.hard ? shadow(14, 16, 0, '#2E1065', .9) : null;
  const zInner = `${ghosts}<path d="${zPath(fw, fh, t)}" fill="${zFill}" stroke="${zFill}" stroke-width="${o.thick ? 10 : 6}" stroke-linejoin="round"/>`;
  const rot = o.rot ?? 14;
  const spark = o.spark ? `<path d="M0 -1 Q.12 -.12 1 0 Q.12 .12 0 1 Q-.12 .12 -1 0 Q-.12 -.12 0 -1Z" transform="translate(${o.spark[0]} ${o.spark[1]}) scale(${o.spark[2]})" fill="${o.spark[3] || '#fff'}"/>` : '';
  const fan = `${cardG(420, 550, -14, 240, 400, fills[0], { op: ops[0], filter: o.soft ? shadow(0, 10, 16, '#2E1065', .3) : null })}${cardG(490, 497, 0, 240, 405, fills[1], { op: ops[1], filter: o.soft ? shadow(0, 10, 16, '#2E1065', .3) : null })}${cardG(603, 485, rot, fw, fh, front, { filter: fFilter, inner: sheen + zInner, stroke: o.frontStroke, sw: 10 })}`;
  return `<svg class="abs" width="1080" height="1080" viewBox="0 0 1024 1024" style="left:0;top:0"><defs>${defs.join('')}</defs><rect width="1024" height="1024" fill="${bg}"/>${o.under || ''}<g transform="translate(512 512) scale(${k}) translate(${k === 1 ? -517 : -530} ${k === 1 ? -507 : -496})">${fan}</g>${spark}</svg>`; };

add('01-actuelle', icon());
add('02-plus-grand', icon({ k: 1.22 }));
add('03-z-degrade', icon({ z: 'grad' }));
add('04-grand-z-degrade', icon({ k: 1.22, z: 'grad' }));
add('05-z-epais', icon({ k: 1.22, thick: true }));
add('06-fond-lumineux', icon({ k: 1.22, bg: 'bright' }));
add('07-fond-halo', icon({ k: 1.22, bg: 'glow' }));
add('08-cartes-rose-bleu', icon({ k: 1.22, fan: 'pinkblue' }));
add('09-cartes-degradees', icon({ k: 1.22, fan: 'brand' }));
add('10-cartes-lavande', icon({ k: 1.22, fan: 'lav', backOp: .55, midOp: .85 }));
add('11-ombre-douce', icon({ k: 1.22, soft: true }));
add('12-ombre-sticker', icon({ k: 1.22, hard: true }));
add('13-fantomes-du-z', icon({ k: 1.22, z: 'grad', ghosts: true }));
add('14-reflet-holo', icon({ k: 1.22, sheen: true }));
add('15-etincelle', icon({ k: 1.22, spark: [800, 250, 46] }));
add('16-plus-incline', icon({ k: 1.22, rot: 20 }));
add('17-fond-degrade-marque', icon({ k: 1.22, bg: 'brand' }));
add('18-fond-nuit', icon({ k: 1.22, bg: 'night', fan: 'brand' }));
add('19-combo-sobre', icon({ k: 1.22, bg: 'glow', z: 'grad', thick: true }));
add('20-combo-couleur', icon({ k: 1.22, bg: 'glow', z: 'grad', thick: true, fan: 'brand', backOp: .85, midOp: .9, soft: true }));
add('21-combo-fantomes', icon({ k: 1.22, bg: 'glow', z: 'grad', thick: true, ghosts: true, soft: true }));
add('22-combo-etincelle', icon({ k: 1.22, bg: 'glow2', z: 'grad', thick: true, fan: 'lav', backOp: .55, midOp: .85, soft: true, spark: [805, 245, 40] }));

// The user does not want the inside of the Z coloured (31/10/2026): the same
// combinations with the Z in plain violet, the colour moved elsewhere or dropped.
add('23-sobre-z-violet', icon({ k: 1.22, bg: 'glow', thick: true }));
add('24-sobre-z-fin', icon({ k: 1.22, bg: 'glow' }));
add('25-sobre-ombre', icon({ k: 1.22, bg: 'glow', thick: true, soft: true }));
add('26-lavande-etincelle', icon({ k: 1.22, bg: 'glow2', thick: true, fan: 'lav', backOp: .55, midOp: .85, soft: true, spark: [805, 245, 40] }));
add('27-cartes-degradees-z-violet', icon({ k: 1.22, bg: 'glow', thick: true, fan: 'brand', backOp: .85, midOp: .9, soft: true }));
add('28-fantomes-z-violet', icon({ k: 1.22, bg: 'glow', thick: true, ghosts: true, soft: true }));

carousel(S);
</script></body></html>
