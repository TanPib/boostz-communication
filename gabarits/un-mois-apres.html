<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz un mois apres</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// "Un mois après la sortie" (proposed on 16/10/2026, after pricecharting's
// "One month later"): a set's chase cards one month after release, each with
// its day-by-day curve. The curve needs a real point every day: a daily record
// of the set's 10-15 chase cards from release day (to build). Until then this
// page is a mockup with example figures, and says so on every slide.
window.PUB = window.PUB || '2026-12-06';
const GAME = 'pokemon', GC = GAMES[GAME][1], UP = '#5FD3A3', DOWN = '#F0899A';
const MOCK = true;
const SET = 'Flammes Fantasmagoriques';
// [id, name, rarity, 31 daily prices from release day]; EXAMPLE figures.
const ex = (a, b, k) => Array.from({ length: 31 }, (_, d) => Math.round((b + (a - b) * Math.exp(-d / k) + Math.sin(d * 1.7) * a * .015) * 100) / 100);
const CARDS = [
  ['me02-125', 'Méga-Dracaufeu X-ex', 'Illustration spéciale rare', ex(1180, 720, 7)],
  ['me02-127', 'Méga-Sharpedo-ex', 'Illustration spéciale rare', ex(64, 19, 5)],
];
const pct = (v) => (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', ',') + ' %';
const SRC = MOCK ? 'MAQUETTE · CHIFFRES D’EXEMPLE. Version réelle : relevé Boostz quotidien des cartes Cardmarket, du jour de la sortie à J+30.' : '';
const mock = MOCK ? `<div class="abs lab" style="left:0;top:118px;width:1080px;text-align:center;font-size:24px;letter-spacing:5px;color:${PINK};z-index:6">MAQUETTE · CHIFFRES D’EXEMPLE</div>` : '';
// The day-by-day curve: one point per real record, the first and last labelled.
const chart = (p, x, y, w, h) => { const lo = Math.min(...p) * .9, hi = Math.max(...p) * 1.05, X = (i) => 40 + i * (w - 80) / (p.length - 1), Y = (v) => 30 + (h - 90) * (1 - (v - lo) / (hi - lo));
  const col = p[p.length - 1] < p[0] ? DOWN : UP, pts = p.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return st(x, y, w, h, `<svg width="${w - 12}" height="${h - 12}" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    ${p.map((v, i) => i % 5 === 0 || i === p.length - 1 ? `<circle cx="${X(i)}" cy="${Y(v)}" r="9" fill="${i === p.length - 1 ? col : '#1D1730'}" stroke="${INK}" stroke-width="4"/>` : '').join('')}
    <text x="${X(0) + 14}" y="${Y(p[0]) - 16}" font-family="Outfit" font-weight="800" font-size="30" fill="${INK}">${eur(p[0])}</text>
    <text x="${X(p.length - 1) - 10}" y="${Y(p[p.length - 1]) - 22}" text-anchor="end" font-family="Outfit" font-weight="800" font-size="30" fill="${col}">${eur(p[p.length - 1])}</text>
    ${['J', 'J+10', 'J+20', 'J+30'].map((t, k) => `<text x="${X(k * 10)}" y="${h - 30}" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="22" fill="#A8A2B8">${t}</text>`).join('')}
  </svg>`, { r: 1, z: 3 }); };
const SLIDES = [];

// 1 - Cover: the set, "un mois après", the big arrow.
SLIDES.push(['1-couverture', `${mock}${head('UN MOIS APRÈS', GAME, SET)}
  <div class="abs h" style="left:0;top:170px;width:1080px;text-align:center;font-size:80px">${SET}<br><span style="color:${GC}">un mois après</span></div>
  ${card(`assets/mur-${CARDS[0][0]}.png`, 345, 480, 390, -4)}
  <svg class="abs" width="360" height="360" viewBox="0 0 100 100" style="left:690px;top:720px;z-index:4;filter:drop-shadow(10px 10px 0 ${SHADOW})"><path d="M10 25 L45 60 L60 45 L85 75 L85 55 L95 55 L95 92 L58 92 L58 82 L78 82 L60 62 L45 77 L4 36 Z" fill="${DOWN}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></svg>
  <div class="abs mut" style="left:0;top:1120px;width:1080px;text-align:center;font-weight:600;font-size:36px">Tu achètes maintenant, ou tu attends ?</div>
  <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div><div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`]);

// 2 and on - One chase card: its scan, its curve, three figures.
CARDS.forEach(([id, name, rar, p], i) => {
  const move = (p[p.length - 1] - p[0]) / p[0] * 100, col = move < 0 ? DOWN : UP;
  SLIDES.push([`${i + 2}-${id}`, `${mock}${head('UN MOIS APRÈS', GAME, SET)}
    <div class="abs h" style="left:70px;top:160px;font-size:76px;color:${GC}">${name}</div>
    <div class="abs mut" style="left:70px;top:250px;font-weight:600;font-size:28px">${rar}</div>
    ${card(`assets/mur-${id}.png`, 70, 320, 360, -3)}
    ${chart(p, 470, 320, 540, 520)}
    ${st(70, 900, 940, 230, `<div style="display:flex;height:100%;align-items:center;justify-content:space-around">
      ${[['LE JOUR DE LA SORTIE', eur(p[0]), INK], ['EN UN MOIS', pct(move), col], ['AUJOURD’HUI', eur(p[p.length - 1]), col]].map(([k, v, c]) => `<div style="text-align:center"><div class="lab mut" style="font-size:19px;letter-spacing:2px">${k}</div><div class="h" style="font-size:58px;margin-top:10px;color:${c};white-space:nowrap">${v}</div></div>`).join('')}</div>`, { r: -1, z: 3 })}
    <div class="src">${SRC}</div>`]);
});

carousel(SLIDES);
</script></body></html>
