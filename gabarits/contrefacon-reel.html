<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz contrefacon</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Repère la contrefaçon: each tell shows a photo of a real counterfeit, with a
// ring on the exact spot to check. Photos: justinbasil.com/guide/fakes (real
// fakes photographed by the guide's author; the back photo puts a genuine card
// on the left and a fake on the right). Searched on 06/10/2026: ICv2 (PSA's 2025
// counterfeit report: fakes of Charizard ex 199/165 up 420 %).
// Rings are [cx, cy, w, h] as fractions of the photo.
const TELLS = [
  ['Le dos', 'faux-dos-compare.webp', 2500 / 1794, [], 'À gauche, une vraie : un bleu profond, plusieurs nuances. À droite, un faux : bord violet, couleurs délavées.'],
  ['Les fautes', 'faux-carabaffe-fautes.webp', 505 / 704, [[.25, .062, .44, .075], [.327, .80, .14, .045]], '«&nbsp;Wartortleh&nbsp;» au lieu de Wartortle, «&nbsp;trun&nbsp;» au lieu de turn. Une vraie carte n’a pas de faute.'],
  ['Les chiffres', 'faux-arcanin-pv.webp', 1119 / 1464, [[.83, .048, .3, .075]], 'Un Arcanin à 13&nbsp;000 PV : aucune vraie carte Pokémon n’a plus de quelques centaines de PV.'],
  ['Les symboles', 'faux-cupcanaille-symbole.webp', 2035 / 2937, [[.835, .155, .2, .14]], 'Une main à la place d’un symbole d’Énergie : ce symbole n’existe sur aucune vraie carte.'],
  ['L’accent', 'faux-toudoudou-accent.webp', 333 / 468, [[.67, .769, .34, .05]], '«&nbsp;Basic Pokemon&nbsp;», sans accent. Une vraie carte écrit toujours Pokémon avec son&nbsp;é.'],
];
const T0 = 3.4, STEP = 3.4;
const ring = (l, t, w, h) => `<div class="abs" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;border:6px solid ${SUN};border-radius:999px;box-shadow:0 0 0 4px ${INK}"></div>`;
const frame = (x, y, w, h, inner, attrs, r = 0, b = INK) => `<div class="abs" ${attrs} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg);border:6px solid ${b};border-radius:18px;box-shadow:12px 12px 0 ${SHADOW};overflow:hidden;background:#000">${inner}</div>`;
// The photo on the left with its rings, and one magnified crop per ring on the right.
const photo = (img, ratio, rings, at, out) => {
  if (!rings.length) { const w = 940, h = w / ratio; return frame(70, 430, w, h, `<img src="assets/${img}" style="width:100%;height:100%;object-fit:cover;display:block">`, A(at, out, 0)); }
  const h = 660, w = h * ratio;
  const left = frame(70, 430, w, h, `<img src="assets/${img}" style="width:100%;height:100%;display:block">${rings.map(([cx, cy, rw, rh]) => ring((cx - rw / 2) * w - 6, (cy - rh / 2) * h - 6, rw * w + 12, rh * h + 12)).join('')}`, A(at, out, 0));
  const ZW = 1010 - (w + 110), ZH = rings.length > 1 ? 280 : 360, W0 = 1000, H0 = W0 / ratio;
  const zooms = rings.map(([cx, cy, rw, rh], i) => {
    const cw = Math.max(rw * W0 * 1.35, rh * H0 * 1.6 * ZW / ZH), ch = cw * ZH / ZW, k = ZW / cw;
    // Keep the crop inside the photo (no black band at an edge); the ring follows the crop.
    const bx = Math.min(0, Math.max(ZW - W0 * k, -(cx * W0 - cw / 2) * k)), by = Math.min(0, Math.max(ZH - H0 * k, -(cy * H0 - ch / 2) * k));
    const inner = `<div style="position:absolute;left:${bx}px;top:${by}px;width:${W0 * k}px;height:${H0 * k}px;background:url(assets/${img}) 0 0/100% 100%"></div>${ring(bx + (cx - rw / 2) * W0 * k - 10, by + (cy - rh / 2) * H0 * k - 10, rw * W0 * k + 8, rh * H0 * k + 8)}`;
    const y = rings.length > 1 ? 450 + i * 330 : 580;
    return frame(w + 110, y, ZW, ZH, inner, A(at + .6 + i * .3, out, [2, -2][i]), [2, -2][i], SUN);
  }).join('');
  return left + zooms;
};
reel(`${ghosts([[930, 160, 80, 6], [70, 1780, 90, 10], [900, 1790, 100, -6]])}
  ${reelPath('M-20 1800 C160 1750 300 1870 520 1820 S860 1740 1100 1790')}
  <div class="abs lab" ${A(.2, null, 0, 'rise')} style="left:70px;top:150px;font-size:26px;letter-spacing:6px;color:${VSOFT}">REPÈRE LA CONTREFAÇON</div>
  <div class="abs h" ${A(.4, T0 - .3, 0, 'rise')} style="left:70px;top:220px;width:940px;font-size:92px">Tes cartes de Noël<br><span class="acc">sont-elles vraies ?</span></div>
  ${card('assets/carte-dracaufeu-ex-sv035-199.jpg', 330, 470, 420, 3, 3, { attrs: A(.9, T0 - .3, 3) })}
  <div class="abs" ${A(1, T0 - .3, 0, 'fade')} style="left:0;top:1090px;width:1080px;text-align:center"><div class="ui" style="font-size:28px;color:${DONE}">UNE VRAIE · Dracaufeu-ex · 151 · 199/165</div></div>
  ${st(70, 1260, 940, 270, `<div style="padding:34px 44px;color:${DARK}"><div class="h" style="font-size:92px">+420 %</div><div class="ui" style="font-size:32px;margin-top:6px">de faux Dracaufeu-ex 199/165<br>repérés par PSA en 2025</div></div>`, { fill: PINK, r: -1.5, z: 6, attrs: A(1.6, T0 - .3, -1.5) })}
  <div class="abs" ${A(1.9, T0 - .3, 0, 'fade')} style="left:70px;right:70px;top:1580px;text-align:center;font-family:Exo;font-size:24px;color:rgba(255,255,255,.5)">Source : ICv2, rapport PSA 2025, relevé le 06/10/2026.</div>
  ${TELLS.map(([t, img, ratio, rings, d], i) => { const at = T0 + i * STEP, out = at + STEP - .25; return `
    <div class="abs h" ${A(at, out, 0, 'rise')} style="left:70px;top:220px;font-size:96px"><span style="color:${SUN}">${i + 1}.</span> ${t}</div>
    ${photo(img, ratio, rings, at + .15, out)}
    ${i === 0 ? `<div class="abs ui" ${A(at + .4, out, 0, 'fade')} style="left:70px;top:1110px;width:470px;text-align:center;font-size:30px;color:${DONE}">VRAIE</div><div class="abs ui" ${A(at + .4, out, 0, 'fade')} style="left:540px;top:1110px;width:470px;text-align:center;font-size:30px;color:${PINK}">FAUSSE</div>` : `<div class="abs ui" ${A(at + .4, out, 0, 'fade')} style="left:0;top:1150px;width:1080px;text-align:center;font-size:30px;color:${PINK}">UNE VRAIE CONTREFAÇON</div>`}
    ${st(70, 1230, 940, 280, `<div class="ui" style="display:flex;align-items:center;height:100%;padding:0 50px;font-size:40px;line-height:1.3;color:${DARK}">${d}</div>`, { fill: [SUN, VSOFT, DONE, PINK, SUN][i], r: [-1.5, 1, -1, 1.5, -1][i], z: 6, attrs: A(at + .35, out, [-1.5, 1, -1, 1.5, -1][i]) })}
    <div class="abs" ${A(at + .5, out, 0, 'fade')} style="left:70px;right:70px;top:1580px;text-align:center;font-family:Exo;font-size:24px;color:rgba(255,255,255,.5)">Photo : justinbasil.com, guide des contrefaçons, relevé le 06/10/2026.</div>`; }).join('')}
  <div class="abs h" ${A(END_T(), null, 0, 'rise')} style="left:0;top:470px;width:1080px;text-align:center;font-size:84px">Un doute ? Compare avec<br><span class="acc">une vraie du même set.</span></div>
  <div class="abs" ${A(END_T() + .5, null, 0, 'rise')} style="left:0;top:820px;width:1080px;display:flex;flex-direction:column;align-items:center;gap:26px">${wordmark(110)}
    <div class="mut" style="font-weight:600;font-size:38px">Ton compagnon TCG, bientôt sur ton téléphone</div>
    <div class="ui" style="font-size:36px;color:${VSOFT}">Abonne-toi pour ne rien manquer</div></div>`, END_T() + 3.4);
function END_T() { return T0 + TELLS.length * STEP; }
</script></body></html>
