<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz contrefacon</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Repère la contrefaçon: the real card stays on screen, the tells come one by
// one. Searched on 06/10/2026: ICv2 (PSA's 2025 counterfeit report: fakes of
// Charizard ex 199/165 up 420 %), tcgplayer.com and cardcodex.com (light test,
// edge layer, text), pregradecards.com (back), poketrace.com (texture),
// cgccards.com (One Piece Luffy alert). Only non-destructive tests are shown.
const TELLS = [
  ['La lumière', 'Une lampe derrière : une vraie carte laisse passer très peu de lumière. Certaines fausses y arrivent aussi.'],
  ['La tranche', 'Sur le côté, une vraie carte montre une fine ligne sombre entre deux couches blanches.'],
  ['Le texte', 'Des fautes, une police floue, « Pokémon » sans accent : c’est mauvais signe.'],
  ['Le dos', 'Plusieurs nuances de bleu. Un faux est souvent trop sombre, ou trop violet.'],
  ['Le relief', 'Sur une carte texturée, tu sens le relief sous l’ongle. Sur un faux, c’est plat.'],
];
const T0 = 3.2, STEP = 2.7;
reel(`${ghosts([[930, 160, 80, 6], [70, 1760, 90, 10], [900, 1780, 100, -6]])}
  ${reelPath('M-20 1800 C160 1750 300 1870 520 1820 S860 1740 1100 1790')}
  <div class="abs lab" ${A(.2, null, 0, 'rise')} style="left:70px;top:150px;font-size:26px;letter-spacing:6px;color:${VSOFT}">REPÈRE LA CONTREFAÇON</div>
  <div class="abs h" ${A(.4, T0 - .3, 0, 'rise')} style="left:70px;top:220px;width:940px;font-size:92px">Tes cartes de Noël<br><span class="acc">sont-elles vraies ?</span></div>
  ${st(70, 1260, 940, 270, `<div style="padding:34px 44px;color:${DARK}"><div class="h" style="font-size:92px">+420 %</div><div class="ui" style="font-size:32px;margin-top:6px">de faux Dracaufeu-ex 199/165<br>repérés par PSA en 2025</div></div>`, { fill: PINK, r: -1.5, z: 6, attrs: A(1.6, T0 - .3, -1.5) })}
  ${card('assets/carte-dracaufeu-ex-sv035-199.jpg', 330, 470, 420, 3, 3, { attrs: A(.9, END_T(), 3) })}
  <div class="abs" ${A(1, END_T(), 0, 'fade')} style="left:0;top:1090px;width:1080px;text-align:center" class="ui"><div class="ui" style="font-size:28px;color:${DONE}">LA VRAIE · Dracaufeu-ex · 151 · 199/165</div></div>
  ${TELLS.map(([t, d], i) => { const at = T0 + i * STEP, out = at + STEP - .25; return `
    <div class="abs h" ${A(at, out, 0, 'rise')} style="left:70px;top:220px;font-size:96px"><span style="color:${SUN}">${i + 1}.</span> ${t}</div>
    ${st(70, 1180, 940, 300, `<div class="ui" style="display:flex;align-items:center;height:100%;padding:0 50px;font-size:40px;line-height:1.3;color:${DARK}">${d}</div>`, { fill: [SUN, VSOFT, DONE, PINK, SUN][i], r: [-1.5, 1, -1, 1.5, -1][i], z: 6, attrs: A(at + .25, out, [-1.5, 1, -1, 1.5, -1][i]) })}`; }).join('')}
  <div class="abs" ${A(1.9, END_T(), 0, 'fade')} style="left:70px;right:70px;top:1580px;text-align:center;font-family:Exo;font-size:24px;color:rgba(255,255,255,.5)">Sources : ICv2 (rapport PSA 2025), tcgplayer.com, cardcodex.com, pregradecards.com, poketrace.com, relevé le 06/10/2026.</div>
  <div class="abs h" ${A(END_T(), null, 0, 'rise')} style="left:0;top:470px;width:1080px;text-align:center;font-size:84px">Un doute ? Compare avec<br><span class="acc">une vraie du même set.</span></div>
  <div class="abs" ${A(END_T() + .5, null, 0, 'rise')} style="left:0;top:820px;width:1080px;display:flex;flex-direction:column;align-items:center;gap:26px">${wordmark(110)}
    <div class="mut" style="font-weight:600;font-size:38px">Ton compagnon TCG, bientôt sur ton téléphone</div>
    <div class="ui" style="font-size:36px;color:${VSOFT}">Abonne-toi pour ne rien manquer</div></div>`, END_T() + 3.4);
function END_T() { return T0 + TELLS.length * STEP; }
</script></body></html>
