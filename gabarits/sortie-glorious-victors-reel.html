<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz Glorious Victors</title>

</head><body><script>
// Sortie d'extension: Yu-Gi-Oh! Glorious Victors, out in Europe on 03/12/2026.

// "Les Glorieux Vainqueurs" comes from retailers, so the English one leads.
const Y = GAMES.yugioh[1];
const FACTS = [['60', 'cartes, dont 3 Secret Rares'], ['7', 'cartes par booster,<br>dont 6 rares'], ['3', 'nouveaux thèmes, dont Zenet : des Rituels égyptiens']];
reel(`${ghosts([[930, 330, 80, 6], [60, 1450, 80, -8], [70, 1760, 90, 10], [900, 1780, 100, -6]])}
