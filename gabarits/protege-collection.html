<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz protege ta collection</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Protège ta collection: concrete advice, drawn with the app's card backs.
// Sources searched on 06/10/2026: ultrapro.com (toploaders, PVC-free binders),
// beckett.com (storage), cardshellz.com, t206cards.com, mizoutcg.fr (double
// sleeving), ninepocket.net (side-loading pages), storagecafe.com, help.cardnexus.com (shipping).
const sleeve = (x, y, w, r, game, layers) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;transform:rotate(${r}deg);z-index:2">
  ${back(game, 0, 0, w, 0, 1)}
  ${layers.map(([pad, color, label], i) => `<div class="abs" style="left:${-pad}px;top:${-pad}px;width:${w + 2 * pad}px;height:${w * 1.4 + 2 * pad}px;border:5px solid ${color};border-radius:${18 + pad / 2}px;background:${color}22;z-index:${3 + i}"></div>
  <div class="abs lab" style="left:${w + 70}px;top:${40 + i * 80}px;white-space:nowrap;font-size:24px;color:${color};z-index:9">${label}</div>`).join('')}</div>`;
const tip = (y, h, text, fill, r = 1) => st(70, y, 940, h, `<div class="ui" style="display:flex;align-items:center;height:100%;padding:0 46px;font-size:36px;line-height:1.3;color:${DARK}">${text}</div>`, { fill, r, z: 3 });
carousel([
  ['1-couverture', `${ghosts([[90, 330, 80, -6], [930, 340, 80, 8]])}${track(0, 1130, .45)}${head('PROTÈGE TA COLLECTION', 'all')}
    ${back('pokemon', 260, 190, 200, -9, 2)}${back('lorcana', 440, 170, 200, 3, 3)}${back('onepiece', 620, 200, 200, 11, 2)}
    <div class="abs h" style="left:0;top:530px;width:1080px;text-align:center;font-size:110px">Tes cartes<br>de Noël,</div>
    <div class="abs h acc" style="left:0;top:770px;width:1080px;text-align:center;font-size:84px">protège-les.</div>
    <div class="abs mut" style="left:0;top:920px;width:1080px;text-align:center;font-weight:600;font-size:36px">5 gestes simples. Enregistre-le.</div>
    <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div>
    <div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`],
  ['2-pochette-et-etui', `${track(1, 805, .25)}${head('1 · LA BASE', 'all')}
    <div class="abs h" style="left:70px;top:170px;font-size:96px">Pochette,<br><span class="acc">puis étui rigide.</span></div>
    ${sleeve(200, 430, 200, -3, 'pokemon', [[14, VSOFT, 'POCHETTE SOUPLE'], [40, INK, 'ÉTUI RIGIDE (TOPLOADER)']])}
    ${tip(860, 260, 'La pochette d’abord, toujours : sans elle, l’étui rigide raye la carte. Prends du polypropylène, sans PVC.', SUN)}
    ${src('Sources : ultrapro.com (guide des toploaders), beckett.com, cardshellz.com, relevé le 06/10/2026.')}`],
  ['3-double-pochette', `${track(2, 805, .25)}${head('2 · LES CARTES DE VALEUR', 'all')}
    <div class="abs h" style="left:70px;top:170px;font-size:96px">Double<br><span class="acc">pochette.</span></div>
    ${sleeve(200, 430, 200, 2, 'lorcana', [[8, DONE, 'POCHETTE AJUSTÉE (INTÉRIEURE)'], [26, VSOFT, 'POCHETTE CLASSIQUE']])}
    ${tip(860, 260, 'Une pochette ajustée qui épouse la carte, puis une pochette classique par-dessus. Trop grande, elle laisse bouger la carte.', DONE, -1)}
    ${src('Sources : mizoutcg.fr (guide de la double pochette), Dragon Shield, relevé le 06/10/2026.')}`],
  ['4-classeur', `${track(3, 832, .18)}${head('3 · LE CLASSEUR', 'all')}
    <div class="abs h" style="left:70px;top:170px;font-size:96px">Sans PVC,<br><span class="acc">à ouverture latérale.</span></div>
    <div class="abs" style="left:150px;top:440px;width:780px;height:360px;border:6px solid ${INK};border-radius:30px;background:#1D1730;box-shadow:12px 12px 0 ${SHADOW};display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:26px;transform:rotate(-1.5deg);z-index:2">
      ${ALL8.concat(['pokemon', 'lorcana', 'onepiece', 'magic']).map((g) => `<div style="border-radius:12px;overflow:hidden;border:3px solid rgba(255,255,255,.6)"><img src="assets/dos-${g}.svg" style="width:100%;height:100%;object-fit:cover;display:block"></div>`).join('')}</div>
    ${tip(860, 260, 'Le PVC libère des plastifiants qui voilent et jaunissent les cartes. L’ouverture sur le côté les empêche de glisser.', PINK)}
    ${src('Sources : ultrapro.com (classeurs sans PVC ni acide), ninepocket.net, protecvault.com, relevé le 06/10/2026.')}`],
  ['5-ou-les-ranger', `${track(4, 800, .25)}${head('4 · LE RANGEMENT', 'all')}
    <div class="abs h" style="left:70px;top:170px;font-size:96px">Au frais, au sec,<br><span class="acc">à l’ombre.</span></div>
    ${[['≈ 20 °C', 'et stable', SUN], ['45–50 %', 'd’humidité', DONE], ['0', 'soleil direct', PINK]].map(([n, k, c], i) => st(70 + i * 320, 440, 290, 300, `<div style="padding:34px 30px"><div class="h" style="font-size:${n.length > 6 ? 58 : 76}px;color:${c};white-space:nowrap">${n}</div><div class="ui" style="font-size:32px;margin-top:10px">${k}</div></div>`, { r: [-2, 1.5, -1][i], z: 3 })).join('')}
    ${tip(860, 260, 'Évite le grenier, la cave et le garage : c’est le changement brutal qui gondole les cartes. Une boîte opaque, debout.', SUN, 1)}
    ${src('Sources : t206cards.com, beckett.com (20–22 °C, 45–55 %), storagecafe.com, relevé le 06/10/2026.')}`],
  ['6-pour-l-envoyer', `${track(5, 1195, .25)}${head('5 · L’ENVOI', 'all')}
    <div class="abs h" style="left:70px;top:170px;font-size:96px">Pour l’envoyer<br><span class="acc">sans risque.</span></div>
    ${['Pochette souple', 'Étui rigide', 'Ruban de masquage sur l’ouverture', 'Entre deux cartons', 'Enveloppe à bulles'].map((k, i) => `<div class="abs" style="left:70px;top:${430 + i * 125}px;display:flex;align-items:center;gap:30px">${disc(0, 0, 90, [VSOFT, SUN, DONE, PINK, BLUE][i], `<div class="h" style="font-size:46px;color:${DARK}">${i + 1}</div>`).replace('class="abs" style="left:0px;top:0px;', 'style="position:relative;')}<div class="ui" style="font-size:40px">${k}</div></div>`).join('')}
    <div class="abs mut" style="left:70px;right:70px;top:1060px;font-weight:600;font-size:32px">Jamais de scotch sur la carte : il laisse des traces.</div>
    ${src('Sources : help.cardnexus.com, cardshellz.com (envoi de cartes), relevé le 06/10/2026.')}`],
  ['7-fin', `${ghosts([[100, 520, 80, -6], [900, 540, 90, 8], [110, 1120, 70, 4], [920, 1100, 80, -6]])}${track(6, 1200, .6)}${head('PROTÈGE TA COLLECTION', 'all')}
    <div class="abs h" style="left:0;top:200px;width:1080px;text-align:center;font-size:96px">Et sur Boostz,<br><span class="acc">suis leur valeur.</span></div>
    ${back('pokemon', 330, 470, 180, -8, 2)}${back('lorcana', 560, 470, 180, 7, 2)}
    ${closing(800)}`],
]);
</script></body></html>
