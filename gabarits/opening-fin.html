<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz fin de l'opening</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
<style>body, .reel { background: transparent !important; }</style>
</head><body><script>
// End of the Collect Aura opening (a PokePotes video rebranded Boostz), rendered
// with a transparent background over the video's last frame (rendu.mjs alpha).
// It replaces PokePotes' outro: their ring opening on the Ectoplasma logo becomes
// a Boostz ring opening on the app icon, which then widens into the end card
// while the voice-over asks for the favourite card and a follow.
window.PUB = '2026-12-01';
const P = GAMES.pokemon[1];
const CX = 540, CY = 1000, RING = 470, IRIS = 1.5, MOVE = 2.3;
reel(`<div id="iris" class="abs" style="border-radius:50%;background:#131020"></div>
  <div ${A(IRIS + .5, null, 0, 'fade')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${ghosts([[880, 300, 90, 6], [110, 1420, 80, -8]])}
  ${reelPath('M-20 1850 C160 1810 300 1900 520 1860 S860 1800 1100 1840')}</div>
  <svg id="ring" class="abs" width="1080" height="1920" style="left:0;top:0;overflow:visible"><defs><linearGradient id="bz" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF4FA0"/><stop offset=".55" stop-color="#8B3DFF"/><stop offset="1" stop-color="#3AA9FF"/></linearGradient></defs>
    <g id="ringG"><circle cx="${CX + 10}" cy="${CY + 10}" r="1" fill="none" stroke="${SHADOW}" stroke-width="30"/>
    <circle cx="${CX}" cy="${CY}" r="1" fill="none" stroke="${INK}" stroke-width="30"/>
    <circle cx="${CX}" cy="${CY}" r="1" fill="none" stroke="url(#bz)" stroke-width="16"/></g></svg>
  <div id="icon" class="abs" style="left:${CX - 160}px;top:${CY - 160}px;width:320px;height:320px;border-radius:50%;overflow:hidden;border:9px solid ${INK};box-shadow:12px 12px 0 ${SHADOW};box-sizing:border-box;background:url(assets/icone-app.png) center/118% no-repeat"></div>
  <div class="abs h" ${A(MOVE + .45, null, 0, 'rise')} style="left:0;top:500px;width:1080px;text-align:center;font-size:96px">Et toi,<br><span style="color:${P}">ta préférée ?</span></div>
  <div class="abs mut" ${A(MOVE + .75, null, 0, 'rise')} style="left:0;top:745px;width:1080px;text-align:center;font-weight:600;font-size:40px">Dis-le en commentaire ⬇️</div>
  <div ${A(MOVE + 1.05, null, 0, 'rise')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${closing(1000, 110)}</div>`, 4.8);
const base = window.render, ease = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
const pop = (x) => { x = Math.max(0, Math.min(1, x)); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
window.render = (t) => {
  base(t);
  // The ring grows in, then the dark iris opens from inside it to the whole screen.
  const k = Math.max(0, Math.min(1, (t - IRIS) / 1.1)), iris = 2300 * (k < .5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2), r = Math.max(RING / 2 * pop(t / .6), iris);
  document.querySelectorAll('#ringG circle').forEach((c) => c.setAttribute('r', Math.max(1, r)));
  document.getElementById('ring').style.opacity = t < .02 ? 0 : 1 - ease((t - IRIS - .7) / .35);
  const ir = document.getElementById('iris');
  Object.assign(ir.style, { left: CX - iris + 'px', top: CY - iris + 'px', width: 2 * iris + 'px', height: 2 * iris + 'px' });
  // The icon lands in the ring, then rises to the top of the end card.
  const ic = document.getElementById('icon'), s = pop((t - .45) / .4), m = ease((t - MOVE) / .6);
  ic.style.opacity = Math.min(1, Math.max(0, (t - .45) / .1));
  ic.style.transform = `translateY(${(385 - CY) * m}px) scale(${s * (1 - .45 * m)}) rotate(${(1 - s) * 14 - 4 * (1 - m)}deg)`;
};
window.render(0);
</script></body></html>
