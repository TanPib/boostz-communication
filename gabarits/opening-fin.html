<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz fin de l'opening</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
<style>body, .reel { background: transparent !important; } .band { position: absolute; top: 0; left: 0; width: 1900px; height: 1920px; transform-origin: 50% 50%; }</style>
</head><body><script>
// End of the Collect Aura opening (a PokePotes video rebranded Boostz), rendered
// with a transparent background over the video's last frame (rendu.mjs alpha).
// It replaces PokePotes' outro (a ring opening on their Ectoplasma logo): the app
// icon pops onto the cards in a burst of confetti, then three bands in the colours
// of the wordmark's ghost Zs sweep in and leave the end card, while the voice-over
// asks for the favourite card and a follow.
window.PUB = '2026-12-15';
const P = GAMES.pokemon[1];
const CX = 540, CY = 1000, SWEEP = 1.45, MOVE = 2.3;
const BANDS = ['#3AA9FF', '#8B3DFF', '#FF4FA0', '#131020'];
// Confetti from a fixed seed, so every render draws the same burst.
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const COLORS = ['#FF4FA0', '#8B3DFF', '#3AA9FF', '#FCD34D', '#5FD3A3', '#F5F2FB'];
const BITS = Array.from({ length: 54 }, (_, i) => {
  const a = rnd() * Math.PI * 2, v = 900 + rnd() * 1300;
  return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 500, w: 16 + rnd() * 16, h: 26 + rnd() * 20, spin: (rnd() - .5) * 1600, c: COLORS[i % COLORS.length], round: rnd() < .3 };
});
reel(`${BITS.map((b, i) => `<div id="bit${i}" class="abs" style="width:${b.w}px;height:${b.round ? b.w : b.h}px;border-radius:${b.round ? '50%' : '5px'};background:${b.c};border:3px solid ${SHADOW};opacity:0"></div>`).join('')}
  <svg class="abs" width="1080" height="1920" style="left:0;top:0;overflow:visible"><circle id="wave1" cx="${CX}" cy="${CY}" r="1" fill="none" stroke="#FF4FA0" stroke-width="14" opacity="0"/><circle id="wave2" cx="${CX}" cy="${CY}" r="1" fill="none" stroke="#3AA9FF" stroke-width="10" opacity="0"/></svg>
  ${BANDS.map((c, i) => `<div id="band${i}" class="band" style="background:${c};${i < 3 ? `border-left:8px solid ${INK};box-shadow:-14px 0 0 ${SHADOW}` : ''}"></div>`).join('')}
  <div ${A(SWEEP + .6, null, 0, 'fade')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${ghosts([[880, 300, 90, 6], [110, 1420, 80, -8]])}
  ${reelPath('M-20 1850 C160 1810 300 1900 520 1860 S860 1800 1100 1840')}</div>
  <div id="icon" class="abs" style="left:${CX - 160}px;top:${CY - 160}px;width:320px;height:320px;border-radius:78px;border:9px solid ${INK};box-shadow:14px 14px 0 ${SHADOW};box-sizing:border-box;background:url(assets/icone-app.png) center/125% no-repeat;z-index:9"></div>
  <div class="abs h" ${A(MOVE + .5, null, 0, 'rise')} style="left:0;top:520px;width:1080px;text-align:center;font-size:96px">Et toi,<br><span style="color:${P}">ta préférée ?</span></div>
  <div class="abs mut" ${A(MOVE + .8, null, 0, 'rise')} style="left:0;top:765px;width:1080px;text-align:center;font-weight:600;font-size:40px">Dis-le en commentaire ⬇️</div>
  <div ${A(MOVE + 1.1, null, 0, 'rise')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${closing(1000, 110)}</div>`, 4.8);
const base = window.render, cl = (x) => Math.max(0, Math.min(1, x)), ease = (x) => 1 - Math.pow(1 - cl(x), 3);
const pop = (x) => { x = cl(x); const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
window.render = (t) => {
  base(t);
  // The icon pops in with a squash, wobbles, then jumps to the top of the end card with a spin.
  const ic = document.getElementById('icon'), p = pop(t / .45), m = ease((t - MOVE) / .55);
  const squash = 1 + .18 * Math.sin(cl(t / .7) * Math.PI * 3) * (1 - cl(t / .7));
  const wob = 8 * Math.sin(t * 6) * (1 - cl(t / 1.4));
  ic.style.opacity = cl(t / .06);
  ic.style.transform = `translateY(${(380 - CY) * m}px) scale(${p * squash * (1 - .55 * m)}, ${p / squash * (1 - .55 * m)}) rotate(${wob - 360 * m}deg)`;
  // Pop: two waves and the confetti, from .3 s.
  [['wave1', 0, 760], ['wave2', .08, 620]].forEach(([id, d, R]) => {
    const k = cl((t - .3 - d) / .55), w = document.getElementById(id);
    w.setAttribute('r', Math.max(1, 150 + R * ease(k))); w.setAttribute('opacity', k > 0 && k < 1 ? 1 - k : 0);
  });
  BITS.forEach((b, i) => {
    const s = t - .3, el = document.getElementById('bit' + i);
    if (s < 0) { el.style.opacity = 0; return; }
    const x = CX + b.vx * s * Math.exp(-s * 1.6), y = CY + b.vy * s * Math.exp(-s * 1.6) + 900 * s * s;
    el.style.opacity = 1 - cl((s - 1.1) / .4);
    el.style.transform = `translate(${x - b.w / 2}px, ${y}px) rotate(${b.spin * s}deg)`;
  });
  // The sweep: blue, violet, pink, then the dark background that stays.
  BANDS.forEach((c, i) => {
    const k = ease((t - SWEEP - i * .11) / .6);
    document.getElementById('band' + i).style.transform = `translateX(${1500 - 1900 * k}px) skewX(-20deg)`;
  });
};
window.render(0);
</script></body></html>
