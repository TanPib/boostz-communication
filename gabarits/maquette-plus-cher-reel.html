<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz plus cher ou moins cher</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
window.PUB = '2026-12-09';
// Mockup of "Plus cher ou moins cher ?": rounds of two cards of one game,
// a 3-2-1 countdown, then both prices and the winner. Example prices: the
// real episode (5 rounds) takes them from the records, dated and sourced.
const C = GAMES.pokemon[1];
const ROUNDS = [
  ['assets/carte-dracaufeu-base1-4.png', 'Dracaufeu, Set de base', 420, 'assets/carte-dracaufeu-ex-sv035-199.jpg', 'Dracaufeu-ex, 151', 95],
  ['assets/carte-pikachu-van-gogh-svp-085.png', 'Pikachu Van Gogh', 160, 'assets/carte-pikachu-ex-me025-276.png', 'Pikachu-ex 276', 210],
  ['assets/carte-chenipan-neo2-53.png', 'Chenipan, Neo Discovery', 3, 'assets/carte-raikou-ex-sar-108.jpg', 'Raikou-ex SAR', 48],
];
const S0 = 1.4, RD = 5;
const END = S0 + ROUNDS.length * RD;
const W = 440, H = 616, Y = 500, XL = 50, XR = 590;
const round = ([la, ln, lv, ra, rn, rv], k) => {
  const s = S0 + k * RD, o = s + RD - .1, rev = s + 3, win = lv > rv ? XL : XR, lose = lv > rv ? XR : XL;
  return `<div class="abs lab" style="left:0;top:${Y - 70}px;width:1080px;text-align:center;font-size:30px;color:${C}" ${A(s, o, 0, 'fade')}>MANCHE ${k + 1}/5</div>
  ${card(la, XL, Y, W, -3, 3, { h: H, attrs: A(s + .1, o, -3) })}${card(ra, XR, Y, W, 3, 3, { h: H, attrs: A(s + .25, o, 3) })}
  <div class="abs" style="left:${lose - 8}px;top:${Y - 8}px;width:${W + 16}px;height:${H + 16}px;border-radius:28px;background:rgba(11,8,18,.62);z-index:4" ${A(rev + .2, o, lose === XL ? -3 : 3, 'fade')}></div>
  ${[[XL, ln], [XR, rn]].map(([x, n]) => `<div class="abs ui" style="left:${x - 20}px;top:${Y + H + 34}px;width:${W + 40}px;text-align:center;font-size:32px;color:rgba(245,242,251,.8)" ${A(s + .4, o, 0, 'rise')}>${n}</div>`).join('')}
  ${[[XL, lv], [XR, rv]].map(([x, v]) => `<div class="abs h" style="left:${x}px;top:${Y + H + 90}px;width:${W}px;text-align:center;font-size:84px;color:${x === win ? C : 'rgba(245,242,251,.45)'}" ${A(rev, o, 0)}>${eur(v)}</div>`).join('')}
  ${st(win + W / 2 - 150, Y - 40, 300, 90, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:46px;color:${DARK}">+ cher !</div>`, { fill: C, r: win === XL ? -6 : 6, z: 6, attrs: A(rev + .3, o, win === XL ? -6 : 6) })}
  ${[3, 2, 1].map((n, i) => `<div class="abs" style="left:${540 - 100}px;top:${Y + H / 2 - 100}px;z-index:7" ${A(s + 1.1 + i * .6, s + 1.65 + i * .6, 0)}>${`<div style="width:200px;height:200px;border-radius:50%;background:${C};border:7px solid ${INK};box-shadow:12px 12px 0 ${SHADOW};display:flex;align-items:center;justify-content:center"><span class="h" style="font-size:120px;color:${DARK}">${n}</span></div>`}</div>`).join('')}`;
};
reel(`${ghosts([[60, 1500, 80, -8], [940, 1540, 70, 7]])}${head('PLUS CHER OU MOINS CHER ?', 'pokemon')}
  <div class="abs h" style="left:0;top:200px;width:1080px;text-align:center;font-size:100px" ${A(0, END, 0, 'rise')}>Laquelle vaut<br><span style="color:${C}">le plus ?</span></div>
  ${ROUNDS.map(round).join('')}
  ${ROUNDS.map((_, k) => `<div class="abs" style="left:${540 - 5 * 46 + 10}px;top:1440px;display:flex;gap:28px" ${A(S0 + k * RD, S0 + (k + 1) * RD - .1, 0, 'fade')}>${[0, 1, 2, 3, 4].map((j) => `<div style="width:64px;height:64px;border-radius:50%;border:5px solid ${INK};background:${j <= k ? C : 'transparent'};${j <= k ? `box-shadow:6px 6px 0 ${SHADOW}` : 'opacity:.4'}"></div>`).join('')}</div>`).join('')}
  <div class="abs src" style="left:70px;right:70px;bottom:215px;text-align:center;font-size:24px;color:rgba(255,255,255,.5)" ${A(.3, END, 0, 'fade')}>MAQUETTE · CHIFFRES D'EXEMPLE (le vrai post : 5 manches, cotes Cardmarket datées)</div>
  <div class="abs h" style="left:0;top:520px;width:1080px;text-align:center;font-size:96px" ${A(END + .1, null, 0, 'rise')}>Ton score<br><span style="color:${C}">sur 5 ?</span></div>
  <div class="abs ui" style="left:0;top:800px;width:1080px;text-align:center;font-size:44px;color:${VSOFT}" ${A(END + .6, null, 0, 'rise')}>Dis-le en commentaire 👇</div>
  <div class="abs ui mut" style="left:0;top:880px;width:1080px;text-align:center;font-size:36px" ${A(END + .9, null, 0, 'rise')}>Dans le doute, regarde la cote sur Boostz.</div>
  <div ${A(END + 1.3, null, 0, 'fade')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${closing(1100)}</div>
  ${reelPath('M-20 1830 C160 1780 300 1890 520 1840 S860 1760 1100 1820')}`, END + 4.5);
</script></body></html>
