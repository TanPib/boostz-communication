  '2027-02-01-erreurs-impression': [COV('2027-02-01-erreurs-impression'), 'reel'],
  '2027-05-02-zoom-atsuko-nishida': [CAR('2027-05-02-zoom-atsuko-nishida'), 'post'],
  '2027-02-07-classeur-page-hiver': [COV('2027-02-07-classeur-page-hiver'), 'reel'],
  '2027-02-22-types-de-collectionneurs': [COV('2027-02-22-types-de-collectionneurs'), 'reel'],

};
const [img, kind] = STORIES[location.hash.slice(1)] || Object.values(STORIES)[0];
// A Reel cover is 9:16, a carousel cover 4:5: both cards end above y 1330.
const [w, h] = kind === 'reel' ? [580, 1031] : [780, 975];
const cx = 540, ty = kind === 'reel' ? 290 : 330;
const spark = (x, y, s, c, i) => `<svg id="sp${i}" class="abs" width="${s}" height="${s}" viewBox="-50 -50 100 100" style="left:${x - s / 2}px;top:${y - s / 2}px;overflow:visible;z-index:7"><path d="M0 -46 C6 -10 10 -6 46 0 C10 6 6 10 0 46 C-6 10 -10 6 -46 0 C-10 -6 -6 -10 0 -46 Z" fill="${c}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/></svg>`;
const SPARKS = [[cx - w / 2 - 20, ty + 60, 84, SUN], [cx + w / 2 + 10, ty + h * .45, 70, '#FF4FA0'], [cx - w / 2 + 10, ty + h - 40, 60, '#3AA9FF']];
reel(`${ghosts([[60, 250, 90, -8], [930, 260, 80, 6], [70, 1560, 90, 10], [930, 1560, 100, -6]])}
  ${reelPath('M-20 1820 C160 1770 300 1890 520 1840 S860 1760 1100 1810')}
  <div class="abs lab" ${A(.1, null, 0, 'rise')} style="left:0;top:205px;width:1080px;text-align:center;font-size:28px;letter-spacing:8px;color:${VSOFT}">${kind === 'reel' ? 'NOUVEAU REEL' : 'NOUVEAU POST'}</div>
  <div id="card" class="abs" ${A(.2, null, -2)} style="left:${cx - w / 2}px;top:${ty}px;width:${w}px;height:${h}px;border:8px solid ${INK};border-radius:40px;overflow:hidden;box-shadow:16px 16px 0 ${SHADOW};z-index:5">
    <img id="cov" src="${img}" style="width:100%;height:100%;display:block;object-fit:cover"></div>
  ${SPARKS.map(([x, y, s, c], i) => spark(x, y, s, c, i)).join('')}
  ${st(160, 1400, 760, 150, `<div id="call" class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:54px;color:${DARK}">${kind === 'reel' ? 'Le Reel complet' : 'Le post complet'} sur le profil <span id="finger" style="display:inline-block;margin-left:14px">👆</span></div>`, { fill: SUN, r: 2, z: 6, attrs: A(.9, null, 2) })}
  <div class="abs" ${A(1.3, null, 0, 'fade')} style="left:0;top:1600px;width:1080px;display:flex;justify-content:center">${wordmark(60)}</div>`, 7);
const base = window.render;
window.render = (t) => {
  base(t);
  // The cover breathes inside its card, the card floats, the finger points up.
  document.getElementById('cov').style.transform = `scale(${1 + .05 * Math.sin(t * .9)})`;
  const card = document.getElementById('card');
  if (t > .55) card.style.transform += ` translateY(${Math.sin((t - .55) * 1.8) * 8}px)`;
  document.getElementById('finger').style.transform = `translateY(${-Math.abs(Math.sin(t * 3.2)) * 14}px)`;
  SPARKS.forEach((_, i) => {
    const k = (t * .8 + i * .33) % 1, s = Math.sin(Math.PI * k);
    const el = document.getElementById('sp' + i);
    el.style.opacity = t < .6 ? 0 : s; el.style.transform = `scale(${.4 + .7 * s}) rotate(${t * 40 + i * 30}deg)`;
  });
};
window.render(0);
