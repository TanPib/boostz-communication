<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz story de post</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  /* A 9:16 story announcing a 4:5 carousel post: its cover stuck on as a sticker.
     Stories have no caption, so the page carries the hook itself. The top 200 px
     and bottom 260 px stay clear of Instagram's and Facebook's story chrome. */
  .p { position: relative; overflow: hidden; width: 1080px; height: 1920px; margin-bottom: 20px; color: #F5F2FB; font-family: Exo; background: #131020; }
  .abs { position: absolute; }
  .h { font-family: Outfit; font-weight: 800; line-height: 1.02; letter-spacing: -1px; }
  .lab { font-family: 'DM Sans'; font-weight: 700; letter-spacing: 6px; }
  .word { font-family: Outfit; font-weight: 800; line-height: 1; }
  .grad { background: linear-gradient(135deg, #FF4FA0 0%, #8B3DFF 55%, #3AA9FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head><body>
<script>
const wordmark = (size) => `<div style="display:flex;align-items:baseline;transform:skewX(-8deg)"><span class="word" style="font-size:${size}px;color:#fff">boost</span><span style="position:relative;display:inline-block">`
  + [['#3AA9FF', -0.59, .12], ['#8B3DFF', -0.39, .2], ['#FF4FA0', -0.185, .3]].map(([c, l, o]) => `<span class="word" style="font-size:${size}px;position:absolute;top:0;left:${l * size}px;color:${c};opacity:${o}">Z</span>`).join('')
  + `<span class="word grad" style="font-size:${size}px;position:relative;color:transparent">Z</span></span></div>`;
const ghosts = [[60, 260, 90, -8], [920, 300, 80, 6], [80, 1650, 100, 10], [900, 1700, 110, -6]].map(([x, y, w, r]) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;border:4px solid rgba(255,255,255,.14);border-radius:${w * .16}px;transform:rotate(${r}deg)"><div style="width:60%;height:6px;margin:${w * .1}px auto 0;border-radius:3px;background:rgba(255,255,255,.14)"></div></div>`).join('');
// One entry per carousel post: the id (file name), the cover image (relative to this page), the hook.
const STORIES = [
  ['2026-10-20-guide-pokemon', '../images/2026-10-23-guide-scelles-pokemon/1-couverture.jpg', 'Booster, ETB, UPC…', 'tu t’y retrouves ?', 'Le guide des scellés Pokémon : notre nouveau post.'],
  ['2026-10-27-guide-onepiece', '../images/2026-11-17-guide-scelles-onepiece/1-couverture.jpg', 'PRB, Fruits du Démon…', 'tu t’y retrouves ?', 'Le guide des scellés One Piece : notre nouveau post.'],
  ['2026-11-04-guide-lorcana', '../images/2026-12-06-guide-scelles-lorcana/1-couverture.jpg', 'Booster, Trésor…', 'tu t’y retrouves ?', 'Le guide des scellés Lorcana : notre nouveau post.'],
  ['2026-11-11-guide-magic', '../images/2026-12-12-guide-scelles-magic/1-couverture.jpg', 'Bundle, Commander…', 'tu t’y retrouves ?', 'Le guide des scellés Magic : notre nouveau post.'],
  ['2026-11-19-guide-starwars', '../images/2027-01-07-guide-scelles-starwarsunlimited/1-couverture.jpg', 'Carbonite, Spotlight…', 'tu t’y retrouves ?', 'Le guide des scellés SWU : notre nouveau post.'],
  ['2026-12-02-guide-yugioh', '../images/2027-02-07-guide-scelles-yugioh/1-couverture.jpg', 'Méga-Tin, Structure…', 'tu t’y retrouves ?', 'Le guide des scellés Yu-Gi-Oh! : notre nouveau post.'],
  ['2026-10-17-mondes-natals', '../images/2026-10-17-sortie-mondes-natals/1-couverture.jpg', 'Mondes Natals', 'est sorti.', 'Star Wars Unlimited : notre nouveau post.'],
  ['2026-10-22-dracaufeu', '../images/2026-10-26-analyse-mega-dracaufeu-x-stickers/1-couverture.jpg', 'Méga-Dracaufeu X ex :', 'elle vaut combien ?', 'La réponse est dans notre nouveau post.'],
  ['2026-11-24-tigre-spectral', '../images/2027-02-01-mythe-tigre-spectral/1-affirmation.jpg', 'Une carte à 5 250 $', 'pour un tigre ?', 'Mythe ou réalité : swipe notre nouveau post.'],
  ['2026-11-06-regne-delta', '../images/2026-11-06-sortie-regne-delta/1-couverture.jpg', 'Règne Delta', 'sort aujourd’hui.', 'Tout savoir dans notre nouveau post.'],
  ['2026-11-12-deux-sorties', '../images/2026-11-12-sorties-maestros-star-trek/1-couverture.jpg', 'Deux sorties', 'cette semaine.', 'Yu-Gi-Oh! et Magic : notre nouveau post.'],
  ['2026-12-12-lexique', '../images/2027-02-16-lexique-tcg/1-couverture.jpg', 'Ça veut', 'dire quoi ?', 'Le lexique TCG dans notre nouveau post.'],
  ['2026-12-18-fb12', '../images/2026-12-18-sortie-fb12/1-couverture.jpg', 'Reach the God', 'sort aujourd’hui.', 'Dragon Ball : notre nouveau post.'],
  ['2026-12-24-protege', '../images/2026-12-24-protege-ta-collection/1-couverture.jpg', 'Tes cartes de Noël,', 'protège-les.', '5 gestes dans notre nouveau post.'],
  ['2026-12-30-records', '../images/2026-12-30-records-2026/1-couverture.jpg', '2026,', 'l’année des records.', '5 ventes records dans notre nouveau post.'],
  ['2026-11-09-histoire-pikachu', '../images/2026-11-09-histoire-pikachu-illustrateur/1-couverture.jpg', 'Elle ne s’achetait', 'pas en boutique.', 'L’histoire du Pikachu Illustrateur : notre nouveau post.'],
];
document.body.innerHTML = STORIES.map(([id, img, a, b, sub]) => `<div class="p" id="${id}">${ghosts}
  <svg class="abs" width="1080" height="1920" style="left:0;top:0"><path d="M-20 1820 C160 1770 300 1890 520 1840 S860 1760 1100 1810" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/></svg>
  <div class="abs lab" style="left:0;top:230px;width:1080px;text-align:center;font-size:26px;color:#C4B5FD">NOUVEAU POST</div>
  <div class="abs" style="left:150px;top:300px;width:780px;height:975px;border:8px solid #F5F2FB;border-radius:40px;overflow:hidden;box-shadow:16px 16px 0 #05040A;transform:rotate(-2deg)"><img src="${img}" style="width:100%;height:100%;display:block"></div>
  <div class="abs h" style="left:0;top:1330px;width:1080px;text-align:center;font-size:76px">${a}<br><span style="color:#C4B5FD">${b}</span></div>
  <div class="abs" style="left:0;top:1515px;width:1080px;text-align:center;font-weight:600;font-size:38px;color:#A8A2B8">${sub}</div>
  <div class="abs" style="left:0;top:1600px;width:1080px;display:flex;justify-content:center">${wordmark(64)}</div></div>`).join('');
</script></body></html>
