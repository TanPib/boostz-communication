<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz détails cachés</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
window.PUB = '2027-01-01';
// Mockup of "Le détail que tu n'avais jamais vu" (proposed on 08/10/2026):
// one card per slide, a ring on a detail of the real scan and a magnifier
// showing it up close, with what it is. Only details visible on the scan or
// sourced facts.
const C = GAMES.pokemon[1];
const DETAILS = [
  ['givrali', 'assets/hiv-givrali-vmax-alt.png', 734 / 1024, .83, .56, 3.6, 'Givrali VMAX', 'Évolution Céleste, 2021',
    'En bas à droite, derrière Givrali : <b>Pikachu</b> se cache dans l’illustration.'],
  ['ectoplasma', 'assets/carte-ectoplasma-vmax-swsh8-271.jpg', 600 / 825, .2, .4, 2.6, 'Ectoplasma VMAX', 'Poing de Fusion, 2021',
    'Regarde les arbres : leurs baies s’envolent vers sa bouche. Ectoplasma aspire tout, comme son attaque <b>Engloutissement G-Max</b>.'],
  ['van-gogh', 'assets/carte-pikachu-van-gogh-svp-085.png', 733 / 1024, .59, .42, 2.1, 'Pikachu au chapeau de feutre gris', 'Promo, 2023',
    'Ce chapeau vient de l’<b>Autoportrait au chapeau de feutre gris</b> de Van Gogh (1887), exposé au musée Van Gogh d’Amsterdam, partenaire de la carte.'],
];
const CW = 470, D = 440;
const slide = ([id, img, ratio, fx, fy, z, name, set, txt], i) => {
  const CH = CW / ratio, cx = 80, cy = 250, rx = cx + fx * CW, ry = cy + fy * CH, rr = D / (2 * z);
  const ix = 580, iy = 270;
  return [`${i + 2}-${id}`, `${head(`LE DÉTAIL CACHÉ · ${i + 1}/3`, 'pokemon')}
    ${card(img, cx, cy, CW, 0, 2, { h: CH })}
    <svg class="abs" width="1080" height="1350" style="left:0;top:0;z-index:4;overflow:visible"><line x1="${rx + rr * .7}" y1="${ry - rr * .7}" x2="${ix + D * .15}" y2="${iy + D * .85}" stroke="${C}" stroke-width="8" stroke-linecap="round"/>
      <circle cx="${rx}" cy="${ry}" r="${rr}" fill="none" stroke="${C}" stroke-width="9"/></svg>
    <div class="abs" style="left:${ix}px;top:${iy}px;width:${D}px;height:${D}px;border-radius:50%;overflow:hidden;border:9px solid ${C};box-shadow:14px 14px 0 ${SHADOW};z-index:5;background:#000">
      <img src="${img}" style="position:absolute;width:${CW * z}px;height:${CH * z}px;left:${D / 2 - fx * CW * z}px;top:${D / 2 - fy * CH * z}px"></div>
    <div class="abs" style="left:600px;top:760px;width:410px">
      <div class="h" style="font-size:46px;line-height:1.05">${name}</div><div class="ui mut" style="font-size:28px;margin-top:8px">${set}</div></div>
    ${st(70, 960, 940, 230, `<div class="ui" style="display:flex;align-items:center;height:100%;padding:0 44px;font-size:35px;line-height:1.3;font-weight:600;color:${DARK}"><span>${txt}</span></div>`, { fill: C, r: -1, z: 6 })}
    ${src('MAQUETTE · Images : pokemontcg.io, TCGdex. © Pokémon / Nintendo / Creatures / GAME FREAK.')}`];
};
carousel([
  ['1-couverture', `${ghosts([[90, 300, 80, -6], [930, 280, 80, 8]])}${track(0, 1165, .2)}${head('LE DÉTAIL CACHÉ', 'pokemon')}
    <div class="abs h" style="left:0;top:200px;width:1080px;text-align:center;font-size:112px">Tu l’avais<br><span style="color:${C}">déjà vu ?</span></div>
    ${card(DETAILS[0][1], 300, 440, 440, -3, 2, { h: 440 / DETAILS[0][2] })}
    <div class="abs" style="left:630px;top:700px;width:300px;height:300px;border-radius:50%;overflow:hidden;border:9px solid ${C};box-shadow:14px 14px 0 ${SHADOW};z-index:5;background:#000">
      <img src="${DETAILS[0][1]}" style="position:absolute;width:${440 * 3.6}px;left:${150 - .83 * 440 * 3.6}px;top:${150 - .56 * (440 / DETAILS[0][2]) * 3.6}px"></div>
    <div class="abs" style="left:70px;top:1250px">${wordmark(46)}</div><div class="abs ui mut" style="right:70px;top:1258px;font-size:30px">Swipe →</div>`],
  ...DETAILS.map(slide),
  ['5-fin', `${ghosts([[100, 520, 80, -6], [900, 540, 90, 8]])}${track(4, 1200, .6)}${head('LE DÉTAIL CACHÉ', 'pokemon')}
    <div class="abs h" style="left:0;top:220px;width:1080px;text-align:center;font-size:92px">Tu connais un autre<br><span style="color:${C}">détail caché ?</span></div>
    <div class="abs ui mut" style="left:0;top:470px;width:1080px;text-align:center;font-size:38px">Dis-le en commentaire, on le met dans le prochain 👇</div>
    ${closing(800)}`],
]);
</script></body></html>
