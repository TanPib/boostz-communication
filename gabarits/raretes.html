const cardImg = (img, x, y, w, r, rev, iw = SW, ih = SH) => {
  const h = w * ih / iw;
  // Reverse: a sheen everywhere but the artwork window (x 7.8-92.2 %, y 9.7-47.3 % on this layout).
  const sheen = rev ? `<svg class="abs" width="${w}" height="${h}" viewBox="0 0 100 137.5" preserveAspectRatio="none" style="left:0;top:0;mix-blend-mode:screen"><defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#9FE8FF" stop-opacity=".85"/><stop offset=".5" stop-color="#FFB8F0" stop-opacity=".9"/><stop offset=".65" stop-color="#FFF3A0" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <path fill-rule="evenodd" fill="url(#sh)" d="M0 0H100V137.5H0Z M7.8 13.3H92.2V65H7.8Z"/></svg>` : '';
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg);border:8px solid ${INK};border-radius:${w * .05}px;overflow:hidden;box-shadow:16px 16px 0 ${SHADOW};z-index:3;background:#000"><img src="assets/${img}" style="width:100%;height:100%;display:block">${sheen}</div>`;
};
// The zoom: a marker area of the scan, magnified to 420 px wide at most, as a sticker.
const zoom = (img, [zx, zy, zw, zh], x, y, iw = SW, ih = SH) => {
  const k = Math.min(g.zk || 2.8, 420 / zw), w = zw * k, h = zh * k;
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border:7px solid ${INK};border-radius:24px;box-shadow:12px 12px 0 ${SHADOW};overflow:hidden;z-index:5;transform:rotate(2deg);background:url(assets/${img}) ${-zx * k}px ${-zy * k}px / ${iw * k}px ${ih * k}px no-repeat"></div>`;
};
// One or two zooms stacked under "LE SYMBOLE"; returns the html and the y where the text can start.
const zooms = (img, list, iw, ih) => {
  let y = 410, html = '';
  for (const z of list) { html += zoom(img, z, 600, y, iw, ih); y += z[3] * Math.min(g.zk || 2.8, 420 / z[2]) + 30; }
  return [html, y + 4];
};
