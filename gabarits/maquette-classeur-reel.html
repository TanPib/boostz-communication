<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz classeur à thème</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
window.PUB = '2026-12-09';
// Mockup of "Le classeur à thème": a 9-pocket binder page built for its
// look, on one theme (here winter), cards from any game chosen for their
// art. The cards slide into their sleeves one by one under falling snow;
// the page's value only comes at the very end, small.
const ICE = '#A8DDF5', WHITE = '#FFFFFF';
const CARDS = ['hiv-snow-forest.jpg', 'hiv-givrali-v-alt.png', 'hiv-anna.avif', 'hiv-olaf.avif', 'carte-elsa-enchantee-tfc-207.avif',
  'hiv-trishula.jpg', 'hiv-givrali-vmax-alt.png', 'hiv-snow-island.jpg', 'hiv-lokhlass.png'];
const T0 = 1.6, STEP = .55, HOLD = T0 + 9 * STEP + .4, END = HOLD + 3.4;
const W = 236, H = 330, GX = 24, GY = 28, PAD = 36, PW = 3 * W + 2 * GX + 2 * PAD, PH = 3 * H + 2 * GY + 2 * PAD, PX = (1080 - PW) / 2, PY = 500;
const pos = (i) => [PAD + (i % 3) * (W + GX), PAD + Math.floor(i / 3) * (H + GY)];
// Sleeves: an empty pocket, then the card, then the sleeve's gloss over it.
const sleeves = CARDS.map((img, i) => { const [x, y] = pos(i); return `
  <div class="abs" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px;border-radius:14px;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.25)"></div>
  <div id="c${i}" class="abs" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px;border-radius:12px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.45);opacity:0"><img src="assets/${img}" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  <div id="g${i}" class="abs" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px;border-radius:14px;overflow:hidden;pointer-events:none"><div id="sh${i}" style="position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(18deg);opacity:0"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%,transparent 70%,rgba(255,255,255,.1))"></div></div>`; }).join('');
// Snow on the page's top edge.
const cap = `<svg class="abs" width="${PW + 40}" height="80" viewBox="0 0 ${PW + 40} 80" style="left:-20px;top:-46px;z-index:4;filter:drop-shadow(6px 6px 0 ${SHADOW})"><path d="M10 64 Q30 30 70 40 Q110 14 160 34 Q210 10 270 30 Q330 8 390 32 Q450 12 510 30 Q570 6 630 30 Q690 14 750 34 Q800 18 ${PW + 30} 60 L${PW + 30} 72 L10 72 Z" fill="${WHITE}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></svg>`;
const FLAKES = Array.from({ length: 80 }, (_, i) => { const r = (k) => ((Math.sin(i * 127.1 + k * 311.7) * 43758.5453) % 1 + 1) % 1; return [r(1) * 1080, r(2) * 2000, 4 + r(3) * 10, 40 + r(4) * 70, .35 + r(5) * .55, r(6) * 6]; });
reel(`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:linear-gradient(180deg,#0E1630 0%,#131020 55%,#1B1330 100%)"></div>
  ${FLAKES.map((_, i) => `<div id="f${i}" class="abs" style="border-radius:50%;background:#fff"></div>`).join('')}
  ${deco([['sapin', 70, 120, 120, -6], ['etincelle', 900, 150, 100, 10]])}
  <div class="abs lab" style="left:0;top:170px;width:1080px;text-align:center;font-size:26px;letter-spacing:6px;color:${ICE}" ${A(0, END, 0, 'fade')}>LE CLASSEUR À THÈME · N°1</div>
  <div class="abs h" style="left:0;top:225px;width:1080px;text-align:center;font-size:150px" ${A(0, END, 0, 'rise')}>Page <span style="color:${ICE}">Hiver</span></div>
  <div class="abs mut" style="left:0;top:405px;width:1080px;text-align:center;font-weight:600;font-size:34px" ${A(.3, END, 0, 'rise')}>9 cartes, 4 jeux, une seule ambiance.</div>
  <div id="page" class="abs" style="left:${PX}px;top:${PY}px;width:${PW}px;height:${PH}px;border-radius:30px;background:linear-gradient(160deg,rgba(168,221,245,.22),rgba(29,23,48,.9) 60%);border:6px solid ${INK};box-shadow:16px 16px 0 ${SHADOW};z-index:2" ${A(.4, END, 0, 'fade')}>${cap}${sleeves}</div>
  <div class="abs src" style="left:70px;right:70px;bottom:150px;text-align:center;font-size:24px;color:rgba(255,255,255,.5)" ${A(.4, END, 0, 'fade')}>MAQUETTE · Cartes : Wizards of the Coast, The Pokémon Company, Disney / Ravensburger, Konami</div>
  <div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:rgba(11,8,18,.88);z-index:8" ${A(END, null, 0, 'fade')}></div>
  <div class="abs h" style="left:0;top:330px;width:1080px;text-align:center;font-size:96px;z-index:9" ${A(END + .2, null, 0, 'rise')}>Laquelle tu glisses<br><span style="color:${ICE}">dans ton classeur ?</span></div>
  <div class="abs ui" style="left:0;top:610px;width:1080px;text-align:center;font-size:40px;color:${VSOFT};z-index:9" ${A(END + .6, null, 0, 'rise')}>Propose le prochain thème en commentaire 👇</div>
  <div class="abs mut" style="left:0;top:700px;width:1080px;text-align:center;font-weight:600;font-size:32px;z-index:9" ${A(END + .9, null, 0, 'rise')}>Cette page vaut 3 480 € sur Boostz (chiffre d'exemple).</div>
  <div class="abs" style="left:0;top:0;width:1080px;height:1920px;z-index:9" ${A(END + 1.2, null, 0, 'fade')}>${closing(1050)}</div>`, END + 5);
const base = window.render;
window.render = (t) => {
  base(t);
  FLAKES.forEach(([x, y, s, v, o, ph], i) => { const e = document.getElementById('f' + i), yy = ((y + t * v) % 2000) - 40;
    e.style.cssText = `position:absolute;border-radius:50%;background:#fff;width:${s}px;height:${s}px;opacity:${o};z-index:${s > 10 ? 7 : 1};left:${x + Math.sin(t * .8 + ph) * 18}px;top:${yy}px`; });
  CARDS.forEach((_, i) => { const at = T0 + i * STEP, p = clamp((t - at) / .4), e = document.getElementById('c' + i);
    // The card slides down into its sleeve, then the sleeve catches the light.
    e.style.opacity = clamp(p / .15); e.style.transform = `translateY(${-90 * (1 - out3(p))}px) rotate(${4 * (1 - out3(p)) * (i % 2 ? 1 : -1)}deg)`;
    const g = clamp((t - at - .35) / .6), sh = document.getElementById('sh' + i);
    sh.style.opacity = g > 0 && g < 1 ? 1 : 0; sh.style.left = `${-60 + 190 * g}%`; });
  // A slow push in once the page is full.
  const z = out3((t - HOLD) / 3);
  const pg = document.getElementById('page'); pg.style.transform = `${pg.style.transform} scale(${1 + .05 * z})`;
};
window.render(0);
</script></body></html>
