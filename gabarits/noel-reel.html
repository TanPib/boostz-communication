<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz Noel</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Noël: a card to slip under the tree, for three budgets. Each card lands as a
// sticker with its price, its source and its date.
// Prices: Cardmarket 30-day average from our record of 03/10/2026 (Pokémon);
// TCGplayer market price via Lorcast, mirrored by novaoc/rarebox-data on
// 05/10/2026 (Lorcana). To refresh before publication.
const CARDS = [
  { game: 'pokemon', img: 'assets/carte-cadoizo-me01-152.jpg', budget: 'PETIT BUDGET', name: 'Cadoizo', set: 'Méga-Évolution · 152 · Illustration rare', price: eur(2.92), src: 'Cardmarket, moyenne 30 jours, 03/10/2026' },
  { game: 'lorcana', img: 'assets/carte-elsa-p1-19.jpg', budget: 'BUDGET MOYEN', name: 'Elsa', set: 'Promo · 19/P1', price: usd(34.25), src: 'TCGplayer (via Lorcast), 05/10/2026' },
  { game: 'pokemon', img: 'assets/carte-givrali-ex-sv085-150.jpg', budget: 'GRAND BUDGET', name: 'Givrali-ex', set: 'Évolutions Prismatiques · 150 · Illustration spéciale rare', price: eur(168.02), src: 'Cardmarket, moyenne 30 jours, 03/10/2026' },
];
const T0 = 2.6, STEP = 3.2;
const scene = (c, i) => {
  const at = T0 + i * STEP, out = at + STEP - .3, r = [-4, 3, -3][i];
  return `${card(c.img, 250, 330, 580, r, 3, { attrs: A(at, out, r) })}
  <div class="abs" ${A(at + .35, out, 0, 'rise')} style="left:0;top:1190px;width:1080px;text-align:center;z-index:5">
    <div class="lab" style="font-size:26px;letter-spacing:6px;color:${GAMES[c.game][1]}">${c.budget} · ${GAMES[c.game][0]}</div>
    <div class="h" style="font-size:66px;margin-top:10px">${c.name}</div>
    <div class="mut" style="font-weight:600;font-size:30px;margin-top:10px">${c.set}</div></div>
  ${st(330, 1500, 420, 140, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:80px;color:${DARK}">${c.price}</div>`, { fill: [DONE, GAMES.lorcana[1], SUN][i], r: -r, z: 6, attrs: A(at + .8, out, -r) })}
  <div class="abs" ${A(at + 1.1, out, 0, 'fade')} style="left:70px;right:70px;top:1680px;text-align:center;font-family:Exo;font-size:26px;color:rgba(255,255,255,.5)">${c.src}</div>`;
};
const END = T0 + CARDS.length * STEP;
reel(`${ghosts([[60, 160, 90, -8], [930, 260, 80, 6], [70, 1760, 90, 10], [900, 1780, 100, -6]])}
  ${reelPath('M-20 1800 C160 1750 300 1870 520 1820 S860 1740 1100 1790')}
  <div class="abs h" ${A(.2, T0 - .3, 0, 'rise')} style="left:0;top:560px;width:1080px;text-align:center;font-size:110px">Une carte<br>sous le sapin ?</div>
  <div class="abs h acc" ${A(1.1, T0 - .3, 0, 'rise')} style="left:0;top:880px;width:1080px;text-align:center;font-size:72px">Une idée<br>pour chaque budget.</div>
  ${CARDS.map(scene).join('')}
  <div class="abs h" ${A(END, null, 0, 'rise')} style="left:0;top:520px;width:1080px;text-align:center;font-size:110px">Joyeux<br><span style="color:${DONE}">Noël</span></div>
  <div class="abs" ${A(END + .5, null, 0, 'rise')} style="left:0;top:880px;width:1080px;display:flex;flex-direction:column;align-items:center;gap:26px">${wordmark(110)}
    <div class="mut" style="font-weight:600;font-size:38px">Ton compagnon TCG, bientôt sur ton téléphone</div>
    <div class="ui" style="font-size:36px;color:${VSOFT}">Abonne-toi pour ne rien manquer</div></div>`, END + 3.2);
</script></body></html>
