<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz encres Lorcana</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// "Choisis tes encres" (type 8, Lorcana edition, 06/03/2027): the six inks
// stick in one by one, then the question. A deck plays two inks at most.
// Ink identities from Ravensburger's own descriptions, searched on 07/10/2026
// (Mushu Report wiki quoting them, thegamer.com for the two-ink rule).
// The gems are drawn in our sticker style: not the game's ink symbols.
window.PUB = '2027-03-06';
const L = GAMES.lorcana[1];
const INKS = [['Ambre', '#F4B223', 'protège ses amis<br>à tout prix'], ['Améthyste', '#A66FD1', 'la magie<br>et les sortilèges'], ['Émeraude', '#3DBE6C', 's’adapte<br>à tout'],
  ['Rubis', '#E8485E', 'vitesse<br>et bravoure'], ['Saphir', '#3AA9FF', 'stratégie<br>et invention'], ['Acier', '#A9B2C4', 'la force<br>brute']];
const gem = (c, s) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100" style="overflow:visible;filter:drop-shadow(7px 7px 0 ${SHADOW})">
  <polygon points="50,6 90,30 90,70 50,94 10,70 10,30" fill="${c}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="50,6 90,30 50,44 10,30" fill="#fff" opacity=".28"/><polygon points="50,44 50,94 10,70 10,30" fill="#000" opacity=".12"/></svg>`;
const T1 = 1.7, STEP = .55, ASK = T1 + 6 * STEP + .7, OUT = ASK + 3.6;
const tile = ([name, c, k], i) => {
  const x = 70 + (i % 3) * 330, y = 700 + Math.floor(i / 3) * 380, r = [-2, 1.5, -1, 2, -1.5, 1][i];
  return st(x, y, 280, 330, `<div style="display:flex;flex-direction:column;align-items:center;padding-top:30px">${gem(c, 112)}
    <div class="h" style="font-size:48px;margin-top:22px;color:${c}">${name}</div>
    <div class="mut" style="font-weight:600;font-size:25px;line-height:1.25;text-align:center;margin-top:10px">${k}</div></div>`, { r, z: 3, attrs: A(T1 + i * STEP, OUT, r) });
};
reel(`${ghosts([[930, 330, 80, 6], [700, 110, 70, -8]])}
  ${reelPath('M-20 1850 C160 1810 300 1900 520 1860 S860 1800 1100 1840')}
  <div class="abs" ${A(.2, OUT, 0, 'rise')} style="left:70px;top:150px;display:flex;align-items:center;gap:22px">${emblemDisc('lorcana', 84)}<div><div class="lab" style="font-size:26px;letter-spacing:6px;color:${L}">LORCANA</div><div class="lab" style="font-size:24px;letter-spacing:5px;color:${VSOFT};margin-top:6px">LES 6 ENCRES</div></div></div>
  <div class="abs h" ${A(.4, OUT, 0, 'rise')} style="left:0;top:330px;width:1080px;text-align:center;font-size:118px">Choisis tes<br><span style="color:${L}">encres.</span></div>
  <div class="abs mut" ${A(.9, OUT, 0, 'rise')} style="left:0;top:600px;width:1080px;text-align:center;font-weight:600;font-size:40px">Un deck, deux encres au plus.</div>
  ${INKS.map(tile).join('')}
  <div class="abs" ${A(T1 + 6 * STEP, OUT, 0, 'fade')} style="left:70px;right:70px;top:1468px;text-align:center;font-family:Exo;font-size:22px;color:rgba(255,255,255,.45)">Les encres et leur caractère : Ravensburger (Disney Lorcana), relevé le 07/10/2026.</div>
  ${st(120, 1530, 840, 160, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:76px;color:${DARK}">Tu joues lesquelles ?</div>`, { fill: L, r: -2, z: 6, attrs: A(ASK, OUT, -2) })}
  <div class="abs mut" ${A(ASK + .6, OUT, 0, 'rise')} style="left:0;top:1722px;width:1080px;text-align:center;font-weight:600;font-size:36px">Deux encres, réponds en commentaire ⬇️</div>
  <div class="abs h" ${A(OUT + .2, null, 0, 'rise')} style="left:0;top:500px;width:1080px;text-align:center;font-size:88px">Suis la cote<br><span class="acc">de tes cartes Lorcana.</span></div>
  <div ${A(OUT + .7, null, 0, 'rise')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${closing(820, 110)}</div>`, OUT + 4);
</script></body></html>
