<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz master set</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
window.PUB = '2027-01-01';
// Mockup of "Le coût d'un master set" (proposed on 08/10/2026): a race
// between opening boosters (the completion bar slows down as doubles pile
// up) and buying every card on its own. Example figures: the real episode
// takes pull rates, booster prices and every card's price from the records.
const C = GAMES.pokemon[1];
const CARDS = 207, PACKS = 380, PACK_PRICE = 6, SINGLES = 1450;
const R0 = 2.2, R1 = 10.2, END = 14.6;
const prog = (t) => clamp((t - R0) / (R1 - R0));
const pack = (x, y) => `<svg class="abs" width="40" height="58" viewBox="0 0 100 155" style="left:${x}px;top:${y}px"><path d="M8 6 L92 6 L96 14 L92 22 L96 30 L92 38 L92 125 L96 133 L92 141 L96 149 L8 149 L4 141 L8 133 L4 125 L8 38 L4 30 L8 22 L4 14 Z" fill="${VIOLET}" stroke="${INK}" stroke-width="6"/><circle cx="50" cy="78" r="20" fill="none" stroke="${INK}" stroke-width="7"/></svg>`;
const PACK_ICONS = 40, CELLS = CARDS;
reel(`${ghosts([[60, 1560, 80, -8], [950, 1580, 70, 7]])}${deco([])}
  <div class="abs lab" style="left:0;top:150px;width:1080px;text-align:center;font-size:28px;color:${C}" ${A(0, END, 0, 'fade')}>POKÉMON · LE COÛT D’UN MASTER SET</div>
  <div class="abs h" style="left:0;top:200px;width:1080px;text-align:center;font-size:96px" ${A(0, END, 0, 'rise')}>Compléter 151,<br><span style="color:${C}">ça coûte combien ?</span></div>
  ${st(50, 480, 470, 900, '', { attrs: A(.4, END, -1), r: -1 })}${st(560, 480, 470, 900, '', { attrs: A(.55, END, 1), r: 1 })}
  <div class="abs" style="left:50px;top:480px;width:470px;z-index:3" ${A(.7, END, 0, 'fade')}>
    <div class="ui" style="text-align:center;margin-top:36px;font-size:34px">En ouvrant<br>des boosters</div>
    <div id="eurA" class="h" style="text-align:center;margin-top:20px;font-size:80px;color:${PINK}">0 €</div>
    <div id="nA" class="ui mut" style="text-align:center;font-size:28px">0 booster</div>
    <div style="margin:26px 40px 0;height:26px;border-radius:13px;background:rgba(196,181,253,.15);overflow:hidden"><div id="barA" style="height:100%;width:0;background:${PINK}"></div></div>
    <div id="pA" class="ui" style="text-align:center;margin-top:10px;font-size:28px;color:${PINK}">0 % du set</div></div>
  <div class="abs" style="left:50px;top:480px;width:470px;height:900px;z-index:3">${Array.from({ length: PACK_ICONS }, (_, i) => `<div id="pk${i}" style="opacity:0">${pack(52 + (i % 8) * 46, 520 + Math.floor(i / 8) * 66)}</div>`).join('')}</div>
  <div class="abs" style="left:560px;top:480px;width:470px;z-index:3" ${A(.85, END, 0, 'fade')}>
    <div class="ui" style="text-align:center;margin-top:36px;font-size:34px">En achetant<br>les cartes à l’unité</div>
    <div id="eurB" class="h" style="text-align:center;margin-top:20px;font-size:80px;color:${DONE}">0 €</div>
    <div id="nB" class="ui mut" style="text-align:center;font-size:28px">0 carte</div>
    <div style="margin:26px 40px 0;height:26px;border-radius:13px;background:rgba(196,181,253,.15);overflow:hidden"><div id="barB" style="height:100%;width:0;background:${DONE}"></div></div>
    <div id="pB" class="ui" style="text-align:center;margin-top:10px;font-size:28px;color:${DONE}">0 % du set</div></div>
  <div class="abs" style="left:560px;top:480px;width:470px;height:900px;z-index:3">${Array.from({ length: CELLS }, (_, i) => `<div id="cl${i}" class="abs" style="left:${45 + (i % 12) * 32}px;top:${520 + Math.floor(i / 12) * 19}px;width:26px;height:14px;border-radius:3px;background:rgba(196,181,253,.14)"></div>`).join('')}</div>
  ${st(140, 1420, 800, 170, `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:${DARK}"><div class="h" style="font-size:64px">${eur(PACKS * PACK_PRICE - SINGLES)} d’écart</div><div class="ui" style="font-size:30px">À l’unité, c’est moins cher… mais moins fun 😅</div></div>`, { fill: C, r: -2, z: 8, attrs: A(R1 + .5, END, -2) })}
  <div class="abs src" style="left:70px;right:70px;bottom:215px;text-align:center;font-size:24px;color:rgba(255,255,255,.5)" ${A(.3, END, 0, 'fade')}>MAQUETTE · CHIFFRES D’EXEMPLE (le vrai post : taux de tirage, prix du booster et cote de chaque carte, datés)</div>
  <div class="abs h" style="left:0;top:520px;width:1080px;text-align:center;font-size:92px" ${A(END + .1, null, 0, 'rise')}>Toi, tu ouvres<br><span style="color:${C}">ou tu achètes ?</span></div>
  <div class="abs ui" style="left:0;top:800px;width:1080px;text-align:center;font-size:42px;color:${VSOFT}" ${A(END + .5, null, 0, 'rise')}>Suis la cote de chaque carte sur Boostz.</div>
  <div ${A(END + 1, null, 0, 'fade')} class="abs" style="left:0;top:0;width:1080px;height:1920px">${closing(1100)}</div>
  ${reelPath('M-20 1830 C160 1780 300 1890 520 1840 S860 1760 1100 1820')}`, END + 4.5);
const base = window.render, $ = (id) => document.getElementById(id);
window.render = (t) => {
  base(t);
  const u = prog(t), on = t < END ? 1 : 0;
  // Boosters: a steady stream of packs, the completion slows as doubles pile up.
  const n = Math.round(PACKS * u), done = Math.min(1, (1 - Math.exp(-n / 70)) / (1 - Math.exp(-PACKS / 70)));
  $('eurA').textContent = eur(n * PACK_PRICE); $('nA').textContent = `${n} booster${n > 1 ? 's' : ''}`;
  $('barA').style.width = `${done * 100}%`; $('pA').textContent = `${Math.floor(done * 100)} % du set`;
  for (let i = 0; i < PACK_ICONS; i++) $('pk' + i).style.opacity = on * (i < Math.round(PACK_ICONS * u) ? 1 : 0);
  // Singles: one card after another, at a steady price.
  const m = Math.round(CARDS * clamp(u * 1.6));
  $('eurB').textContent = eur(Math.round(SINGLES * m / CARDS)); $('nB').textContent = `${m} carte${m > 1 ? 's' : ''}`;
  $('barB').style.width = `${m / CARDS * 100}%`; $('pB').textContent = `${Math.floor(m / CARDS * 100)} % du set`;
  for (let i = 0; i < CELLS; i++) { const c = $('cl' + i); c.style.opacity = on; c.style.background = i < m ? DONE : 'rgba(196,181,253,.14)'; }
};
window.render(0);
</script></body></html>
