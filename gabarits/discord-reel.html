<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz Discord</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Join the Boostz Discord server (asked on 07/10/2026; redone on 08/10/2026, the first
// version was "vraiment ennuyant visuellement"). A Discord-style chat comes alive:
// messages from collectors of the 8 games pop in with real cards, reactions tick up,
// someone is typing. The channels are not named, and the chat is marked as an example.
// Render with: node rendu.mjs discord-reel.html video
window.PUB = '2026-10-23';
const LINK = 'discord.gg/R54wCGtkr', BLURPLE = '#5865F2';
const T1 = 3.2, T2 = 11.4, T3 = 14.2, END = 18.4;
// The chat: [game, user name, text, card or null, [emoji, from, to], at].
const MSGS = [
  ['pokemon', 'dresseur_77', 'Regardez ce que je viens de pull 😱', 'carte-dracaufeu-ex-sv035-199.jpg', ['🔥', 1, 24], T1 + .4],
  ['lorcana', 'ink.caster', 'Elsa enchantée, enfin dans mon classeur ✨', 'carte-elsa-enchantee-tfc-207.avif', ['😍', 1, 18], T1 + 2.4],
  ['onepiece', 'nakama.op', 'Elle vaut combien, la Luffy parallèle ?', null, null, T1 + 4.4],
  ['magic', 'planeswalk3r', 'Regarde sa cote sur Boostz 😉', null, ['👍', 1, 9], T1 + 5.6],
];
const AV = 78, X0 = 90, W = 900, PT = 250, PH = 1290, BOTTOM = PT + PH - 110;
const msgs = MSGS.map(([g, user, text, img, react, at], i) => {
  return `<div id="m${i}" class="abs" ${A(at, T2, 0, 'rise')} style="left:${X0 + 36}px;top:${BOTTOM}px;width:${W - 68}px;display:flex;gap:22px;z-index:6">
    <div style="flex:none">${emblemDisc(g, AV)}</div>
    <div style="min-width:0">
      <div style="display:flex;align-items:baseline;gap:14px"><span class="ui" style="font-size:34px;color:${GAMES[g][1]}">${user}</span><span class="mut" style="font-size:22px">Aujourd’hui</span></div>
      <div style="font-family:Poppins;font-weight:500;font-size:38px;line-height:1.3;color:#DBDEE1;margin-top:4px">${text}</div>
      ${img ? `<div style="margin-top:14px;width:230px;height:322px;border-radius:14px;overflow:hidden;border:4px solid #1E1F22;box-shadow:8px 8px 0 ${SHADOW}"><img src="assets/${img}" style="width:100%;height:100%;object-fit:cover;display:block"></div>` : ''}
      ${react ? `<div id="re${i}" style="display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:6px 16px;border-radius:12px;background:#3B3F8F;border:2px solid ${BLURPLE};font-family:Poppins;font-weight:700;font-size:28px;color:#fff;opacity:0">${react[0]} <span id="rn${i}">${react[1]}</span></div>` : ''}
    </div></div>`;
}).join('');
// Bouncing typing dots under the last message.
const typing = `<div id="typing" class="abs" style="left:${X0 + 36}px;top:${BOTTOM + 40}px;display:flex;align-items:center;gap:14px;z-index:6;opacity:0">
  <div style="display:flex;gap:8px">${[0, 1, 2].map((i) => `<span id="dot${i}" style="width:16px;height:16px;border-radius:50%;background:#B5BAC1;display:block"></span>`).join('')}</div>
  <span style="font-family:Poppins;font-size:26px;color:#B5BAC1"><b style="color:${GAMES.yugioh[1]}">duelliste_kc</b> est en train d’écrire…</span></div>`;
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const COLORS = ['#FF4FA0', '#8B3DFF', '#3AA9FF', SUN, DONE, INK, BLURPLE];
const BITS = Array.from({ length: 40 }, (_, i) => { const a = rnd() * Math.PI * 2, v = 800 + rnd() * 1100; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 500, w: 16 + rnd() * 14, spin: (rnd() - .5) * 1400, c: COLORS[i % COLORS.length], round: rnd() < .3 }; });
reel(`${ghosts([[50, 160, 90, -8], [940, 190, 80, 6], [60, 1770, 90, 10], [910, 1780, 100, -6]])}
  ${reelPath('M-20 1840 C160 1790 300 1900 520 1850 S860 1770 1100 1820')}
  <!-- 1. The logo pops in a burst -->
  <div class="abs lab" ${A(.2, T1 - .3, 0, 'fade')} style="left:0;top:300px;width:1080px;text-align:center;font-size:30px;letter-spacing:8px;color:${VSOFT}">LA COMMU BOOSTZ</div>
  <div class="abs h" ${A(.35, T1 - .3, 0, 'rise')} style="left:0;top:370px;width:1080px;text-align:center;font-size:112px">Rejoins-nous<br><span style="color:${BLURPLE}">sur Discord.</span></div>
  ${BITS.map((b, i) => `<div id="bit${i}" class="abs" style="width:${b.w}px;height:${b.round ? b.w : b.w * 1.6}px;border-radius:${b.round ? '50%' : '5px'};background:${b.c};border:3px solid ${SHADOW};opacity:0;z-index:4"></div>`).join('')}
  <div id="logo" class="abs" style="left:340px;top:740px;width:400px;height:400px;border-radius:96px;background:${BLURPLE};border:8px solid ${INK};box-shadow:16px 16px 0 ${SHADOW};display:flex;align-items:center;justify-content:center;z-index:6"><img src="assets/logo-discord.svg" style="width:64%;height:64%"></div>
  <div class="abs ui" ${A(2.0, T1 - .3, 0, 'rise')} style="left:0;top:1230px;width:1080px;text-align:center;font-size:44px;color:${VSOFT}">Les collectionneurs des 8 TCG.</div>
  <!-- 2. The chat comes alive -->
  <div class="abs" ${A(T1, T2, -1, 'stick')} style="left:${X0}px;top:${PT}px;width:${W}px;height:${PH}px;border-radius:40px;background:#313338;overflow:hidden;border:8px solid ${INK};box-shadow:16px 16px 0 ${SHADOW};z-index:5"></div>
  <div class="abs" ${A(T1, T2, 0, 'fade')} style="left:${X0 + 8}px;top:${PT + 8}px;width:${W - 16}px;height:90px;border-bottom:3px solid #1E1F22;display:flex;align-items:center;gap:16px;padding-left:30px;box-sizing:border-box;z-index:6"><span style="font-family:Poppins;font-weight:700;font-size:40px;color:#80848E">#</span><span class="ui" style="font-size:32px;color:#F2F3F5">la-commu</span><span style="margin-left:auto;margin-right:30px;display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:600;font-size:24px;color:#B5BAC1"><span style="width:16px;height:16px;border-radius:50%;background:${DONE};display:block"></span>en ligne</span></div>
  ${msgs}${typing}
  <div class="abs mut" ${A(T1 + .4, T2, 0, 'fade')} style="left:0;top:${PT + PH + 34}px;width:1080px;text-align:center;font-family:Exo;font-weight:600;font-size:24px">Exemple de conversation. Cartes : © The Pokémon Company, Disney.</div>
  <!-- 3. The 8 games -->
  <div class="abs h" ${A(T2, T3, 0, 'rise')} style="left:0;top:420px;width:1080px;text-align:center;font-size:96px">8 jeux,<br><span style="color:${BLURPLE}">un seul serveur.</span></div>
  ${ALL8.map((g, i) => `<div class="abs" ${A(T2 + .3 + i * .12, T3, (i % 2 ? 6 : -6))} style="left:${95 + (i % 4) * 230}px;top:${760 + Math.floor(i / 4) * 230}px;z-index:6">${emblemDisc(g, 170)}</div>`).join('')}
  <!-- 4. The invite -->
  <div class="abs" ${A(T3, null, 0, 'rise')} style="left:0;top:380px;width:1080px;display:flex;justify-content:center;z-index:5">${wordmark(120)}</div>
  <div class="abs h" ${A(T3 + .2, null, 0, 'rise')} style="left:0;top:560px;width:1080px;text-align:center;font-size:84px">Le serveur<br><span style="color:${BLURPLE}">est ouvert.</span></div>
  <div id="inv" class="abs" ${A(T3 + .5, null, -2)} style="left:110px;top:860px;width:860px;height:170px;z-index:7">${st(0, 0, 860, 170, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:72px;color:${DARK};white-space:nowrap">${LINK}</div>`, { fill: SUN })}</div>
  <div class="abs ui" ${A(T3 + .8, null, 0, 'rise')} style="left:0;top:1080px;width:1080px;text-align:center;font-size:40px;color:${VSOFT}">Lien en bio 👆</div>
  <div class="abs mut" ${A(T3 + 1, null, 0, 'fade')} style="left:0;top:1170px;width:1080px;text-align:center;font-weight:600;font-size:36px">${TAGLINE()}</div>`, END);
const base = window.render, cl = (x) => Math.max(0, Math.min(1, x)), ease = (x) => 1 - Math.pow(1 - cl(x), 3);
const pop = (x) => { x = cl(x); const c1 = 2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
window.render = (t) => {
  base(t);
  // The logo pops with a squash, wobbles, then leaves with the intro.
  // Already on screen from the hook: it only bounces when the confetti burst.
  const lg = document.getElementById('logo'), k = cl((t - .5) / .8), p = 1 + .14 * Math.sin(k * Math.PI * 2.5) * (1 - k), sq = 1 + .12 * Math.sin(k * Math.PI * 3) * (1 - k);
  const out = ease((t - T1 + .35) / .3);
  lg.style.opacity = 1 - out;
  lg.style.transform = `scale(${p * sq * (1 - .3 * out)}, ${p / sq * (1 - .3 * out)}) rotate(${-3 + 4 * Math.sin(t * 3) * (1 - cl(t / 2))}deg)`;
  BITS.forEach((b, i) => {
    const s = t - .7, el = document.getElementById('bit' + i);
    if (s < 0 || s > 1.4) { el.style.opacity = 0; return; }
    const x = 540 + b.vx * s * Math.exp(-s * 1.6), yy = 940 + b.vy * s * Math.exp(-s * 1.6) + 900 * s * s;
    el.style.opacity = 1 - cl((s - .9) / .4);
    el.style.transform = `translate(${x - b.w / 2}px, ${yy}px) rotate(${b.spin * s}deg)`;
  });
  // Reactions appear, then their counters climb.
  MSGS.forEach(([, , , , react, at], i) => {
    if (!react) return;
    const k = cl((t - at - .9) / 1.4), el = document.getElementById('re' + i);
    el.style.opacity = t > T2 ? 0 : cl((t - at - .8) / .2);
    el.style.transform = `scale(${pop((t - at - .8) / .35)})`;
    document.getElementById('rn' + i).textContent = Math.round(react[1] + (react[2] - react[1]) * ease(k));
  });
  // The chat scrolls like Discord: each new message lands at the bottom and pushes the others up.
  let bottom = BOTTOM - 10;
  const shown = MSGS.map(([, , , , , at], i) => [i, at]).filter(([, at]) => t >= at - .05).reverse();
  if (t > T1 + 6.6 && t < T2) bottom -= 60;
  for (const [i, at] of shown) {
    const el = document.getElementById('m' + i), h = el.offsetHeight + 34;
    const arrive = ease((t - at) / .45);
    bottom -= h * arrive;
    el.style.top = bottom + 'px';
    const hidden = PT + 110 - bottom;
    el.style.clipPath = hidden > 0 ? 'inset(' + hidden + 'px 0 0 0)' : 'none';
    if (hidden > h - 20) el.style.opacity = 0;
  }
  // Typing dots after the last message.
  const ty = document.getElementById('typing');
  ty.style.opacity = t > T1 + 6.6 && t < T2 - .2 ? 1 : 0;
  ty.style.top = (BOTTOM - 40) + 'px';
  [0, 1, 2].forEach((i) => { document.getElementById('dot' + i).style.transform = `translateY(${-Math.max(0, Math.sin(t * 7 - i * .9)) * 10}px)`; });
  // The invite pulses gently.
  if (t > T3 + 1) document.getElementById('inv').style.transform += ` scale(${1 + .03 * Math.sin((t - T3) * 4)})`;
};
window.render(0);
</script></body></html>
