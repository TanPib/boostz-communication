<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz mythe ou realite</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  /* "Mythe ou réalité": one claim, the sourced facts, the verdict. Same sticker
     language as the card analysis: flat table, white outlines, hard shadows,
     a dashed path that runs on from one slide to the next. */
  .p { position: relative; overflow: hidden; width: 1080px; height: 1350px; margin-bottom: 20px; color: #F5F2FB; font-family: Exo; background: #131020; }
  .abs { position: absolute; }
  .h { font-family: Outfit; font-weight: 800; line-height: 1.02; letter-spacing: -1px; }
  .ui { font-family: Poppins; font-weight: 700; }
  .lab { font-family: 'DM Sans'; font-weight: 700; letter-spacing: 4px; }
  .mut { color: #A8A2B8; }
  .acc { color: #C4B5FD; }
  .word { font-family: Outfit; font-weight: 800; line-height: 1; }
  .grad { background: linear-gradient(135deg, #FF4FA0 0%, #8B3DFF 55%, #3AA9FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .st { position: absolute; background: #1D1730; border: 6px solid #F5F2FB; border-radius: 36px; box-shadow: 12px 12px 0 #05040A; }
  .src { position: absolute; left: 70px; right: 70px; bottom: 34px; font-family: Exo; font-size: 20px; line-height: 1.35; color: rgba(255,255,255,.42); }
</style></head><body>
<script>
const SHADOW = '#05040A', VSOFT = '#C4B5FD', DARK = '#1A1424', DONE = '#5FD3A3', SUN = '#FCD34D', VIOLET = '#7C3AED', PINK = '#F0899A', WOW = '#58A6DD';
const emblemSvg = (id, c, size) => `<svg width="${size}" height="${size}" viewBox="0 0 48 48">${EMBLEMS[id].replace(/COLOR/g, c)}</svg>`;
const wordmark = (size) => `<div style="display:flex;align-items:baseline;transform:skewX(-8deg)"><span class="word" style="font-size:${size}px;color:#fff">boost</span><span style="position:relative;display:inline-block">`
  + [['#3AA9FF', -0.59, .12], ['#8B3DFF', -0.39, .2], ['#FF4FA0', -0.185, .3]].map(([c, l, o]) => `<span class="word" style="font-size:${size}px;position:absolute;top:0;left:${l * size}px;color:${c};opacity:${o}">Z</span>`).join('')
  + `<span class="word grad" style="font-size:${size}px;position:relative;color:transparent">Z</span></span></div>`;
const st = (x, y, w, h, inner, o = {}) => `<div class="st" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${o.fill ? 'background:' + o.fill + ';' : ''}transform:rotate(${o.r || 0}deg);${o.z ? 'z-index:' + o.z + ';' : ''}">${inner}</div>`;
const disc = (x, y, d, fill, inner, r = 0) => `<div class="abs" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;background:${fill};border:6px solid #F5F2FB;box-shadow:12px 12px 0 ${SHADOW};display:flex;align-items:center;justify-content:center;transform:rotate(${r}deg);z-index:4">${inner}</div>`;
const ghosts = (list) => list.map(([x, y, w, r]) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;border:4px solid rgba(255,255,255,.14);border-radius:${w * .16}px;transform:rotate(${r}deg)"><div style="width:60%;height:6px;margin:${w * .1}px auto 0;border-radius:3px;background:rgba(255,255,255,.14)"></div></div>`).join('');
const TRACK = 'M-20 760 C200 700 300 820 540 780 S900 640 1080 700 S1400 860 1620 800 S1980 600 2160 680 S2500 900 2700 820 S3060 640 3240 720 S3600 880 3780 820 S4140 640 4320 700 S4700 860 4900 800 S5300 700 5420 740';
const track = (k) => `<svg class="abs" width="1080" height="1350" viewBox="${k * 1080} 0 1080 1350" style="left:0;top:0"><path d="${TRACK}" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/></svg>`;
const head = (kicker) => `<div class="abs lab" style="left:70px;top:66px;font-size:24px;letter-spacing:6px;color:${VSOFT}">${kicker}</div>
  <div class="abs" style="right:70px;top:46px;display:flex;align-items:center;gap:20px;z-index:5"><div style="text-align:right"><div class="lab" style="font-size:21px;letter-spacing:5px;color:${WOW}">WARCRAFT</div><div style="font-weight:600;font-size:24px;color:rgba(245,242,251,.75);margin-top:2px">TCG World of Warcraft</div></div>
  <div style="width:76px;height:76px;border-radius:50%;background:${WOW};border:5px solid #F5F2FB;box-shadow:8px 8px 0 ${SHADOW};display:flex;align-items:center;justify-content:center">${emblemSvg('wow', DARK, 44)}</div></div>`;

// A loot card, redrawn (not the official art): a spectral blue field with tiger
// stripes, and the scratch-off code strip at the bottom, intact or scratched.
const lootCard = (x, y, w, r = 0, scratched = false, z = 2) => {
  const art = `<svg width="100%" height="100%" viewBox="0 0 100 70" preserveAspectRatio="none"><defs><radialGradient id="sg${x}${y}" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#E4F8FF"/><stop offset=".35" stop-color="#7FD3F5"/><stop offset=".75" stop-color="#2F6FC0"/><stop offset="1" stop-color="#1A2D63"/></radialGradient></defs>
    <rect width="100" height="70" fill="url(#sg${x}${y})"/>
    ${[['M8 10 C22 18 20 30 34 34', 3.2], ['M14 52 C26 44 30 56 44 50', 2.6], ['M60 8 C70 20 66 28 82 30', 3], ['M58 58 C70 48 78 60 94 52', 2.8], ['M40 18 C46 24 54 22 60 28', 2], ['M4 34 C12 36 14 44 24 44', 2]].map(([d, sw]) => `<path d="${d}" fill="none" stroke="#0E1A3D" stroke-opacity=".55" stroke-width="${sw}" stroke-linecap="round"/>`).join('')}
  </svg>`;
  const strip = scratched
    ? `<div style="height:100%;border-radius:${w * .03}px;background:#2A2140;display:flex;align-items:center;justify-content:center;font-family:'DM Sans';font-weight:700;letter-spacing:${w * .008}px;font-size:${w * .07}px;color:#F5F2FB">••••-••••-••••</div>`
    : `<div style="height:100%;border-radius:${w * .03}px;background:linear-gradient(135deg,#D9DCE3,#9EA4B0 45%,#E8EAEE 60%,#A7ADB8);display:flex;align-items:center;justify-content:center;font-family:'DM Sans';font-weight:700;letter-spacing:${w * .01}px;font-size:${w * .055}px;color:#5B6070">CODE À GRATTER</div>`;
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;transform:rotate(${r}deg);border:8px solid #F5F2FB;border-radius:${w * .06}px;overflow:hidden;box-shadow:16px 16px 0 ${SHADOW};z-index:${z};background:#1B2440;padding:${w * .06}px">
    <div style="display:flex;justify-content:space-between;align-items:center;height:${w * .1}px"><div style="width:58%;height:${w * .045}px;border-radius:9px;background:#5D6A8F"></div><div class="lab" style="font-size:${w * .05}px;letter-spacing:${w * .006}px;color:${SUN}">LOOT</div></div>
    <div style="height:${w * .74}px;margin-top:${w * .03}px;border-radius:${w * .04}px;overflow:hidden">${art}</div>
    <div style="height:${w * .035}px;width:82%;margin-top:${w * .05}px;border-radius:9px;background:#4A5578"></div>
    <div style="height:${w * .035}px;width:60%;margin-top:${w * .03}px;border-radius:9px;background:#4A5578"></div>
    <div style="height:${w * .16}px;margin-top:${w * .055}px">${strip}</div></div>`;
};

// Figures, each from a public record (searched 05/10/2026):
// - Heritage Auctions: Spectral Tiger #3 Fires of Outland loot, PSA NM-MT 8, sold 5,250 $ on 21/03/2025.
// - PSA Auction Prices Realized, "Spectral Tiger outland loot scratched": PSA 9 sold 108.50 $ on 11/11/2025.
// - Pull rate 1 in 484 packs: Heritage Auctions lot description (BGS 8.5 lot of 24/07/2021) and wowlootcards.com.
// - Game dates: Wikipedia, "World of Warcraft Trading Card Game". Mounts: warcraft.wiki.gg.
const INTACT = 5250, GRATTEE = 108.5;
const FACTOR = Math.round(INTACT / GRATTEE);
const usd = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ',')).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' $';
const SRC_JEU = 'Wikipedia, « World of Warcraft Trading Card Game » : sortie le 25/10/2006, arrêt annoncé par Blizzard le 23/08/2013.';
const SRC_TIGRE = 'Taux de tirage : fiche du lot Heritage Auctions du 24/07/2021, wowlootcards.com. Montures : warcraft.wiki.gg. Carte redessinée, pas l’illustration officielle.';
const SRC_PRIX = `Code intact : Heritage Auctions, PSA 8, vendue le 21/03/2025. Code gratté : PSA Auction Prices Realized, PSA 9, vendue le 11/11/2025. Prix en dollars, relevés le 05/10/2026.`;
const POSTS = [];

// 1 - The claim.
POSTS.push(['m1-affirmation', `${ghosts([[80, 300, 80, -6], [930, 400, 80, 8]])}${track(0)}${head('MYTHE OU RÉALITÉ ?')}
  ${lootCard(370, 170, 340, -4)}
  ${disc(700, 210, 190, VIOLET, `<div class="h" style="font-size:130px;color:#fff;line-height:1">?</div>`, 8)}
  <div class="abs h" style="left:0;top:850px;width:1080px;text-align:center;font-size:80px">Une carte s’est vendue<br>${usd(INTACT)}…</div>
  <div class="abs h acc" style="left:0;top:1035px;width:1080px;text-align:center;font-size:64px">pour un tigre<br>qui n’existe pas.</div>
  <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div>
  <div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`]);

// 2 - The game, and its loot cards.
POSTS.push(['m2-le-jeu', `${ghosts([[900, 1040, 80, 6]])}${track(1)}${head('LE JEU')}
  <div class="abs h" style="left:70px;top:160px;font-size:96px">Le TCG<br><span class="acc">World of Warcraft</span></div>
  ${[['2006', 'Upper Deck<br>le lance', WOW, -3], ['2010', 'Cryptozoic<br>le reprend', '#F5F2FB', 2], ['2013', 'Blizzard<br>l’arrête', PINK, -2]].map(([y, k, c, r], i) => st(70 + i * 318, 410, 290, 215, `<div style="padding:24px 28px"><div class="h" style="font-size:72px;color:${c}">${y}</div><div class="ui mut" style="font-size:26px;font-weight:600;margin-top:6px;line-height:1.3">${k}</div></div>`, { r, z: 3 })).join('')}
  ${lootCard(90, 700, 280, -6)}
  ${st(420, 760, 590, 330, `<div style="padding:34px 40px;color:${DARK}"><div class="lab" style="font-size:22px">LES CARTES « LOOT »</div><div class="ui" style="font-size:40px;line-height:1.25;margin-top:12px">Un code à gratter, qui débloque un objet dans le jeu vidéo.</div></div>`, { fill: SUN, r: 2, z: 3 })}
  <div class="src">${SRC_JEU}</div>`]);

// 3 - The Spectral Tiger: 484 packs, one lit.
POSTS.push(['m3-le-tigre', `${track(2)}${head('LE TIGRE SPECTRAL')}
  <div class="abs h" style="left:0;top:140px;width:1080px;text-align:center;font-size:112px">1 booster<br><span class="acc">sur 484.</span></div>
  <div class="abs mut" style="left:0;top:395px;width:1080px;text-align:center;font-weight:600;font-size:34px">C’est la carte loot la plus rare de Fires of Outland (2007).</div>
  <div class="abs" style="left:212px;top:462px;width:656px;padding:20px;background:#131020;border-radius:24px;display:grid;grid-template-columns:repeat(22,1fr);gap:6px;z-index:2">${Array.from({ length: 484 }, (_, i) => `<div style="height:19px;border-radius:5px;${i === 301 ? `background:${WOW};outline:4px solid #F5F2FB;box-shadow:6px 6px 0 ${SHADOW};transform:scale(1.5);z-index:3;position:relative` : 'background:rgba(196,181,253,.16)'}"></div>`).join('')}</div>
  ${st(70, 1085, 940, 130, `<div class="ui" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:36px;text-align:center;line-height:1.2">Son code donne deux montures dans le jeu :<br>le tigre spectral, et sa version rapide.</div>`, { r: -1, z: 3 })}
  <div class="src">${SRC_TIGRE}</div>`]);

// 4 - What it sells for: intact against scratched.
POSTS.push(['m4-ce-quelle-vaut', `${ghosts([[920, 1100, 80, 6]])}${track(3)}${head('CE QU’ELLE VAUT')}
  ${lootCard(110, 170, 300, -5)}
  ${lootCard(640, 170, 300, 5, true)}
  ${st(70, 650, 450, 250, `<div style="padding:28px 34px;color:${DARK}"><div class="lab" style="font-size:21px;letter-spacing:2px">CODE INTACT · PSA 8</div><div class="h" style="font-size:88px;margin-top:6px;white-space:nowrap">${usd(INTACT)}</div><div class="ui" style="font-weight:600;font-size:24px">Heritage Auctions, 21/03/2025</div></div>`, { fill: DONE, r: -2, z: 3 })}
  ${st(560, 650, 450, 250, `<div style="padding:28px 34px;color:${DARK}"><div class="lab" style="font-size:21px;letter-spacing:2px">CODE GRATTÉ · PSA 9</div><div class="h" style="font-size:88px;margin-top:6px;white-space:nowrap">${usd(GRATTEE)}</div><div class="ui" style="font-weight:600;font-size:24px">vente du 11/11/2025</div></div>`, { fill: PINK, r: 2, z: 3 })}
  ${disc(440, 330, 200, SUN, `<div style="text-align:center;color:${DARK}"><div class="h" style="font-size:84px;line-height:1">÷${FACTOR}</div><div class="ui" style="font-size:22px;margin-top:4px">une fois<br>grattée</div></div>`, -6)}
  <div class="abs" style="left:110px;top:980px;width:860px;text-align:center;font-weight:600;font-size:38px;line-height:1.4;color:rgba(245,242,251,.85)">Mieux notée, mais grattée :<br><b class="ui" style="color:#fff">elle vaut ${FACTOR} fois moins.</b><br>Ce qui se paie, c’est le code.</div>
  <div class="src">${SRC_PRIX}</div>`]);

// 5 - The verdict.
POSTS.push(['m5-verdict', `${ghosts([[90, 300, 80, -6], [950, 230, 80, 8], [110, 1120, 70, 4], [920, 1080, 80, -6]])}${track(4)}${head('LE VERDICT')}
  <div class="abs h" style="left:0;top:170px;width:1080px;text-align:center;font-size:150px;color:${DONE}">Réalité.</div>
  <div class="abs" style="left:110px;top:360px;width:860px;text-align:center;font-weight:600;font-size:40px;line-height:1.35;color:rgba(245,242,251,.85)">${usd(INTACT)} pour un tigre qu’on ne voit<br>que dans le jeu vidéo…<br><b class="ui" style="color:#fff">tant que personne ne gratte le code.</b></div>
  ${st(120, 620, 840, 130, `<div class="ui" style="display:flex;align-items:center;justify-content:center;height:100%;text-align:center;font-size:36px;color:${DARK}">Warcraft fait partie des 8 TCG de Boostz.</div>`, { fill: SUN, r: -2, z: 3 })}
  <div class="abs" style="left:0;top:880px;width:1080px;display:flex;justify-content:center">${wordmark(100)}</div>
  <div class="abs mut" style="left:0;top:1015px;width:1080px;text-align:center;font-weight:600;font-size:38px">Ton compagnon TCG, bientôt sur ton téléphone</div>
  <div class="abs ui" style="left:0;top:1110px;width:1080px;text-align:center;font-size:34px;color:${VSOFT}">Abonne-toi pour ne rien manquer</div>`]);

document.body.innerHTML = POSTS.map(([id, html]) => `<div class="p" id="${id}">${html}</div>`).join('');
</script></body></html>
