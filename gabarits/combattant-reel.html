<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz choisis ton combattant</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131020; }
  .abs { position: absolute; }
  .h { font-family: Outfit; font-weight: 800; line-height: 1.02; letter-spacing: -1px; color: #F5F2FB; }
  .ui { font-family: Poppins; font-weight: 700; }
  .word { font-family: Outfit; font-weight: 800; line-height: 1; }
  .grad { background: linear-gradient(135deg, #FF4FA0 0%, #8B3DFF 55%, #3AA9FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .slot { position: absolute; width: 210px; }
  .back { width: 210px; height: 290px; border: 6px solid #F5F2FB; border-radius: 24px; overflow: hidden; }
  .back img { width: 100%; height: 100%; display: block; }
</style></head><body>
<div id="stage" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
<script>
// "Choisis ton combattant": a video-game character select, drawn in the
// onboarding's sticker style. The eight games' backs are the fighters; a
// cursor runs through them faster and faster, then leaves the choice to the
// viewer. Deterministic: window.render(t) draws the frame at t seconds.
const SHADOW = '#05040A', VSOFT = '#C4B5FD', DARK = '#1A1424', VIOLET = '#7C3AED', SUN = '#FCD34D';
const GAMES = [['pokemon', 'Pokémon', '#F5C93B'], ['onepiece', 'One Piece', '#F2706C'], ['lorcana', 'Lorcana', '#35C6BC'], ['yugioh', 'Yu-Gi-Oh!', '#B189E8'],
  ['magic', 'Magic', '#C0A183'], ['starwarsunlimited', 'Star Wars', '#A9B2C4'], ['dragonball', 'Dragon Ball', '#F58A4E'], ['wow', 'Warcraft', '#58A6DD']];
const emblemSvg = (id, c, size) => `<svg width="${size}" height="${size}" viewBox="0 0 48 48">${EMBLEMS[id].replace(/COLOR/g, c)}</svg>`;
const wordmark = (size) => `<div style="display:flex;align-items:baseline;transform:skewX(-8deg)"><span class="word" style="font-size:${size}px;color:#fff">boost</span><span style="position:relative;display:inline-block">`
  + [['#3AA9FF', -0.59, .12], ['#8B3DFF', -0.39, .2], ['#FF4FA0', -0.185, .3]].map(([c, l, o]) => `<span class="word" style="font-size:${size}px;position:absolute;top:0;left:${l * size}px;color:${c};opacity:${o}">Z</span>`).join('')
  + `<span class="word grad" style="font-size:${size}px;position:relative;color:transparent">Z</span></span></div>`;
const clamp = (x) => Math.max(0, Math.min(1, x));
const out3 = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const $ = (id) => document.getElementById(id);

// Grid: four by two, a name under each fighter.
const X0 = 75, GX = 240, Y = [480, 900];
const pos = (i) => [X0 + (i % 4) * GX, Y[Math.floor(i / 4)]];
// The cursor's tour: slow, fast, then slowing down... and it never picks.
const STOPS = [];
let tt = 1.1;
[[8, .42], [8, .22], [4, .3], [3, .42], [2, .6]].forEach(([n, d]) => { for (let k = 0; k < n; k++) { STOPS.push(tt); tt += d; } });
const TOUR_END = tt;
const ASK = TOUR_END + .25;
window.TOTAL = ASK + 5.6;
const ORDER = [0, 1, 2, 3, 7, 6, 5, 4];   // round the grid, like a joystick would

$('stage').innerHTML = `
  <div id="ghosts">${[[60, 160, 90, -8], [920, 300, 80, 6], [80, 1700, 100, 10], [880, 1760, 110, -6]].map(([x, y, w, r], i) => `<div id="g${i}" class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;border:4px solid rgba(255,255,255,.14);border-radius:${w * .16}px;transform:rotate(${r}deg)"><div style="width:60%;height:6px;margin:${w * .1}px auto 0;border-radius:3px;background:rgba(255,255,255,.14)"></div></div>`).join('')}</div>
  <svg class="abs" width="1080" height="1920" style="left:0;top:0"><defs><clipPath id="draw"><rect id="drawRect" x="0" y="0" width="0" height="1920"/></clipPath></defs>
    <path clip-path="url(#draw)" d="M-20 1720 C160 1660 300 1800 520 1740 S860 1640 1100 1710" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/></svg>
  <div id="title" class="abs h" style="left:0;top:150px;width:1080px;text-align:center;font-size:118px">Choisis ton<br><span style="color:${VSOFT}">combattant.</span></div>
  ${GAMES.map(([g, name, c], i) => { const [x, y] = pos(i); return `<div id="s${i}" class="slot" style="left:${x}px;top:${y}px;z-index:2">
    <div id="b${i}" class="back"><img src="assets/dos-${g}.svg"></div>
    <div id="e${i}" class="abs" style="left:65px;top:-58px;width:80px;height:80px;border-radius:50%;background:${c};border:5px solid #F5F2FB;box-shadow:8px 8px 0 ${SHADOW};display:flex;align-items:center;justify-content:center;opacity:0">${emblemSvg(g, DARK, 46)}</div>
    <div class="ui" style="margin-top:22px;text-align:center;font-size:30px;color:#F5F2FB;white-space:nowrap">${name}</div></div>`; }).join('')}
  <div id="cur" class="abs" style="left:0;top:0;width:250px;height:330px;border:10px solid ${VSOFT};border-radius:34px;opacity:0;z-index:1">
    <div class="ui" style="position:absolute;left:-18px;top:-30px;background:${VIOLET};color:#fff;border:5px solid #F5F2FB;border-radius:16px;padding:2px 14px;font-size:28px;box-shadow:6px 6px 0 ${SHADOW}">P1</div></div>
  <div id="ask" class="abs" style="left:110px;top:1330px;width:860px;height:200px;border-radius:40px;background:${SUN};border:7px solid #F5F2FB;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;z-index:6">
    <div class="h" style="font-size:84px;color:${DARK}">Tu joues lequel ?</div></div>
  <div id="sub" class="abs" style="left:0;top:1575px;width:1080px;text-align:center;font-family:Exo;font-weight:600;font-size:42px;color:#A8A2B8;opacity:0">Un seul choix. Réponds en commentaire ⬇️</div>
  <div id="mark" class="abs" style="left:0;top:80px;width:1080px;display:flex;justify-content:center;opacity:0">${wordmark(64)}</div>`;

window.render = (t) => {
  [0, 1, 2, 3].forEach((i) => { $('g' + i).style.transform = `translateX(${t * (5 + i)}px) rotate(${[-8, 6, 10, -6][i] + Math.sin(t / 2 + i) * 3}deg)`; });
  $('drawRect').setAttribute('width', 1100 * out3(t / 2.4));
  const tp = out3(t / .45);
  $('title').style.opacity = tp; $('title').style.transform = `translateY(${30 * (1 - tp)}px)`;
  // Which fighter the cursor is on.
  const k = STOPS.reduce((a, s, i) => (t >= s ? i : a), -1);
  const on = k >= 0 && t < TOUR_END ? ORDER[k % 8] : -1;
  GAMES.forEach((_, i) => {
    // The fighters slap in one by one, then the hovered one steps forward.
    const p = clamp((t - .25 - i * .08) / .3);
    const el = $('s' + i);
    el.style.opacity = clamp(p / .2);
    const hov = i === on ? 1 : 0;
    // Once the question is asked, every fighter bounces in turn: all of them are a valid answer.
    const wave = clamp((t - ASK - .5 - ORDER.indexOf(i) * .09) / .35);
    const hop = Math.sin(Math.PI * wave) * 26;
    el.style.transform = `translateY(${-50 * (1 - out3(p)) - 16 * hov - hop}px) rotate(${10 * (1 - out3(p))}deg) scale(${1.3 - .3 * back(p)})`;
    const sh = (p >= 1 ? 12 : 0) + 8 * hov;
    $('b' + i).style.boxShadow = `${sh}px ${sh}px 0 ${SHADOW}`;
    const ep = i === on ? clamp((t - STOPS[k]) / .15) : (wave > 0 && wave < 1 ? Math.sin(Math.PI * wave) : 0);
    $('e' + i).style.opacity = ep; $('e' + i).style.transform = `scale(${.6 + .4 * back(ep)})`;
  });
  // The cursor snaps from fighter to fighter, then lets go.
  if (on >= 0) {
    const [x, y] = pos(on), sp = clamp((t - STOPS[k]) / .12);
    $('cur').style.opacity = 1;
    $('cur').style.left = (x - 20) + 'px'; $('cur').style.top = (y - 20 - 16) + 'px';
    $('cur').style.transform = `scale(${1.08 - .08 * out3(sp)})`;
  } else $('cur').style.opacity = 0;
  const ap = clamp((t - ASK) / .32);
  $('ask').style.opacity = clamp(ap / .2);
  $('ask').style.transform = `translateY(${-50 * (1 - out3(ap))}px) rotate(${-2 + 10 * (1 - out3(ap))}deg) scale(${1.3 - .3 * back(ap)})`;
  const ash = 14 * out3((ap - .55) / .45); $('ask').style.boxShadow = `${ash}px ${ash}px 0 ${SHADOW}`;
  const sp2 = out3((t - ASK - .6) / .4); $('sub').style.opacity = sp2; $('sub').style.transform = `translateY(${24 * (1 - sp2)}px)`;
  // The title gives way to the wordmark at the very end.
  const mp = out3((t - window.TOTAL + 1.6) / .5);
  $('mark').style.opacity = mp;
  $('title').style.opacity = tp * (1 - mp);
};
window.render(0);
</script></body></html>
