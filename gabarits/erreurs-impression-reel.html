<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz erreurs d'impression</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Erreurs d'impression: three misprints and what they sold for. The errors are
// photographed: the real cards, as their sellers and the press showed them.
// Sales searched on 06/10/2026:
// - Growlithe (Caninos) German Base Set with a Magic back, CGC 8: 26,400 $,
//   Heritage Auctions, 05/04/2021 (CGC); 10 Magic-back Pokémon cards are known.
// - Lorcana "Discard" sheet filler printed as Enchanted, PSA 10: 40,000 $ on eBay, 03/07/2024 (Screen Rant).
// - Blastoise (Tortank) 1998 test print with a Magic back, CGC 6.5: 216,000 $,
//   Heritage Auctions, 07/11/2021 (CGC, Hypebeast).
const T0 = 2.8, STEP = 3.6;
const discard = (x, y, w, r, attrs) => `<div ${attrs} class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;transform:rotate(${r}deg);border:8px solid ${INK};border-radius:${w * .06}px;box-shadow:16px 16px 0 ${SHADOW};z-index:3;background:linear-gradient(135deg,#0B0812,#1B1330 55%,#0B0812);display:flex;align-items:center;justify-content:center;overflow:hidden">
  <div style="position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,79,160,.25) 42%,rgba(58,169,255,.25) 52%,rgba(95,211,163,.2) 60%,transparent 72%)"></div>
  <div style="font-family:Sora;font-weight:600;font-size:${w * .13}px;color:#E9E4F5;letter-spacing:2px;position:relative">Discard</div></div>`;
const ERRORS = [
  { game: 'pokemon', visual: (a) => card('assets/erreur-caninos-dos-magic-cgc8.jpg', 330, 330, 420, -4, 3, { h: 710, attrs: a }), r: -4, title: 'Un Caninos<br>avec un dos Magic', detail: 'Pokémon · Set de base allemand · CGC 8', price: usd(26400), src: 'Heritage Auctions, vente du 05/04/2021. Photo : CGC.<br>On ne connaît que 10 cartes Pokémon à dos Magic.' },
  { game: 'lorcana', visual: (a) => card('assets/erreur-discard-enchantee-psa10.jpg', 330, 330, 420, 3, 3, { h: 720, attrs: a }), r: 3, title: 'Une carte « Discard »<br>imprimée en enchantée', detail: 'Lorcana · carte de remplissage d’usine · PSA 10', price: usd(40000), src: 'Vente eBay du 03/07/2024, rapportée par Screen Rant.<br>Photo de la carte : Screen Rant.' },
  { game: 'pokemon', visual: (a) => card('assets/erreur-tortank-dos-magic-cgc65.jpg', 330, 330, 420, 4, 3, { h: 707, attrs: a }), r: 4, title: 'Un Tortank<br>avec un dos Magic', detail: 'Pokémon · carte test de 1998 · CGC 6,5', price: usd(216000), src: 'Heritage Auctions, vente du 07/11/2021 (CGC, Hypebeast).<br>Photo d’un exemplaire CGC 6,5 : Fanatics Collect.' },
];
const scene = (e, i) => {
  const at = T0 + i * STEP, out = at + STEP - .3;
  return `${e.visual(A(at, out, e.r))}
  <div class="abs" ${A(at + .4, out, 0, 'rise')} style="left:0;top:1100px;width:1080px;text-align:center;z-index:5">
    <div class="h" style="font-size:66px">${e.title}</div>
    <div class="mut" style="font-weight:600;font-size:30px;margin-top:14px">${e.detail}</div></div>
  ${st(290, 1400, 500, 150, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:84px;color:${DARK}">${e.price}</div>`, { fill: [SUN, GAMES.lorcana[1], DONE][i], r: -e.r, z: 6, attrs: A(at + 1, out, -e.r) })}
  <div class="abs" ${A(at + 1.3, out, 0, 'fade')} style="left:70px;right:70px;top:1590px;text-align:center;font-family:Exo;font-size:26px;color:rgba(255,255,255,.5)">${e.src}</div>`;
};
const END = T0 + ERRORS.length * STEP;
reel(`${ghosts([[930, 330, 80, 6], [40, 1240, 80, -8], [70, 1760, 90, 10], [900, 1780, 100, -6]])}
  ${reelPath('M-20 1800 C160 1750 300 1870 520 1820 S860 1740 1100 1790')}
  <div class="abs lab" ${A(.2, T0 - .3, 0, 'rise')} style="left:0;top:520px;width:1080px;text-align:center;font-size:28px;letter-spacing:8px;color:${VSOFT}">ERREURS D’IMPRESSION</div>
  <div class="abs h" ${A(.4, T0 - .3, 0, 'rise')} style="left:0;top:600px;width:1080px;text-align:center;font-size:110px">Une erreur<br>d’usine…</div>
  <div class="abs h acc" ${A(1.2, T0 - .3, 0, 'rise')} style="left:0;top:880px;width:1080px;text-align:center;font-size:78px">qui vaut<br>une fortune.</div>
  ${ERRORS.map(scene).join('')}
  <div class="abs h" ${A(END, null, 0, 'rise')} style="left:0;top:470px;width:1080px;text-align:center;font-size:86px">Regarde bien<br><span class="acc">tes cartes.</span></div>
  <div class="abs" ${A(END + .5, null, 0, 'rise')} style="left:0;top:820px;width:1080px;display:flex;flex-direction:column;align-items:center;gap:26px">${wordmark(110)}
    <div class="mut" style="font-weight:600;font-size:38px">Ton compagnon TCG, disponible sur ton téléphone</div>
    <div class="ui" style="font-size:36px;color:${VSOFT}">Télécharge Boostz, lien en bio</div></div>`, END + 3.2);
</script></body></html>
