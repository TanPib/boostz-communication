<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz produits scelles</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// "Les produits scellés, expliqués": one carousel per game we cover (asked on
// 07/10/2026), each sealed format with its real photo, what it holds and, when
// a shop shows one, its price on the day. Render one game with:
//   node rendu.mjs produits-scelles.html#<game> images
const game = location.hash.slice(1) || 'pokemon';
// Per game: cover line, the formats [file, name, other name, contents, price, source], the credit line.
const GUIDES = {
  pokemon: {
    sub: 'Le guide des produits scellés',
    cover: ['item-pk-booster.png', 'item-pk-etb.jpg', 'item-pk-upc.jpg'],
    items: [
      ['item-pk-booster.png', 'Le booster', 'Booster pack', '10 cartes d’une extension.<br>La base de tout.', ['Booster Méga-Évolution', 7.42], 'investcollect.com, blazingtail.fr'],
      ['item-pk-checklane.png', 'Le blister', 'Booster carton · checklane', '1 booster sous blister cartonné,<br>avec une carte promo et une pièce.', null, 'pokepedia.fr (checklane blister Méga-Évolution)'],
      ['item-pk-duopack.png', 'Le duopack', '2-pack blister', '2 boosters, 3 cartes brillantes<br>et une pièce.', null, 'investcollect.com'],
      ['item-pk-tripack.jpg', 'Le tripack', '3-pack blister', '3 boosters, une carte promo<br>exclusive et un jeton.', ['Tripack Méga-Évolution', 19.92], 'blazingtail.fr'],
      ['item-pk-etb.jpg', 'L’ETB', 'Coffret Dresseur d’élite', '9 boosters, 65 protège-cartes,<br>45 Énergies et une boîte de rangement.', null, 'pokepedia.fr (ETB Méga-Évolution)'],
      ['item-pk-display.jpg', 'Le display', 'Booster box · demi-display', '36 boosters scellés.<br>Le demi-display en a 18.', ['Display Méga-Évolution', 241.58], 'blazingtail.fr, chocobonplan.com'],
      ['item-pk-upc.jpg', 'L’UPC', 'Collection Ultra-Premium', '18 boosters, 2 cartes promo,<br>un tapis de jeu et une pièce en métal.', null, 'pokepedia.fr (UPC Méga-Dracaufeu X-ex)'],
      ['item-pk-academie.jpg', 'Pour s’initier', 'Académie de Combat', '3 decks de 60 cartes prêts à jouer,<br>un plateau et des guides.', null, 'play-in.com'],
    ],
    credit: '© Pokémon / Nintendo / Creatures / GAME FREAK. Photos des produits : boutiques citées.',
  },
};
const g = GUIDES[game];
const N = g.items.length;
const photo = (img, x, y, s, r, z = 3) => `<div class="abs" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${r}deg);background:#fff;border:8px solid ${INK};border-radius:40px;box-shadow:16px 16px 0 ${SHADOW};overflow:hidden;z-index:${z}"><img src="assets/${img}" style="width:100%;height:100%;object-fit:contain;padding:22px;box-sizing:border-box;display:block"></div>`;
const C = GAMES[game][1];
carousel([
  ['1-couverture', `${ghosts([[70, 1080, 80, -6], [930, 1060, 70, 8]])}${track(0, 1180, .4)}${head('LE GUIDE', game, 'Les produits scellés')}
    ${photo(g.cover[0], 90, 230, 300, -6, 3)}${photo(g.cover[1], 390, 190, 300, 2, 4)}${photo(g.cover[2], 690, 240, 300, 6, 3)}
    <div class="abs h" style="left:0;top:640px;width:1080px;text-align:center;font-size:98px">Booster, ETB, UPC…<br><span class="acc">tu t’y retrouves ?</span></div>
    <div class="abs mut" style="left:0;top:890px;width:1080px;text-align:center;font-weight:600;font-size:36px">${N} produits scellés, expliqués.</div>
    <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div>
    <div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`],
  ...g.items.map(([img, name, alias, what, price, from], i) => [`${i + 2}-${img.replace(/^item-[a-z]+-|\.\w+$/g, '')}`, `${track(i + 1, 335, .1)}${head(`PRODUIT ${i + 1} / ${N}`, game, g.sub)}
    <div class="abs h" style="left:70px;top:150px;font-size:100px;white-space:nowrap">${name}</div>
    <div class="abs ui" style="left:72px;top:262px;font-size:32px;color:${C}">${alias}</div>
    ${photo(img, 300, 400, 480, i % 2 ? 2 : -2)}
    <div class="abs ui" style="left:70px;right:70px;top:935px;font-size:42px;line-height:1.3;text-align:center">${what}</div>
    ${price ? `<div class="abs h" style="left:0;top:1105px;width:1080px;text-align:center;font-size:52px;color:${SUN}">${eur(price[1])}<span class="mut" style="font-family:Exo;font-weight:600;font-size:28px"> · ${price[0]}, prix du 07/10/2026</span></div>` : ''}
    ${src(`Sources : ${from}, relevé le 07/10/2026. ${g.credit}`)}`]),
  [`${N + 2}-boostz`, `${ghosts([[100, 520, 80, -6], [900, 540, 90, 8], [110, 1120, 70, 4], [920, 1100, 80, -6]])}${track(N + 1, 1200, .6)}${head('SUR BOOSTZ', game, g.sub)}
    <div class="abs h" style="left:0;top:200px;width:1080px;text-align:center;font-size:96px">Tes scellés aussi<br><span class="acc">ont une cote.</span></div>
    ${back(game, 330, 470, 180, -8, 2)}${back(game, 560, 470, 180, 7, 2)}
    ${closing(800)}`],
]);
</script></body></html>
