<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz analyse de carte</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  /* The onboarding's visual language: flat table, stickers with a white outline
     and a hard shadow, a dashed path that runs on from one slide to the next. */
  .p { position: relative; overflow: hidden; width: 1080px; height: 1350px; margin-bottom: 20px; color: #F5F2FB; font-family: Exo; background: #131020; }
  .abs { position: absolute; }
  .h { font-family: Outfit; font-weight: 800; line-height: 1.02; letter-spacing: -1px; }
  .ui { font-family: Poppins; font-weight: 700; }
  .lab { font-family: 'DM Sans'; font-weight: 700; letter-spacing: 4px; }
  .mut { color: #A8A2B8; }
  .acc { color: #C4B5FD; }
  .word { font-family: Outfit; font-weight: 800; line-height: 1; }
  .grad { background: linear-gradient(135deg, #FF4FA0 0%, #8B3DFF 55%, #3AA9FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .st { position: absolute; background: #1D1730; border: 6px solid #F5F2FB; border-radius: 36px; box-shadow: 12px 12px 0 #05040A; }
  .src { position: absolute; left: 70px; right: 70px; bottom: 34px; font-family: Exo; font-size: 20px; line-height: 1.35; color: rgba(255,255,255,.42); }
</style></head><body>
<script>
const SHADOW = '#05040A', VSOFT = '#C4B5FD', DARK = '#1A1424', DONE = '#5FD3A3', GOLD = '#F0C066', SUN = '#FCD34D', VIOLET = '#7C3AED', PINK = '#F0899A';
const emblemSvg = (id, c, size) => `<svg width="${size}" height="${size}" viewBox="0 0 48 48">${EMBLEMS[id].replace(/COLOR/g, c)}</svg>`;
const wordmark = (size) => `<div style="display:flex;align-items:baseline;transform:skewX(-8deg)"><span class="word" style="font-size:${size}px;color:#fff">boost</span><span style="position:relative;display:inline-block">`
  + [['#3AA9FF', -0.59, .12], ['#8B3DFF', -0.39, .2], ['#FF4FA0', -0.185, .3]].map(([c, l, o]) => `<span class="word" style="font-size:${size}px;position:absolute;top:0;left:${l * size}px;color:${c};opacity:${o}">Z</span>`).join('')
  + `<span class="word grad" style="font-size:${size}px;position:relative;color:transparent">Z</span></span></div>`;
const st = (x, y, w, h, inner, o = {}) => `<div class="st" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${o.fill ? 'background:' + o.fill + ';' : ''}transform:rotate(${o.r || 0}deg);${o.z ? 'z-index:' + o.z + ';' : ''}">${inner}</div>`;
const disc = (x, y, d, fill, inner, r = 0) => `<div class="abs" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;background:${fill};border:6px solid #F5F2FB;box-shadow:12px 12px 0 ${SHADOW};display:flex;align-items:center;justify-content:center;transform:rotate(${r}deg);z-index:4">${inner}</div>`;
// The real card, stuck on like the onboarding's stickers: white outline, hard shadow, no glow.
const card = (x, y, w, r = 0) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.397}px;transform:rotate(${r}deg);border:8px solid #F5F2FB;border-radius:${w * .055}px;overflow:hidden;box-shadow:16px 16px 0 ${SHADOW};z-index:2"><img src="assets/carte-mega-dracaufeu-x-pfl130.jpg" style="width:100%;height:100%;display:block;object-fit:cover"></div>`;
const ghosts = (list) => list.map(([x, y, w, r]) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;border:4px solid rgba(255,255,255,.14);border-radius:${w * .16}px;transform:rotate(${r}deg)"><div style="width:60%;height:6px;margin:${w * .1}px auto 0;border-radius:3px;background:rgba(255,255,255,.14)"></div></div>`).join('');
// One dashed path across the five slides: each slide shows its own 1080 px of it, so a swipe carries it on.
const TRACK = 'M-20 760 C200 700 300 820 540 780 S900 640 1080 700 S1400 860 1620 800 S1980 600 2160 680 S2500 900 2700 820 S3060 640 3240 720 S3600 880 3780 820 S4140 640 4320 700 S4700 860 4900 800 S5300 700 5420 740';
const track = (k) => `<svg class="abs" width="1080" height="1350" viewBox="${k * 1080} 0 1080 1350" style="left:0;top:0"><path d="${TRACK}" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/></svg>`;
const head = (kicker) => `<div class="abs lab" style="left:70px;top:66px;font-size:24px;letter-spacing:6px;color:${VSOFT}">${kicker}</div>
  <div class="abs" style="right:70px;top:46px;display:flex;align-items:center;gap:20px;z-index:5"><div style="text-align:right"><div class="lab" style="font-size:21px;letter-spacing:5px;color:#F5C93B">POKÉMON</div><div style="font-weight:600;font-size:24px;color:rgba(245,242,251,.75);margin-top:2px">Flammes Fantasmagoriques</div></div>
  <div style="width:76px;height:76px;border-radius:50%;background:#F5C93B;border:5px solid #F5F2FB;box-shadow:8px 8px 0 ${SHADOW};display:flex;align-items:center;justify-content:center">${emblemSvg('pokemon', DARK, 44)}</div></div>`;
const euro = (v) => v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' €';
// Cardmarket via TCGdex, as recorded by the price workflow on 03/10/2026 (donnees/cotes/pokemon/2026-10-03.json, me02-130).
const CM = { avg7: 279.11, avg30: 265.69, trend: 268.43, low: 180 };
const SRC_COTE = 'Cardmarket via TCGdex, relevé Boostz du 03/10/2026 (plus bas = annonce la moins chère, tous états). PSA 10 : ventes eBay de septembre 2026, 1 € = 1,135 $.';
const SRC_TAUX = 'Taux : TCGplayer, 1 Méga Hyper Rare pour 1 260 boosters. Display de 36 boosters ≈ 250 €, prix publics FR. Cardmarket via TCGdex, relevé Boostz du 03/10/2026.';
const TIMES = Math.round(8750 / CM.avg30);
const SRC_VERDICT = `${TIMES} × : ≈ 8 750 € de boosters ÷ ${euro(CM.avg30)}. 1 chance sur 3 : 37 % de ne pas l’avoir après 1 260 boosters.`;
const POSTS = [];

// 1 - Cover: the card stuck on, its name, the question.
POSTS.push(['a1-couverture', `${ghosts([[80, 300, 80, -6], [920, 980, 90, 8], [130, 1150, 70, 4]])}${track(0)}${head('ANALYSE DE CARTE')}
  ${card(305, 160, 470, -4)}
  ${st(680, 220, 330, 110, `<div class="ui" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:34px;color:${DARK}">La seule du set</div>`, { fill: SUN, r: 7, z: 3 })}
  <div class="abs h" style="left:0;top:880px;width:1080px;text-align:center;font-size:90px">Méga-Dracaufeu X ex</div>
  <div class="abs mut" style="left:0;top:985px;width:1080px;text-align:center;font-weight:600;font-size:34px">130/094 · Méga Hyper Rare</div>
  <div class="abs h" style="left:0;top:1060px;width:1080px;text-align:center;font-size:72px">Elle vaut <span class="acc">combien ?</span></div>
  <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div>
  <div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`]);

// 2 - The cote: one big price, three smaller ones, then the graded range.
POSTS.push(['a2-la-cote', `${ghosts([[900, 1040, 80, 6], [60, 1180, 70, -4]])}${track(1)}${head('LA COTE')}
  ${card(70, 175, 300, -5)}
  ${st(420, 180, 590, 300, `<div style="padding:34px 40px"><div class="lab mut" style="font-size:22px">PRIX MOYEN · 30 JOURS</div><div class="h" style="font-size:118px;margin-top:8px;white-space:nowrap">${euro(CM.avg30)}</div></div>`, { r: 2, z: 3 })}
  ${[['Plus bas', CM.low, PINK, -3], ['Sur 7 jours', CM.avg7, '#F5F2FB', 2], ['Tendance', CM.trend, DONE, -2]].map(([k, v, c, r], i) => st(70 + i * 318, 640, 290, 190, `<div style="padding:26px 28px"><div class="ui mut" style="font-size:28px;font-weight:600">${k}</div><div class="h" style="font-size:54px;margin-top:10px;white-space:nowrap;color:${c}">${euro(v)}</div></div>`, { r, z: 3 })).join('')}
  ${st(70, 900, 640, 240, `<div style="padding:30px 38px;color:${DARK}"><div class="lab" style="font-size:22px">GRADÉE PSA 10</div><div class="h" style="font-size:72px;margin-top:6px;white-space:nowrap">1 230 à 2 640 €</div><div class="ui" style="font-size:26px;font-weight:600;margin-top:4px">ventes eBay de septembre 2026</div></div>`, { fill: GOLD, r: -2, z: 3 })}
  ${disc(770, 900, 230, VIOLET, `<div style="text-align:center;color:#fff"><div class="h" style="font-size:96px;line-height:1">×10</div><div class="ui" style="font-size:24px;margin-top:6px">au plus haut</div></div>`, 6)}
  <div class="src">${SRC_COTE}</div>`]);

// 3 - Rarity: 35 displays, one lit; what the hunt costs against the card alone.
const box = (lit) => `<svg width="96" height="96" viewBox="0 0 100 100"><path d="M22 36 L38 22 L80 22 L64 36 Z" fill="${lit ? '#F5F2FB' : 'rgba(196,181,253,.22)'}"/><path d="M64 36 L80 22 L80 66 L64 80 Z" fill="${lit ? VSOFT : 'rgba(196,181,253,.12)'}"/><rect x="22" y="36" width="42" height="44" rx="5" fill="${lit ? VIOLET : '#2A2140'}" stroke="${lit ? '#F5F2FB' : 'rgba(196,181,253,.3)'}" stroke-width="${lit ? 4 : 2}"/><path d="M33 47 H54 V52.5 L42 65 H54 V70.5 H33 V65 L45 52.5 H33 Z" fill="${lit ? '#fff' : 'rgba(255,255,255,.22)'}"/></svg>`;
POSTS.push(['a3-1-chance-sur-1260', `${track(2)}${head('LA RARETÉ')}
  <div class="abs h" style="left:0;top:140px;width:1080px;text-align:center;font-size:112px">1 chance<br><span class="acc">sur 1 260.</span></div>
  <div class="abs mut" style="left:0;top:395px;width:1080px;text-align:center;font-weight:600;font-size:36px">C’est la seule Méga Hyper Rare du set.</div>
  <div class="abs" style="left:150px;top:470px;width:780px;display:grid;grid-template-columns:repeat(7,1fr);justify-items:center;row-gap:6px;z-index:2">${Array.from({ length: 35 }, (_, i) => `<div style="${i === 22 ? `filter:drop-shadow(8px 8px 0 ${SHADOW});transform:scale(1.25) rotate(-6deg)` : ''}">${box(i === 22)}</div>`).join('')}</div>
  ${st(70, 1010, 450, 200, `<div style="padding:26px 32px"><div class="lab mut" style="font-size:19px;letter-spacing:2px;white-space:nowrap">POUR LA TIRER, EN MOYENNE</div><div class="h" style="font-size:66px;margin-top:6px;white-space:nowrap">≈ 8 750 €</div><div class="mut" style="font-weight:600;font-size:24px">35 displays de 36 boosters</div></div>`, { r: -2, z: 3 })}
  ${st(560, 1010, 450, 200, `<div style="padding:26px 32px;color:${DARK}"><div class="lab" style="font-size:19px;letter-spacing:2px;white-space:nowrap">POUR L’ACHETER, SEULE</div><div class="h" style="font-size:66px;margin-top:6px;white-space:nowrap">≈ ${Math.round(CM.avg30)} €</div><div class="ui" style="font-weight:600;font-size:24px">prix moyen Cardmarket</div></div>`, { fill: DONE, r: 2, z: 3 })}
  <div class="src">${SRC_TAUX}</div>`]);

// 4 - The verdict.
POSTS.push(['a4-le-verdict', `${ghosts([[80, 520, 80, -6], [920, 1100, 80, 6]])}${track(3)}${head('LE VERDICT')}
  <div class="abs h" style="left:0;top:170px;width:1080px;text-align:center;font-size:104px">Tu la veux ?<br><span class="acc">Achète-la.</span></div>
  ${card(380, 450, 320, 4)}
  ${disc(700, 520, 210, SUN, `<div style="text-align:center;color:${DARK}"><div class="h" style="font-size:84px;line-height:1">${TIMES}×</div><div class="ui" style="font-size:22px;margin-top:4px">son prix<br>pour l’ouvrir</div></div>`, 8)}
  <div class="abs" style="left:110px;top:960px;width:860px;text-align:center;font-weight:600;font-size:38px;line-height:1.4;color:rgba(245,242,251,.85)">L’ouvrir te coûterait ${TIMES} fois son prix,<br>et même après 1 260 boosters, tu aurais<br><b class="ui" style="color:#fff">1 chance sur 3 de repartir sans.</b></div>
  <div class="src">${SRC_VERDICT}</div>`]);

// 5 - Follow it on Boostz.
POSTS.push(['a5-suis-sa-cote', `${ghosts([[90, 300, 80, -6], [900, 360, 90, 8], [110, 1120, 70, 4], [920, 1080, 80, -6]])}${track(4)}
  <div class="abs h" style="left:0;top:170px;width:1080px;text-align:center;font-size:104px">Suis sa cote<br><span class="acc">sur Boostz.</span></div>
  ${card(380, 450, 320, -3)}
  <div class="abs" style="left:0;top:1000px;width:1080px;display:flex;justify-content:center">${wordmark(100)}</div>
  <div class="abs mut" style="left:0;top:1135px;width:1080px;text-align:center;font-weight:600;font-size:38px">Ton compagnon TCG, bientôt sur ton téléphone</div>`]);

document.body.innerHTML = POSTS.map(([id, html]) => `<div class="p" id="${id}">${html}</div>`).join('');
</script></body></html>
