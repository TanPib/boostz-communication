<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz deux sorties</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// Sortie d'extension, two in one week: Yu-Gi-Oh! Magnificent Maestros (Europe
// 12/11/2026) and Magic: The Gathering × Star Trek (13/11/2026).
// Facts searched on 06/10/2026: yugioh-card.com/eu and ICv2 (Maestros: 125
// cards, 18 reimagined anime cards, Grand Master Rare numbered 001-100, a box of
// 3 packs); magic.wizards.com, draftsim, thegamer (Star Trek: 135 cards, signed
// headliner cards in Collector Boosters); French retailer prices.
const SUB = 'Deux sorties cette semaine';
const headBoth = (kicker) => `<div class="abs lab" style="left:70px;top:66px;font-size:24px;letter-spacing:6px;color:${VSOFT}">${kicker}</div>
  <div class="abs" style="right:70px;top:46px;display:flex;gap:16px;z-index:5">${emblemDisc('yugioh', 76)}${emblemDisc('magic', 76)}</div>`;
carousel([
  ['1-couverture', `${ghosts([[940, 1100, 70, 8]])}${track(0, 1150, .5)}${headBoth('SORTIES D’EXTENSION')}
    ${card('assets/sortie-magnificent-maestros.webp', 80, 190, 440, -4, 3, { h: 360, pos: 'center 45%' })}
    ${card('assets/sortie-magic-star-trek.jpg', 560, 230, 440, 3, 3, { h: 330 })}
    <div class="abs h" style="left:0;top:660px;width:1080px;text-align:center;font-size:100px">Cette semaine,<br><span class="acc">deux sorties.</span></div>
    <div class="abs ui" style="left:0;top:900px;width:1080px;text-align:center;font-size:40px;line-height:1.5"><span style="color:${GAMES.yugioh[1]}">Yu-Gi-Oh! Magnificent Maestros</span> · jeudi 12/11<br><span style="color:${GAMES.magic[1]}">Magic × Star Trek</span> · vendredi 13/11</div>
    <div class="abs" style="left:70px;top:1240px">${wordmark(46)}</div>
    <div class="abs ui mut" style="right:70px;top:1248px;font-size:30px">Swipe →</div>`],
  ['2-maestros', `${track(1, 1200, .25)}${head('JEUDI 12/11', 'yugioh', 'Magnificent Maestros')}
    <div class="abs h" style="left:70px;top:170px;font-size:92px">Les cartes<br><span style="color:${GAMES.yugioh[1]}">de l’anime, refaites.</span></div>
    ${[['125', 'cartes au total'], ['18', 'cartes de l’anime réimaginées'], ['100', 'exemplaires numérotés de chaque Grand Master Rare']].map(([n, k], i) =>
      st(70, 430 + i * 200, 940, 170, `<div style="display:flex;align-items:center;gap:36px;height:100%;padding:0 44px"><div class="h" style="font-size:84px;color:${[SUN, VSOFT, DONE][i]};width:190px">${n}</div><div class="ui" style="font-size:36px;line-height:1.2">${k}</div></div>`, { r: [-1, 1, -1][i], z: 3 })).join('')}
    <div class="abs mut" style="left:70px;right:70px;top:1050px;font-weight:600;font-size:32px;text-align:center">Les plus attendues : les nouvelles versions de<br>Blue-Eyes, Cyber End Dragon et Neo Galaxy-Eyes.</div>
    ${src('Sources : yugioh-card.com (Europe), ICv2, chaoscards.co.uk, relevé le 06/10/2026.')}`],
  ['3-star-trek', `${track(2, 1200, .25)}${head('VENDREDI 13/11', 'magic', 'Star Trek')}
    <div class="abs h" style="left:70px;top:170px;font-size:92px">60 ans de Star Trek,<br><span style="color:${GAMES.magic[1]}">en cartes Magic.</span></div>
    ${[['135', 'cartes dans le set principal'], ['4', 'decks Commander, dont « We Are the Borg »'], ['≈ 200', 'exemplaires signés par Shatner, Mulgrew ou Stewart']].map(([n, k], i) =>
      st(70, 430 + i * 200, 940, 170, `<div style="display:flex;align-items:center;gap:36px;height:100%;padding:0 44px"><div class="h" style="font-size:80px;color:${[SUN, VSOFT, DONE][i]};width:220px;white-space:nowrap">${n}</div><div class="ui" style="font-size:34px;line-height:1.2">${k}</div></div>`, { r: [1, -1, 1][i], z: 3 })).join('')}
    <div class="abs mut" style="left:70px;right:70px;top:1050px;font-weight:600;font-size:32px;text-align:center">Les cartes signées des capitaines Kirk, Janeway<br>et Picard ne sortent que des boosters collector.</div>
    ${src('Sources : magic.wizards.com, draftsim.com, thegamer.com, relevé le 06/10/2026. Tirage des cartes signées annoncé autour de 200.')}`],
  ['4-prix', `${track(3, 790, .35)}${headBoth('LE PRIX')}
    <div class="abs h" style="left:70px;top:170px;font-size:100px">Tu ouvres<br><span class="acc">lequel ?</span></div>
    ${st(70, 450, 940, 300, `<div style="padding:36px 46px;color:${DARK}"><div class="lab" style="font-size:22px">YU-GI-OH! · BOÎTE DE 3 BOOSTERS</div><div class="h" style="font-size:100px;margin-top:12px;white-space:nowrap">${eur(32.9)} à ${eur(39.9)}</div><div class="ui" style="font-size:28px;margin-top:6px">en français, selon les boutiques</div></div>`, { fill: GAMES.yugioh[1], r: -1.5, z: 3 })}
    ${st(70, 820, 940, 300, `<div style="padding:36px 46px;color:${DARK}"><div class="lab" style="font-size:22px">MAGIC · DISPLAY DE 30 BOOSTERS</div><div class="h" style="font-size:100px;margin-top:12px;white-space:nowrap">${eur(180)} à ${eur(182.4)}</div><div class="ui" style="font-size:28px;margin-top:6px">en français, selon les boutiques</div></div>`, { fill: GAMES.magic[1], r: 1.5, z: 3 })}
    ${src('Prix en précommande relevés le 06/10/2026 : lerepairedudragon.fr, nexthobby.fr (Yu-Gi-Oh!), ludisphere.fr, maxireves.fr (Magic).')}`],
  ['5-suis-leur-cote', `${ghosts([[100, 520, 80, -6], [900, 540, 90, 8], [110, 1120, 70, 4], [920, 1100, 80, -6]])}${track(4, 1200, .6)}${headBoth('SUR BOOSTZ')}
    <div class="abs h" style="left:0;top:200px;width:1080px;text-align:center;font-size:96px">Dis-nous en<br><span class="acc">commentaire !</span></div>
    ${back('yugioh', 330, 470, 180, -8, 2)}${back('magic', 560, 470, 180, 7, 2)}
    ${closing(800)}`],
]);
</script></body></html>
