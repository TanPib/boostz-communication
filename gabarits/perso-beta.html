<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>BoostZ annonce perso</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script><script src="stickers.js"></script>
</head><body><script>
// TanPib's own announcement, for his personal Instagram and Facebook accounts
// (asked on 14/11/2026, the day the beta opens): « j'ai développé une appli,
// la bêta ouvre aujourd'hui, j'ai besoin de testeurs ». For friends and
// family, so it stays simple: one 4:5 image for the post, one 9:16 image for
// the story (he adds the link sticker to boostz.fr/beta and the mention of
// @boostz.app by hand). First person, no marketing line, the real home screen
// of the app, no store badge and no TestFlight link. « une appli » is in the
// plain accent colour: the brand gradient on it read as « trop IA » to him.
// No « ÇA Y EST » above the title either: it read as showing off (same day).
// Render: node rendu.mjs perso-beta.html images
document.head.insertAdjacentHTML('beforeend', '<style>#story { height: 1920px; }</style>');
const phone = (x, y, w, r) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${Math.round((w - 16) * 2.164) + 16}px;border-radius:${w * .13}px;background:#131020;border:8px solid ${INK};box-shadow:14px 14px 0 ${SHADOW};overflow:hidden;transform:rotate(${r}deg);z-index:4"><img src="shots/app-accueil.jpg" style="width:100%;display:block"></div>`;
const icon = (x, y, w, r) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w}px;border-radius:${w * .22}px;overflow:hidden;border:8px solid ${INK};box-shadow:14px 14px 0 ${SHADOW};transform:rotate(${r}deg);z-index:5"><img src="assets/icone-app.png" style="width:100%;height:100%;display:block"></div>`;
const ask = (x, y, w, h, size, r) => st(x, y, w, h, `<div class="h" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:${size}px;line-height:1.05;color:${DARK};text-align:center">Je cherche<br>des testeurs</div>`, { fill: SUN, r, z: 6 });

carousel([
  ['post', `${ghosts([[950, 70, 80, 8]])}
    <div class="abs h" style="left:70px;top:118px;font-size:120px">J’ai développé<br><span class="acc">une appli.</span></div>
    ${icon(70, 440, 170, -4)}
    <div class="abs" style="left:285px;top:478px">${wordmark(92)}</div>
    <div class="abs ui" style="left:70px;top:655px;width:540px;font-size:38px;line-height:1.3">Pour les collectionneurs de cartes : Pokémon, Magic, One Piece, Lorcana…</div>
    <div class="abs ui" style="left:70px;top:822px;font-size:34px;color:${VSOFT};white-space:nowrap">La bêta ouvre aujourd’hui.</div>
    ${ask(70, 905, 500, 180, 60, -2)}
    <div class="abs h" style="left:70px;top:1120px;font-size:68px">boostz.fr/beta</div>
    <div class="abs ui" style="left:72px;top:1200px;font-size:32px;color:${VSOFT}">Android et iPhone · dès 15 ans</div>
    <div class="abs ui" style="left:72px;top:1262px;font-size:32px;white-space:nowrap">Une question ? Écrivez-moi en message privé.</div>
    ${phone(650, 440, 360, 4)}`],
  ['story', `${ghosts([[40, 205, 80, -8], [960, 215, 70, 6], [70, 1690, 90, 10], [910, 1700, 100, -6]])}
    <div class="abs h" style="left:0;top:356px;width:1080px;text-align:center;font-size:124px">J’ai développé<br><span class="acc">une appli.</span></div>
    <div class="abs ui" style="left:60px;top:640px;width:960px;text-align:center;font-size:38px;line-height:1.35">BoostZ, pour les collectionneurs de cartes<br>Pokémon, Magic, One Piece, Lorcana…<br><span class="acc">La bêta ouvre aujourd’hui.</span></div>
    ${phone(110, 810, 330, -4)}
    ${icon(590, 830, 200, 4)}
    ${ask(520, 1090, 460, 200, 62, 3)}
    <div class="abs ui" style="left:520px;top:1340px;width:470px;font-size:36px;line-height:1.3">Sur Android et sur iPhone, dès 15 ans.</div>
    <div class="abs h" style="left:0;top:1520px;width:1080px;text-align:center;font-size:84px">boostz.fr/beta</div>
    <div class="abs ui" style="left:0;top:1622px;width:1080px;text-align:center;font-size:34px;color:${VSOFT}">Une question ? Écris-moi en message privé.</div>`]
]);
</script></body></html>
