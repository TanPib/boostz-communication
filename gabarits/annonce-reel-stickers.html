<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Boostz lancement stickers</title>
<link rel="stylesheet" href="fonts/local.css">
<script src="posts-emblems.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  /* The onboarding's look: a flat near-black ground, UI pieces drawn as stickers
     (white outline, hard offset shadow, no blur), a dashed path running between
     them, and faint card outlines scattered behind. */
  .p { position: relative; overflow: hidden; width: 1080px; height: 1920px; margin-bottom: 20px; color: #fff; font-family: Exo; background: #131020; }
  .abs { position: absolute; }
  .st { position: absolute; background: #1D1730; border: 6px solid #F5F2FB; border-radius: 36px; box-shadow: 12px 12px 0 #05040A; }
  .h { font-family: Outfit; font-weight: 800; line-height: 1.02; letter-spacing: -1px; }
  .ui { font-family: Poppins; font-weight: 700; }
  .mut { color: #A39CB8; }
  .word { font-family: Outfit; font-weight: 800; line-height: 1; }
  .grad { background: linear-gradient(135deg, #FF4FA0 0%, #8B3DFF 55%, #3AA9FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ex { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-family: 'DM Sans'; font-weight: 700; font-size: 20px; letter-spacing: 3px; color: rgba(255,255,255,.3); }
</style></head><body>
<script>
const LAV = '#C9B8FF', GREEN = '#5FD3A0', YELLOW = '#F5C451', PINK = '#F49AC1', INK = '#15121E';
const ART = ['#5B4A9E', '#2F6A87', '#8A5B3E', '#3F7A56'];
const emblemSvg = (id, c, size) => `<svg width="${size}" height="${size}" viewBox="0 0 48 48">${EMBLEMS[id].replace(/COLOR/g, c)}</svg>`;
const wordmark = (size) => `<div style="display:flex;align-items:baseline;transform:skewX(-8deg)"><span class="word" style="font-size:${size}px;color:#fff">boost</span><span style="position:relative;display:inline-block">`
  + [['#3AA9FF', -0.59, .12], ['#8B3DFF', -0.39, .2], ['#FF4FA0', -0.185, .3]].map(([c, l, o]) => `<span class="word" style="font-size:${size}px;position:absolute;top:0;left:${l * size}px;color:${c};opacity:${o}">Z</span>`).join('')
  + `<span class="word grad" style="font-size:${size}px;position:relative;color:transparent">Z</span></span></div>`;
// The app header's own logo: "boost" and the Z in its rounded purple tile.
const appLogo = (x, y) => `<div class="abs" style="left:${x}px;top:${y}px;display:flex;align-items:center;gap:8px"><span class="word" style="font-size:52px">boost</span><span style="width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#8B3DFF,#C9B8FF);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)"><svg width="30" height="30" viewBox="36 28 28 32"><path d="M39.5 31.5 H60.5 V37.5 L48.5 50 H60.5 V56 H39.5 V50 L51.5 37.5 H39.5 Z" fill="#fff"/></svg></span></div>`;
const st = (x, y, w, h, inner, o = {}) => `<div class="st" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${o.fill ? 'background:' + o.fill + ';' : ''}${o.r ? 'transform:rotate(' + o.r + 'deg);' : ''}${o.z ? 'z-index:' + o.z + ';' : ''}${o.css || ''}">${inner}</div>`;
// A card drawn the onboarding way: a colour block for the art, two grey lines for the text.
const mini = (w, art, o = {}) => `<div style="width:${w}px;height:${w * 1.4}px;border-radius:${w * .1}px;background:#2A2440;padding:${w * .1}px;${o.css || ''}"><div style="height:${w * .1}px;width:60%;border-radius:9px;background:#5A5470"></div><div style="height:${w * .62}px;margin-top:${w * .08}px;border-radius:${w * .06}px;background:${art}"></div><div style="height:${w * .06}px;width:80%;margin-top:${w * .1}px;border-radius:9px;background:#4A4460"></div><div style="height:${w * .06}px;width:55%;margin-top:${w * .05}px;border-radius:9px;background:#4A4460"></div></div>`;
// The real card backs from the design system, wrapped as stickers.
const back = (game, x, y, w, r) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.383}px;transform:rotate(${r}deg);border:5px solid #fff;border-radius:${w * .09}px;overflow:hidden;box-shadow:10px 10px 0 #05040A"><img src="assets/dos-${game}.svg" style="width:100%;height:100%;display:block"></div>`;
const path = (d, w = 12) => `<svg class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"><path d="${d}" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/></svg>`;
// The faint card outlines the onboarding scatters behind everything.
const ghosts = (list) => list.map(([x, y, w, r]) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.4}px;border:4px solid rgba(255,255,255,.13);border-radius:${w * .16}px;transform:rotate(${r || 0}deg)"><div style="width:44%;height:5px;margin:${w * .14}px auto 0;border-radius:3px;background:rgba(255,255,255,.13)"></div></div>`).join('');
const check = (on) => `<span style="width:40px;height:40px;flex:none;border-radius:10px;border:4px solid ${on ? INK : '#A39CB8'};background:${on ? INK : 'transparent'};display:flex;align-items:center;justify-content:center">${on ? '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</span>`;
const chip = (label, on, x, y) => st(x, y, 'auto', 96, `<div class="ui" style="display:flex;align-items:center;gap:16px;height:100%;padding:0 26px;font-size:34px;color:${on ? INK : '#fff'}">${check(on)}${label}</div>`, { fill: on ? LAV : '#1F1A2E', css: 'width:auto;border-radius:24px;box-shadow:8px 8px 0 #05040A' });
const title = (a, b, sub) => `<div class="abs h" style="left:80px;top:1290px;font-size:104px">${a}<br>${b}</div><div class="abs mut" style="left:80px;top:1530px;width:900px;font-size:42px;line-height:1.45">${sub}</div>`;
const FRAMES = [];

// A - The hook: the brand wordmark, the eight games' backs slapped around it as stickers.
FRAMES.push(['A-accroche', `${ghosts([[90, 120, 90, -8], [880, 260, 80, 6], [140, 1500, 100, 10], [860, 1640, 110, -6], [520, 90, 70, 0]])}
  ${path('M-20 1250 C200 1190 300 1300 520 1250 S880 1150 1100 1230')}
  ${back('pokemon', 90, 330, 230, -12)}${back('onepiece', 400, 250, 240, 4)}${back('lorcana', 730, 340, 230, 13)}
  ${back('magic', 70, 1290, 200, 9)}${back('yugioh', 440, 1350, 200, -5)}${back('starwarsunlimited', 790, 1280, 200, -11)}
  <div class="abs" style="left:0;top:800px;width:1080px;display:flex;justify-content:center">${wordmark(210)}</div>
  <div class="abs h" style="left:0;top:1030px;width:1080px;text-align:center;font-size:92px">ta collection</div>
  ${st(700, 640, 280, 120, `<div class="ui" style="display:flex;align-items:center;justify-content:center;gap:12px;height:100%;font-size:34px;color:${INK}"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Reconnue</div>`, { fill: GREEN, r: 6, z: 3 })}
  ${st(90, 650, 300, 120, `<div class="ui" style="display:flex;align-items:center;justify-content:center;gap:14px;height:100%;font-size:40px;color:${INK}"><span style="width:50px;height:50px;border-radius:50%;border:4px solid ${INK};display:flex;align-items:center;justify-content:center;font-size:28px">b</span>+300</div>`, { fill: YELLOW, r: -7, z: 3 })}
  <div class="ex">PROPOSITION · PLAN 1, L'ACCROCHE</div>`]);

// The app's intro palette (components/intro/introPalette.js), for the new frames.
const VSOFT = '#C4B5FD', DONE = '#5FD3A3', BLUE = '#63B7FF', GOLD = '#F0C066', TEAL = '#5FDCDC', SUN = '#FCD34D', DARK = '#1A1424';
const GAMES = [['pokemon', '#F5C93B'], ['onepiece', '#F2706C'], ['lorcana', '#35C6BC'], ['yugioh', '#B189E8'], ['magic', '#C0A183'], ['starwarsunlimited', '#A9B2C4'], ['dragonball', '#F58A4E'], ['wow', '#58A6DD']];
// Titles sit high and centred: the bottom quarter of a Reel belongs to the caption and the buttons.
const head = (a, b, top = 170, size = 112) => `<div class="abs h" style="left:0;top:${top}px;width:1080px;text-align:center;font-size:${size}px">${a}<br><span style="color:${VSOFT}">${b}</span></div>`;
const disc = (x, y, d, fill, inner, r = 0) => `<div class="abs" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;background:${fill};border:6px solid #fff;box-shadow:10px 10px 0 #05040A;display:flex;align-items:center;justify-content:center;transform:rotate(${r}deg);z-index:4">${inner}</div>`;
const icon = (d, c, s = 56) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="${d}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// 2 - Eight backs fanned like a hand of cards, each with its emblem stamped on; the call to action as the app's button.
FRAMES.push(['B-8-tcg', `${ghosts([[80, 130, 80, -6], [900, 140, 90, 8], [120, 1660, 90, 6], [880, 1600, 100, -8]])}
  ${path('M-20 1640 C220 1580 380 1700 560 1640 S900 1560 1100 1600')}
  ${head('8 TCG.', 'Une seule app.')}
  ${GAMES.map(([g], i) => { const a = -35 + i * 10; return `<div class="abs" style="left:410px;top:650px;width:260px;height:360px;transform-origin:50% 170%;transform:rotate(${a}deg);z-index:${i}">${back(g, 0, 0, 260, 0)}</div>`; }).join('')}
  ${GAMES.map(([g, c], i) => { const a = (-35 + i * 10) * Math.PI / 180; return disc(540 + 690 * Math.sin(a) - 48, 1262 - 690 * Math.cos(a) - 48, 96, c, emblemSvg(g, DARK, 54)); }).join('')}
  <div class="abs" style="left:262px;top:1342px;width:580px;height:130px;border-radius:30px;background:#05040A"></div>
  <div class="abs ui" style="left:250px;top:1330px;width:580px;height:130px;border-radius:30px;background:#7C3AED;border:6px solid #fff;display:flex;align-items:center;justify-content:center;gap:18px;font-size:46px;z-index:5">Choisis tes jeux ${icon('M5 12h14M13 6l6 6-6 6', '#fff', 46)}</div>
  <div class="abs mut" style="left:0;top:1505px;width:1080px;text-align:center;font-size:44px;font-weight:600">Boostz fait le reste.</div>
  <div class="ex">PROPOSITION · PLAN 2, LES 8 TCG</div>`]);

// 3 - One card, the path splits three ways, a price at each language.
FRAMES.push(['C-cote-langues', `${ghosts([[90, 120, 80, 6], [900, 1650, 100, -6], [60, 1650, 80, 4]])}
  ${head('Ta cote,', 'dans ta langue.')}
  <svg class="abs" width="1080" height="1920" style="left:0;top:0">${[700, 960, 1220].map((y) => `<path d="M440 960 C560 960 560 ${y} 640 ${y}" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/>`).join('')}<path d="M-20 1500 C150 1480 220 1300 300 1230" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/></svg>
  ${st(70, 700, 380, 520, mini(310, ART[0], { css: 'margin:28px' }), { r: -4, z: 2 })}
  ${[['fr', 'Français', '18,40 €', 640, -2], ['en', 'Anglais', '15,60 €', 900, 2], ['ja', 'Japonais', '11,90 €', 1160, -1]].map(([f, k, v, y, r]) => st(580, y - 60, 470, 130, `<div style="display:flex;align-items:center;gap:20px;height:100%;padding:0 26px"><img src="assets/drapeau-${f}.svg" style="width:62px;height:43px;border-radius:7px;box-shadow:0 0 0 3px rgba(127,120,145,.65)"><span class="mut ui" style="font-size:32px;font-weight:600">${k}</span><span class="h" style="margin-left:auto;font-size:54px;white-space:nowrap">${v}</span></div>`, { r, z: 3 })).join('')}
  ${st(610, 1290, 420, 110, `<div class="ui" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:36px;white-space:nowrap;color:${DARK}">−35 % en japonais</div>`, { fill: SUN, r: 4, z: 4 })}
  <div class="ex">PROPOSITION · PLAN 4, LA COTE PAR LANGUE · PRIX D'EXEMPLE</div>`]);

// 4 - The trade along an arc, then what it is worth: the stonks line.
FRAMES.push(['D-echange', `${ghosts([[880, 130, 90, 6], [70, 1640, 90, -4], [900, 1660, 90, 6]])}
  ${head('Échange,', 'valeurs à l’appui.')}
  <svg class="abs" width="1080" height="1920" style="left:0;top:0"><path d="M300 760 C420 560 660 560 780 760" fill="none" stroke="rgba(196,181,253,.55)" stroke-width="14" stroke-dasharray="26 36" stroke-linecap="round"/></svg>
  ${st(110, 700, 330, 460, mini(270, ART[1], { css: 'margin:25px' }), { r: -6, z: 2 })}${st(640, 700, 330, 460, mini(270, ART[2], { css: 'margin:25px' }), { r: 5, z: 2 })}
  ${disc(470, 830, 150, BLUE, icon('M4 9h14l-4-4M20 15H6l4 4', DARK, 80))}
  <div class="abs ui" style="left:200px;top:1190px;font-size:34px;color:#A8A2B8">Tu donnes</div><div class="abs ui" style="left:740px;top:1190px;font-size:34px;color:#A8A2B8">Tu reçois</div>
  ${st(110, 1280, 860, 230, `<div style="display:flex;align-items:center;height:100%;padding:0 40px;gap:30px"><svg width="380" height="150" viewBox="0 0 380 150"><path d="M10 130 L80 112 L140 120 L200 80 L260 92 L330 30" fill="none" stroke="${DONE}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="30" r="16" fill="${DONE}" stroke="#fff" stroke-width="5"/></svg><div><div class="mut ui" style="font-size:30px;font-weight:600">Valeur de l'échange</div><div class="h" style="font-size:84px;white-space:nowrap;color:${DONE}">+12,40 €</div></div></div>`, { r: -1, z: 3 })}
  <div class="ex">PROPOSITION · PLAN 6, L'ÉCHANGE · VALEURS D'EXEMPLE</div>`]);

// 5 - The real forum on a phone sticker, the three kinds of meet-ups stuck around it.
FRAMES.push(['E-commu', `${ghosts([[80, 120, 80, -6], [900, 1650, 100, 6]])}
  ${head('Tournois, brocantes,', 'boutiques.', 170, 98)}
  <div class="abs mut" style="left:0;top:420px;width:1080px;text-align:center;font-size:44px;font-weight:600">Près de chez toi.</div>
  ${path('M-20 1060 C120 1000 200 1120 300 1080 M780 900 C880 860 960 980 1100 940')}
  <div class="abs" style="left:310px;top:560px;width:460px;height:1000px;border-radius:64px;border:7px solid #fff;box-shadow:14px 14px 0 #05040A;overflow:hidden;transform:rotate(-3deg);background:#131020;z-index:2"><img src="shots/forum-rhone.png" style="width:100%;display:block"></div>
  ${st(40, 700, 340, 120, `<div class="ui" style="display:flex;align-items:center;gap:16px;height:100%;padding:0 24px;font-size:38px;color:${DARK}">${icon('M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4', DARK, 50)}Tournois</div>`, { fill: VSOFT, r: -6, z: 3 })}
  ${st(700, 1000, 360, 120, `<div class="ui" style="display:flex;align-items:center;gap:16px;height:100%;padding:0 24px;font-size:38px;color:${DARK}">${icon('M5 21V4M5 4h11l-2 4 2 4H5', DARK, 50)}Brocantes</div>`, { fill: GOLD, r: 5, z: 3 })}
  ${st(60, 1290, 360, 120, `<div class="ui" style="display:flex;align-items:center;gap:16px;height:100%;padding:0 24px;font-size:38px;color:${DARK}">${icon('M4 10h16l-1-5H5zM5 10v10h14V10M10 20v-5h4v5', DARK, 50)}Boutiques</div>`, { fill: TEAL, r: -3, z: 3 })}
  <div class="ex">PROPOSITION · PLAN 7, LA COMMU · VRAIE CAPTURE DE L'APP</div>`]);

document.body.innerHTML = FRAMES.map(([id, html]) => `<div class="p" id="${id}">${html}</div>`).join('');
</script></body></html>
